<div class="shell" id="shell">
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14.5" fill="none" style="stroke:var(--gold)" stroke-width="1.5"/><path d="M16 4 L19 16 L16 28 L13 16 Z" style="fill:var(--gold)"/><path d="M16 4 L19 16 L13 16 Z" style="fill:var(--dn)"/><circle cx="16" cy="16" r="2" style="fill:var(--bg)"/></svg>
        <div style="min-width:0"><b>La Bàn Cổ Phiếu</b><small id="brandSub">Mỹ &amp; Việt Nam · 6 nhân tố</small></div>
      </div>
      <div class="seg" role="group" aria-label="Chọn thị trường" id="mktSeg">
        <button data-m="US" aria-pressed="false">Mỹ</button>
        <button data-m="VN" aria-pressed="true">VN</button>
        <button data-m="ALL" aria-pressed="false">Cả hai</button>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Cài đặt và giả định">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- TỔNG QUAN -->
    <section class="view" id="v-home" aria-label="Tổng quan"></section>
    <!-- SÀNG LỌC -->
    <section class="view" id="v-screen" aria-label="Sàng lọc" hidden></section>
    <!-- BIỂU ĐỒ -->
    <section class="view" id="v-chart" aria-label="Biểu đồ" hidden></section>
    <!-- CHUYÊN GIA -->
    <section class="view" id="v-expert" aria-label="Chuyên gia" hidden></section>
    <!-- HỌC THUẬT -->
    <section class="view" id="v-learn" aria-label="Học thuật" hidden></section>
    <!-- DANH MỤC -->
    <section class="view" id="v-port" aria-label="Danh mục" hidden></section>
  </main>
</div>

<nav class="tabbar" aria-label="Điều hướng chính" id="tabbar">
  <button data-v="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 5l2.2 7L12 19l-2.2-7z"/></svg>La bàn</button>
  <button data-v="screen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 5h18l-7 8v5l-4 2v-7z"/></svg>Sàng lọc</button>
  <button data-v="chart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M6 4v16M12 7v12M18 3v14"/><rect x="4.2" y="8" width="3.6" height="7" rx="1" fill="currentColor" stroke="none"/><rect x="10.2" y="10" width="3.6" height="5" rx="1"/><rect x="16.2" y="6" width="3.6" height="6" rx="1" fill="currentColor" stroke="none"/></svg>Biểu đồ</button>
  <button data-v="expert"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="8" cy="8" r="3"/><circle cx="16.5" cy="9" r="2.5"/><path d="M2.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5M14 14.6c.8-.4 1.6-.6 2.5-.6 2.2 0 3.9 1.6 4.5 5"/></svg>Chuyên gia</button>
  <button data-v="learn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="M3 6.5C6 5 9 5 12 7c3-2 6-2 9-.5V19c-3-1.5-6-1.5-9 .5-3-2-6-2-9-.5z"/><path d="M12 7v12.5"/></svg>Học thuật</button>
  <button data-v="port"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 3v9h9"/><path d="M20.5 15.5A9 9 0 1 1 8.5 3.7"/></svg>Danh mục</button>
</nav>

<div class="sheet" id="sheet" hidden role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="scrim" id="scrim"></div>
  <div class="sheet-card" id="sheetCard">
    <div class="sheet-head">
      <span class="grab" aria-hidden="true"></span>
      <h3 id="sheetTitle">Chi tiết</h3>
      <button class="icon-btn" id="sheetClose" aria-label="Đóng">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
