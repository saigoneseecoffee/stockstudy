  f:'%K = (Đóng − Thấp nhất 14) ÷ (Cao nhất 14 − Thấp nhất 14) × 100 · %D = SMA3(%K)',
  pts:['Ý tưởng của George Lane: trong xu hướng tăng, giá có xu hướng đóng cửa gần đỉnh của biên độ.','> 80 quá mua, < 20 quá bán; giao cắt %K/%D trong các vùng này là tín hiệu.','Nhạy hơn RSI, phù hợp thị trường đi ngang; trong xu hướng mạnh dễ cho tín hiệu ngược sớm.'],
  thr:[['> 80','Quá mua'],['< 20','Quá bán']],
  hook:'<b>Mẹo nhớ:</b> Stochastic hỏi “giá đóng cửa gần trần hay gần sàn của 14 phiên?”.',src:'George Lane (thập niên 1950); Murphy (1999), ch. 10.'},
 {id:'volume-l',g:'Phân tích kỹ thuật',t:'Khối lượng và OBV',d:'Tiền thật đứng sau biến động giá',
  vis:()=>{ let g=''; const v=[20,24,18,30,26,44,60,38,30,52,70,90]; v.forEach((h,i)=>g+=`<rect x="${14+i*15}" y="${112-h}" width="11" height="${h}" rx="1.5" style="fill:${i%3===2?'var(--dn)':'var(--up)'};fill-opacity:.65"/>`);
    g+=`<polyline points="${v.map((h,i)=>`${19.5+i*15},${50-i*3.4-(i%3===2?-6:0)}`).join(' ')}" fill="none" style="stroke:var(--gold)" stroke-width="2"/>`;
    return sv(g+T(14,12,'OBV tăng cùng giá = xu hướng khỏe','style="font-size:8px;fill:var(--gold);font-weight:700"'),'Khối lượng và đường OBV'); },
  f:'OBV = OBV₋₁ + KL (nếu giá tăng) / − KL (nếu giá giảm)',
  pts:['Khối lượng xác nhận xu hướng: tăng giá kèm khối lượng tăng là lành mạnh.','Giá tăng mà khối lượng giảm dần: lực mua cạn — cảnh báo.','Phá vỡ hỗ trợ/kháng cự với khối lượng gấp 1,5–2 lần trung bình 20 phiên đáng tin hơn.','Ở Việt Nam, theo dõi thêm giao dịch khối ngoại và tự doanh như một lớp “khối lượng có thông tin”.','OBV tạo đỉnh mới trước giá có thể báo trước một nhịp tăng (Granville).'],
  thr:[['KL > 1,5 × MA20','Phiên đột biến']],
  hook:'<b>Mẹo nhớ:</b> “Khối lượng đi trước giá.”',src:'Joseph Granville, New Key to Stock Market Profits (1963).'},
 {id:'fibo',g:'Phân tích kỹ thuật',t:'Fibonacci thoái lui',d:'Các mức điều chỉnh 38,2% – 50% – 61,8%',

  thr:[['38,2%','Điều chỉnh khỏe'],['50–61,8%','Vùng mua phổ biến trong xu hướng tăng'],['> 78,6%','Xu hướng có thể đã gãy']],
  hook:'<b>Mẹo nhớ:</b> “3 – 5 – 6”: 38, 50, 62.',src:'Leonardo Fibonacci, Liber Abaci (1202); Murphy (1999), ch. 13.'},

  f:'Tenkan = (Cao9 + Thấp9)/2 · Kijun = (Cao26 + Thấp26)/2 · Span A = (Tenkan + Kijun)/2 dời 26 · Span B = (Cao52 + Thấp52)/2 dời 26',
  pts:['Giá trên mây: xu hướng tăng; dưới mây: giảm; trong mây: trung tính.','Mây dày là vùng hỗ trợ/kháng cự mạnh; mây mỏng dễ bị xuyên qua.','Tenkan cắt lên Kijun trên mây là tín hiệu tăng mạnh nhất.','Do Goichi Hosoda phát triển và công bố năm 1969 sau nhiều thập kỷ nghiên cứu.'],
  thr:[['Giá > mây, Tenkan > Kijun','Xu hướng tăng đầy đủ']],
  hook:'<b>Mẹo nhớ:</b> “9 – 26 – 52”.',src:'Goichi Hosoda (1969); Elliott, Ichimoku Charts (2007).'},
 {id:'elliott',g:'Phân tích kỹ thuật',t:'Sóng Elliott',d:'5 sóng đẩy, 3 sóng điều chỉnh',
  vis:()=>{ const P=[[5,105],[30,72],[45,85],[85,30],[100,52],[130,12],[148,48],[160,35],[185,72]]; let g=`<polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:var(--fg)" stroke-width="2"/>`;
    ['1','2','3','4','5','A','B','C'].forEach((l,i)=>{ const [x,y]=P[i+1]; const up=i%2===0&&i<5||i===6; g+=T(x,up?y-5:y+12,l,'text-anchor="middle" style="font-size:9px;font-weight:800;fill:'+(i<5?'var(--up)':'var(--dn)')+'"'); });
    return sv(g,'Chu kỳ 5 sóng đẩy và 3 sóng điều chỉnh'); },
  f:'Chu kỳ hoàn chỉnh = 5 sóng đẩy (1-2-3-4-5) + 3 sóng điều chỉnh (A-B-C)',
  pts:['Ba quy tắc không được vi phạm: sóng 2 không thoái lui quá 100% sóng 1; sóng 3 không phải sóng ngắn nhất; sóng 4 không đè vào vùng giá sóng 1.','Sóng 3 thường dài và mạnh nhất, đi kèm khối lượng lớn.','Lý thuyết mang tính diễn giải cao — hai nhà phân tích có thể đếm sóng khác nhau; nên dùng như khung tư duy, không phải công cụ dự báo chính xác.'],
  thr:[['Sóng 2 thoái lui 50–61,8%','Phổ biến'],['Sóng 3 ≈ 161,8% sóng 1','Mục tiêu thường gặp']],
  hook:'<b>Mẹo nhớ:</b> “Năm bước lên, ba bước lùi.”',src:'Ralph N. Elliott, The Wave Principle (1938); Frost & Prechter (1978).'},
 {id:'atr-l',g:'Phân tích kỹ thuật',t:'ATR và đặt điểm cắt lỗ',d:'Cắt lỗ theo biến động thay vì theo cảm tính',
  vis:()=>{ let g=''; const c=[[50,58,46,55],[55,60,50,52],[52,57,47,56],[56,63,54,61],[61,66,57,58],[58,64,55,63],[63,70,60,68]]; g+=candlesMini(c.map(b=>b.map(v=>v+10)));
    g+=`<line x1="10" x2="190" y1="${115-58}" y2="${115-58}" style="stroke:var(--dn)" stroke-dasharray="4 3" stroke-width="1.5"/>`+T(130,115-50,'Giá − 2 × ATR = điểm cắt lỗ','style="font-size:8px;fill:var(--dn);font-weight:700"');
    return sv(g,'Điểm cắt lỗ theo ATR'); },
  f:'TR = max(Cao − Thấp, |Cao − Đóng₋₁|, |Thấp − Đóng₋₁|) · ATR = trung bình Wilder 14 phiên của TR',
  pts:['ATR đo biên độ dao động thực, tính cả khoảng trống giá.','Đặt cắt lỗ cách giá 1,5–3 ATR giúp tránh bị “quét” bởi dao động bình thường.','Kết hợp với công cụ “Quy mô vị thế”: khoảng cách cắt lỗ lớn hơn → mua ít cổ phiếu hơn để giữ rủi ro không đổi.','Chandelier exit: dời điểm cắt lỗ theo đỉnh cao nhất − 3 ATR khi giá tăng.'],
  thr:[['ATR/giá < 2%','Biến động thấp'],['> 4%','Biến động cao (cổ phiếu nhỏ, chu kỳ)']],
  hook:'<b>Mẹo nhớ:</b> cắt lỗ phải nằm ngoài vùng “nhiễu” — tức là vài ATR.',src:'Wilder (1978); Chuck LeBeau, Chandelier Exit.'},
 {id:'ddm',g:'Định giá',t:'Mô hình chiết khấu cổ tức (DDM)',d:'Gordon Growth và cổ phiếu cổ tức',
  vis:()=>{ let g=''; for(let i=0;i<8;i++){ const d=10*Math.pow(1.05,i), pv=d/Math.pow(1.1,i+1); g+=`<rect x="${14+i*20}" y="${100-d*4}" width="14" height="${d*4}" rx="2" style="fill:var(--line2)"/><rect x="${14+i*20}" y="${100-pv*4}" width="14" height="${pv*4}" rx="2" style="fill:var(--gold)"/>`; }
    return sv(g+T(100,116,'Cổ tức tăng g = 5%/năm, chiết khấu r = 10%','text-anchor="middle" '+TS),'Cổ tức tương lai và giá trị hiện tại'); },
  f:'P₀ = D₁ ÷ (r − g)',
  pts:['Phù hợp doanh nghiệp trưởng thành, chi trả ổn định (tiện ích, tiêu dùng thiết yếu, ngân hàng lớn).','g phải nhỏ hơn r và bền vững: g ≈ ROE × (1 − tỷ lệ chi trả).','Ví dụ: D₁ = 3.000đ, r = 12%, g = 5% → P₀ = 3.000 ÷ 0,07 ≈ 42.857đ.','Ở Việt Nam, nhiều doanh nghiệp chia cổ tức bằng cổ phiếu — không phải dòng tiền, cần loại khỏi DDM.'],
  thr:[['r − g < 3%','Kết quả rất nhạy, cẩn trọng']],
  hook:'<b>Mẹo nhớ:</b> “Cổ tức năm sau chia cho khoảng cách r trừ g.”',src:'Gordon & Shapiro (1956); Gordon (1959), Review of Economics and Statistics.'},
 {id:'wacc',g:'Định giá',t:'Chi phí vốn bình quân (WACC)',d:'Mức sinh lời tối thiểu doanh nghiệp phải đạt',
  vis:()=>sv(`<rect x="15" y="30" width="110" height="34" rx="4" style="fill:var(--gold);fill-opacity:.8"/>${T(70,51,'Vốn chủ 70% × 13%','text-anchor="middle" style="font-size:8.5px;font-weight:700;fill:var(--gold-ink)"')}<rect x="125" y="30" width="60" height="34" rx="4" style="fill:var(--us);fill-opacity:.8"/>${T(155,51,'Nợ 30% × 6%','text-anchor="middle" style="font-size:8px;font-weight:700;fill:#fff"')}${T(100,88,'× (1 − thuế 20%)','text-anchor="middle" '+TS)}${T(100,108,'WACC ≈ 0,7×13% + 0,3×6%×0,8 ≈ 10,5%','text-anchor="middle" '+TB)}`,'Cấu phần WACC'),
  f:'WACC = E/V × r_E + D/V × r_D × (1 − t)',
  pts:['r_E tính bằng CAPM; r_D là lãi suất vay biên; t là thuế suất (Việt Nam 20%, Mỹ liên bang 21%).','Dùng giá trị thị trường cho E và D, không dùng giá trị sổ sách.','Thêm nợ làm giảm WACC (lá chắn thuế) đến một mức, sau đó rủi ro phá sản làm r_E và r_D tăng vọt.','WACC là “rào cản” cho ROIC và tỷ lệ chiết khấu trong DCF dòng tiền doanh nghiệp (FCFF).'],
  thr:[['WACC Mỹ (doanh nghiệp lớn)','Thường 7–10%'],['WACC Việt Nam','Thường 11–15%']],
  hook:'<b>Mẹo nhớ:</b> nợ rẻ hơn vốn chủ nhờ lá chắn thuế — nhưng không miễn phí.',src:'Modigliani & Miller (1958, 1963); Damodaran (2012).'},
 {id:'ccc',g:'Chất lượng',t:'Chu kỳ chuyển đổi tiền mặt',d:'Doanh nghiệp bị “chôn” tiền bao nhiêu ngày',
  vis:()=>sv(`<rect x="10" y="30" width="90" height="18" rx="3" style="fill:var(--us);fill-opacity:.8"/>${T(55,42,'DIO 60 ngày','text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700"')}<rect x="100" y="30" width="45" height="18" rx="3" style="fill:var(--gold);fill-opacity:.85"/>${T(122,42,'DSO 30','text-anchor="middle" style="font-size:8px;font-weight:700;fill:var(--gold-ink)"')}<rect x="10" y="58" width="70" height="18" rx="3" style="fill:var(--up);fill-opacity:.8"/>${T(45,70,'DPO 45 ngày','text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700"')}<rect x="80" y="58" width="65" height="18" rx="3" style="fill:var(--dn);fill-opacity:.7"/>${T(112,70,'CCC 45','text-anchor="middle" style="font-size:8px;fill:#fff;font-weight:700"')}${T(100,100,'CCC = DIO + DSO − DPO','text-anchor="middle" '+TB)}`,'Chu kỳ chuyển đổi tiền mặt'),
  f:'CCC = Số ngày tồn kho + Số ngày phải thu − Số ngày phải trả',
  pts:['CCC càng ngắn, doanh nghiệp càng ít cần vốn lưu động để tăng trưởng.','CCC âm (Costco, Amazon, nhiều chuỗi bán lẻ): nhà cung cấp tài trợ cho tăng trưởng.','Phải thu tăng nhanh hơn doanh thu là dấu hiệu nới tín dụng để “đẩy” doanh số — cờ vàng.','Bất động sản Việt Nam thường có tồn kho rất lớn — CCC hàng trăm ngày.'],
  thr:[['CCC < 0','Mô hình được tài trợ bởi nhà cung cấp'],['CCC tăng 3 năm liền','Kiểm tra chất lượng doanh thu']],
  hook:'<b>Mẹo nhớ:</b> “Kho + Thu − Trả”.',src:'Richards & Laughlin (1980), Financial Management 9(1).'},
 {id:'beneish',g:'Chất lượng',t:'Beneish M-Score',d:'Phát hiện dấu hiệu “xào nấu” lợi nhuận',
  vis:()=>{ const X=v=>14+(v+4)/3*172; return sv(`<rect x="${X(-4)}" y="50" width="${X(-1.78)-X(-4)}" height="18" rx="3" style="fill:var(--up);fill-opacity:.7"/><rect x="${X(-1.78)}" y="50" width="${X(-1)-X(-1.78)}" height="18" rx="3" style="fill:var(--dn);fill-opacity:.7"/>${T(X(-1.78),44,'−1,78','text-anchor="middle" '+TB)}${T(X(-3),82,'Ít khả năng thao túng','text-anchor="middle" '+TS)}${T(X(-1.35),82,'Đáng ngờ','text-anchor="middle" style="font-size:8px;fill:var(--dn);font-weight:700"')}${T(100,22,'8 biến: DSRI, GMI, AQI, SGI, DEPI, SGAI, LVGI, TATA','text-anchor="middle" '+TS)}`,'Ngưỡng Beneish M-Score'); },
  f:'M = −4,84 + 0,92·DSRI + 0,528·GMI + 0,404·AQI + 0,892·SGI + 0,115·DEPI − 0,172·SGAI + 4,679·TATA − 0,327·LVGI',
  pts:['DSRI (phải thu/doanh thu tăng), GMI (biên gộp xấu đi), AQI (tài sản “mềm” tăng), SGI (tăng trưởng doanh thu nóng), TATA (dồn tích lớn) là các biến quan trọng nhất.','M > −1,78 (phiên bản 8 biến) gợi ý xác suất thao túng cao hơn — không phải bằng chứng.','Mô hình từng gắn cờ Enron trước khi vụ bê bối vỡ lở (theo nghiên cứu của sinh viên Cornell, 1998).','Kết hợp với Piotroski (chất lượng cải thiện) và Altman (rủi ro phá sản) để có bức tranh đầy đủ.'],
  thr:[['M < −2,22','An toàn hơn (ngưỡng phiên bản 5 biến)'],['M > −1,78','Đáng ngờ']],
  hook:'<b>Mẹo nhớ:</b> doanh thu nóng + phải thu phình + dồn tích lớn = cần soi kỹ.',src:'Beneish, M. D. (1999), “The Detection of Earnings Manipulation”, Financial Analysts Journal 55(5).'},
 {id:'famafrench',g:'Danh mục & rủi ro',t:'Đầu tư nhân tố Fama–French',d:'Vì sao giá trị, quy mô, lợi nhuận và động lượng có phần bù',
  vis:()=>{ const f=[['Thị trường',100],['Quy mô (SMB)',30],['Giá trị (HML)',45],['Lợi nhuận (RMW)',40],['Đầu tư (CMA)',32],['Động lượng',55]]; let g=''; f.forEach(([n,v],i)=>{ g+=`<rect x="78" y="${8+i*18}" width="${v}" height="12" rx="3" style="fill:var(--gold);fill-opacity:${.35+i*.1}"/>`+T(74,17+i*18,n,'text-anchor="end" style="font-size:7.5px;fill:var(--fg)"'); });
    return sv(g+T(100,122,'Minh họa định tính, không phải số liệu','text-anchor="middle" '+TS),'Các nhân tố Fama–French'); },
  f:'Rᵢ − R_f = α + β·MKT + s·SMB + h·HML + r·RMW + c·CMA + ε',
  pts:['Mô hình 3 nhân tố (1993): thị trường, quy mô (cổ phiếu nhỏ), giá trị (P/B thấp). Mô hình 5 nhân tố (2015) thêm lợi nhuận (RMW) và đầu tư thận trọng (CMA).','Động lượng (Carhart 1997; Jegadeesh & Titman 1993) là nhân tố bổ sung phổ biến.','Phần bù nhân tố không ổn định: giá trị kém hiệu quả kéo dài 2010–2020 ở Mỹ.','Điểm La Bàn chính là một mô hình đa nhân tố: định giá ~ HML, chất lượng ~ RMW, động lượng ~ MOM.'],
  thr:[['α > 0 có ý nghĩa thống kê','Lợi nhuận vượt trội thật sự sau khi trừ nhân tố']],
  hook:'<b>Mẹo nhớ:</b> phần lớn “alpha” thực ra là beta với một nhân tố nào đó.',src:'Fama & French (1993, 2015), Journal of Financial Economics; Carhart (1997), Journal of Finance.'},
 {id:'emh',g:'Hành vi & chu kỳ',t:'Giả thuyết thị trường hiệu quả',d:'Ba cấp độ và giới hạn của chúng',
  vis:()=>sv(`<circle cx="100" cy="64" r="52" style="fill:var(--us);fill-opacity:.12;stroke:var(--us)"/><circle cx="100" cy="74" r="36" style="fill:var(--gold);fill-opacity:.15;stroke:var(--gold)"/><circle cx="100" cy="84" r="20" style="fill:var(--up);fill-opacity:.2;stroke:var(--up)"/>${T(100,22,'Mạnh: mọi thông tin, kể cả nội gián','text-anchor="middle" style="font-size:7.5px;fill:var(--fg)"')}${T(100,46,'Bán mạnh: thông tin công khai','text-anchor="middle" style="font-size:7.5px;fill:var(--fg)"')}${T(100,87,'Yếu: giá quá khứ','text-anchor="middle" style="font-size:7.5px;fill:var(--fg)"')}`,'Ba cấp độ thị trường hiệu quả'),
  f:'Giá phản ánh toàn bộ thông tin sẵn có → không thể vượt trội thị trường một cách hệ thống sau khi điều chỉnh rủi ro',
  pts:['Dạng yếu: phân tích kỹ thuật không tạo lợi thế. Dạng bán mạnh: phân tích cơ bản không tạo lợi thế. Dạng mạnh: cả thông tin nội gián.','Bằng chứng ủng hộ: phần lớn quỹ chủ động thua chỉ số sau phí trong dài hạn (báo cáo SPIVA).','Bằng chứng phản bác: bong bóng, các bất thường (động lượng, PEAD), tài chính hành vi.','Thị trường cận biên/mới nổi như Việt Nam được cho là kém hiệu quả hơn Mỹ — cơ hội và rủi ro đều lớn hơn.'],
  thr:[['Hàm ý thực tế','Nếu không có lợi thế rõ, quỹ chỉ số phí thấp là lựa chọn mạnh']],
  hook:'<b>Mẹo nhớ:</b> “Yếu – Bán mạnh – Mạnh” = giá cũ – tin công khai – tin nội bộ.',src:'Fama, E. (1970), “Efficient Capital Markets”, Journal of Finance 25(2); S&P SPIVA Scorecards.'},
 {id:'margin-trade',g:'Thị trường Mỹ & VN',t:'Giao dịch ký quỹ (margin)',d:'Đòn bẩy, tỷ lệ duy trì và call margin',
  vis:()=>{ const X=v=>14+v/50*172, Y=v=>110-v*.9; let g=`<line class="axis" x1="14" y1="110" x2="190" y2="110"/><path d="M${X(0)} ${Y(0)} L${X(50)} ${Y(50)}" style="stroke:var(--mut)" stroke-width="1.5"/><path d="M${X(0)} ${Y(0)} L${X(50)} ${Y(100)}" style="stroke:var(--dn)" stroke-width="2"/>`;
    return sv(g+T(150,30,'Lỗ có margin 1:1','style="font-size:8px;fill:var(--dn);font-weight:700"')+T(150,76,'Lỗ không vay','style="font-size:8px"')+T(100,122,'Giá giảm (%) →','text-anchor="middle" '+TS),'Đòn bẩy nhân đôi thua lỗ'); },
  f:'Tỷ lệ ký quỹ = (Giá trị CK − Nợ vay) ÷ Giá trị CK',
  pts:['Việt Nam: tỷ lệ ký quỹ ban đầu tối thiểu 50% theo quy định UBCKNN; công ty chứng khoán đặt tỷ lệ duy trì (thường 30–40%) và tỷ lệ xử lý (call/force sell).','Mỹ: Regulation T yêu cầu 50% ban đầu; FINRA yêu cầu tỷ lệ duy trì tối thiểu 25% (nhiều công ty đặt 30–40%).','Vay 1:1 nghĩa là giá giảm 25% làm mất 50% vốn; giảm 50% là mất trắng.','Đợt giải chấp hàng loạt có thể khiến cổ phiếu giảm sàn nhiều phiên liên tiếp ở Việt Nam (ví dụ các đợt 2022).'],
  thr:[['Không vay','An toàn nhất'],['Vay ≤ 30% danh mục','Chấp nhận được với người có kinh nghiệm'],['Vay 1:1','Rủi ro rất cao']],
  hook:'<b>Mẹo nhớ:</b> margin khuếch đại cả lãi lẫn lỗ — nhưng lỗ thì không có trần.',src:'Thông tư 120/2020/TT-BTC (VN); Federal Reserve Regulation T; FINRA Rule 4210.'},
 {id:'costs',g:'Thị trường Mỹ & VN',t:'Thuế, phí và chi phí ẩn',d:'Những thứ ăn mòn lợi nhuận mỗi năm',
  vis:()=>{ const X=v=>14+v/30*172, Y=v=>110-v/8*92; let g=`<line class="axis" x1="14" y1="110" x2="190" y2="110"/>`;
    [[0,'var(--gold)'],[1,'var(--us)'],[2,'var(--dn)']].forEach(([f,c])=>g+=`<path d="${pathFn(t=>Math.pow(1+(.10-f/100),t),0,30,X,Y)}" fill="none" style="stroke:${c}" stroke-width="2"/>`);
    return sv(g+T(160,20,'Phí 0%','style="font-size:8px;fill:var(--gold);font-weight:700"')+T(165,52,'1%','style="font-size:8px;fill:var(--us);font-weight:700"')+T(165,72,'2%','style="font-size:8px;fill:var(--dn);font-weight:700"')+T(100,122,'Năm (lợi suất gộp 10%) →','text-anchor="middle" '+TS),'Tác động của phí theo thời gian'); },
  f:'Việt Nam: thuế 0,1% trên giá trị bán + 5% trên cổ tức tiền mặt · Mỹ: thuế lãi vốn theo thời gian nắm giữ',
  pts:['Việt Nam: thuế thu nhập cá nhân 0,1% giá trị mỗi lệnh bán (kể cả khi lỗ), 5% cổ tức tiền mặt; phí môi giới thường 0,1–0,35% mỗi chiều.','Mỹ (với cư dân thuế Mỹ): lãi vốn ngắn hạn (< 1 năm) chịu thuế như thu nhập thường; dài hạn 0/15/20%; cổ tức đủ điều kiện ưu đãi. Nhà đầu tư nước ngoài thường bị khấu trừ 30% cổ tức (giảm theo hiệp định thuế).','Chênh lệch giá mua–bán (spread) và trượt giá là chi phí ẩn, lớn ở cổ phiếu thanh khoản thấp.','Phí 2%/năm trong 30 năm có thể lấy đi khoảng 40% tài sản cuối kỳ so với không phí.'],
  thr:[['Giao dịch 1 lần/tuần, phí 0,25%','≈ 26% vốn/năm chỉ cho phí và thuế bán (VN)']],
  hook:'<b>Mẹo nhớ:</b> chi phí là lợi nhuận âm duy nhất bạn kiểm soát được 100%.',src:'Luật Thuế TNCN và Thông tư 111/2013/TT-BTC (VN); IRS Publication 550 (Mỹ). Kiểm tra quy định hiện hành.'},

      animateRings($('#sheetBody')); $('#cqAgain').onclick=startCandleQuiz; $('#cqClose').onclick=()=>{ closeSheet(); if(S.view==='learn') RENDER.learn(); }; return; }
    const p=pool[st.k]; const others=shuffle(CDL.filter(x=>x.id!==p.id&&x.cat===p.cat).concat(shuffle(CDL.filter(x=>x.id!==p.id&&x.cat!==p.cat)))).filter((x,i,a)=>a.indexOf(x)===i).slice(0,3);
    const opts=shuffle([p].concat(others));
    $('#sheetBody').innerHTML=`<div class="lesson"><div style="display:flex;justify-content:space-between"><span class="note">Mẫu ${st.k+1}/${pool.length}</span><span class="note">Đúng: ${st.score}</span></div><div class="progress"><i style="width:${st.k/pool.length*100}%"></i></div>
      <h3 style="font-size:19px">Đây là mẫu nến nào?</h3><div class="vis">${cdlSVG(p,{h:140})}</div>
      <div style="display:flex;flex-direction:column;gap:8px" id="cqOpts">${opts.map(o=>`<button class="quiz-opt" data-id="${o.id}">${esc(o.n)}</button>`).join('')}</div><div id="cqFb"></div></div>`;
    let done=false;
    $$('#cqOpts .quiz-opt').forEach(b=>b.onclick=()=>{ if(done) return; done=true; const ok=b.dataset.id===p.id; if(ok) st.score++;
      $$('#cqOpts .quiz-opt').forEach(x=>{ if(x.dataset.id===p.id) x.classList.add('ok'); x.disabled=true; }); if(!ok) b.classList.add('bad');
      $('#cqFb').innerHTML=`<div class="hook" style="border-color:${ok?'var(--up)':'var(--dn)'}"><b style="color:${ok?'var(--up)':'var(--dn)'}">${ok?'Chính xác.':'Chưa đúng — đây là '+esc(p.n)+'.'}</b> ${esc(p.d)}</div><div class="row-btns" style="margin-top:10px"><button class="btn pri" id="cqNext">${st.k+1<pool.length?'Mẫu tiếp':'Xem kết quả'}</button></div>`;
      $('#cqNext').onclick=()=>{ st.k++; render(); }; });
  };
  openSheet('Nhận diện mẫu nến','',()=>render());
}

/* ---------- toán (hàm thuần) ---------- */
function erf(x){ const s=x<0?-1:1; x=Math.abs(x); const t=1/(1+0.3275911*x);
  const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-x*x); return s*y; }
function ncdf(x){ return 0.5*(1+erf(x/Math.SQRT2)); }
function npdf(x){ return Math.exp(-x*x/2)/Math.sqrt(2*Math.PI); }
/* S: giá, K: giá thực hiện, T: năm, r, q: lãi suất & cổ tức (thập phân), v: biến động (thập phân) */
function bs(type,S,K,T,r,v,q){
  q=q||0;
  if(T<=1e-9||v<=1e-9){ const intr=type==='call'?Math.max(S-K,0):Math.max(K-S,0); const itm=type==='call'?S>K:S<K;
    return {price:intr,delta:itm?(type==='call'?1:-1):0,gamma:0,theta:0,vega:0,rho:0}; }
  const sq=Math.sqrt(T), d1=(Math.log(S/K)+(r-q+v*v/2)*T)/(v*sq), d2=d1-v*sq;
  const dfq=Math.exp(-q*T), dfr=Math.exp(-r*T);
  const gamma=dfq*npdf(d1)/(S*v*sq), vega=S*dfq*npdf(d1)*sq/100;
  if(type==='call'){ const price=S*dfq*ncdf(d1)-K*dfr*ncdf(d2);
    const theta=(-S*dfq*npdf(d1)*v/(2*sq)-r*K*dfr*ncdf(d2)+q*S*dfq*ncdf(d1))/365;
    return {price,delta:dfq*ncdf(d1),gamma,theta,vega,rho:K*T*dfr*ncdf(d2)/100,d1,d2}; }
  const price=K*dfr*ncdf(-d2)-S*dfq*ncdf(-d1);
  const theta=(-S*dfq*npdf(d1)*v/(2*sq)+r*K*dfr*ncdf(-d2)-q*S*dfq*ncdf(-d1))/365;
  return {price,delta:-dfq*ncdf(-d1),gamma,theta,vega,rho:-K*T*dfr*ncdf(-d2)/100,d1,d2};
}
function impliedVol(type,price,S,K,T,r){ let lo=.001,hi=5; for(let i=0;i<80;i++){ const m=(lo+hi)/2; if(bs(type,S,K,T,r,m).price>price) hi=m; else lo=m; } return (lo+hi)/2; }
/* chân: {k:'call'|'put'|'stock', side:1|-1, K, qty, dte} ; mỗi hợp đồng = 100 cổ phiếu */
function legPremium(leg,env){ return leg.k==='stock'? env.S : bs(leg.k,env.S,leg.K,leg.dte/365,env.r,env.v).price; }
function positionValue(legs,env,ST,tau){ /* giá trị lãi/lỗ mỗi cổ phiếu tại giá ST, sau tau ngày */
  let pl=0; legs.forEach(l=>{ const entry=l._prem!=null?l._prem:legPremium(l,env);
    const now= l.k==='stock'? ST : bs(l.k,ST,l.K,Math.max(0,l.dte-tau)/365,env.r,env.v).price;
    pl+=l.side*l.qty*(now-entry); }); return pl; }
function positionGreeks(legs,env,S,tau){ const g={delta:0,gamma:0,theta:0,vega:0};
  legs.forEach(l=>{ if(l.k==='stock'){ g.delta+=l.side*l.qty; return; } const b=bs(l.k,S,l.K,Math.max(0,l.dte-tau)/365,env.r,env.v); ['delta','gamma','theta','vega'].forEach(k=>g[k]+=l.side*l.qty*b[k]); }); return g; }
function analyzeStrategy(legs,env){
  legs.forEach(l=>l._prem=legPremium(l,env));
  const tExp=Math.min(...legs.filter(l=>l.k!=='stock').map(l=>l.dte).concat([9999]));
  const tau= tExp===9999? 30 : tExp;
  const lo=env.S*0.02, hi=env.S*3; const N=900; const xs=[],ys=[];
  for(let i=0;i<=N;i++){ const x=lo+(hi-lo)*i/N; xs.push(x); ys.push(positionValue(legs,env,x,tau)); }
  const be=[]; for(let i=1;i<=N;i++){ if((ys[i-1]<0&&ys[i]>=0)||(ys[i-1]>0&&ys[i]<=0)){ const x=xs[i-1]+(xs[i]-xs[i-1])*(-ys[i-1])/(ys[i]-ys[i-1]); be.push(x); } }
  const slopeHi=(ys[N]-ys[N-1])/(xs[N]-xs[N-1]);
  const maxP= slopeHi>1e-6? Infinity : Math.max(...ys, positionValue(legs,env,0.0001,tau));
  const minAtZero=positionValue(legs,env,0.0001,tau);
  const maxL= slopeHi< -1e-6? -Infinity : Math.min(...ys,minAtZero);
  /* xác suất có lãi tại ngày đáo hạn sớm nhất, phân phối log-chuẩn rủi ro trung tính */
  const T=tau/365, sd=env.v*Math.sqrt(T), mu=Math.log(env.S)+(env.r-env.v*env.v/2)*T;
  let pop=0; for(let i=1;i<=N;i++){ if(ys[i]>0&&ys[i-1]>0){ const a=xs[i-1],b=xs[i]; pop+=ncdf((Math.log(b)-mu)/sd)-ncdf((Math.log(a)-mu)/sd); } }
  if(ys[N]>0) pop+=1-ncdf((Math.log(hi)-mu)/sd);
  if(ys[0]>0) pop+=ncdf((Math.log(lo)-mu)/sd);
  const net=legs.reduce((a,l)=>a+l.side*l.qty*l._prem,0); /* >0: trả tiền (debit) */
  return {tau,be,maxP,maxL,pop:clamp(pop,0,1),net,greeks:positionGreeks(legs,env,env.S,0)};
}

const OPT={S:100,iv:30,r:4,dte:30,tau:0,preset:'longcall',legs:null,greek:'delta'};
function presetLegs(id){ const p=OPT_PRESETS.find(x=>x.id===id)||OPT_PRESETS[0];
  return p.legs.map(([k,side,kr,dte])=>({k,side:Math.sign(side),qty:Math.abs(side),K:k==='stock'?null:roundStrike(OPT.S*kr),dte:k==='stock'?null:(dte||OPT.dte)})); }
function sg1(v){ return Math.abs(v)<.05?'0':(v>0?'+':'−')+fmt(Math.abs(v),1); }
function roundStrike(x){ const st= x<25?.5: x<200?1: 5; return Math.round(x/st)*st; }
function optEnv(){ return {S:OPT.S,v:OPT.iv/100,r:OPT.r/100}; }

/* ---------- vẽ biểu đồ lãi/lỗ ---------- */
function payoffSVG(legs,env,opt){
  opt=opt||{}; const W=opt.w||360,H=opt.h||220,p={l:opt.mini?6:44,r:opt.mini?6:10,t:opt.mini?8:12,b:opt.mini?8:26};
  const A=analyzeStrategy(legs.map(l=>Object.assign({},l)),env); const tau=A.tau;
  const x0=env.S*(opt.mini?.75:.6), x1=env.S*(opt.mini?1.25:1.4); const N=opt.mini?80:160; const pts=[],now=[];
  const PL=legs.map(l=>Object.assign({},l,{_prem:legPremium(l,env)}));
  for(let i=0;i<=N;i++){ const x=x0+(x1-x0)*i/N; pts.push([x,positionValue(PL,env,x,tau)]); if(!opt.mini) now.push([x,positionValue(PL,env,x,opt.tau||0)]); }
  let lo=Math.min(...pts.map(q=>q[1]),...now.map(q=>q[1]),0), hi=Math.max(...pts.map(q=>q[1]),...now.map(q=>q[1]),0); const pad=(hi-lo)*.1||1; lo-=pad; hi+=pad;
  const X=x=>p.l+(x-x0)/(x1-x0)*(W-p.l-p.r), Y=y=>p.t+(hi-y)/(hi-lo)*(H-p.t-p.b);
  let g='';
  if(!opt.mini){ const em=env.S*env.v*Math.sqrt(tau/365); g+=`<rect x="${X(Math.max(x0,env.S-em)).toFixed(1)}" y="${p.t}" width="${(X(Math.min(x1,env.S+em))-X(Math.max(x0,env.S-em))).toFixed(1)}" height="${H-p.t-p.b}" style="fill:var(--us);fill-opacity:.07"/>`;
    niceTicks(lo,hi,5).forEach(v=>g+=`<line class="grid-l" x1="${p.l}" x2="${W-p.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${p.l-5}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" style="font-size:10px">${fmt(v*100,0)}</text>`);
    niceTicks(x0,x1,5).forEach(v=>g+=`<text x="${X(v).toFixed(1)}" y="${H-8}" text-anchor="middle" style="font-size:10px">${fmt(v,0)}</text>`); }
  /* vùng lãi/lỗ */
  let dPos='',dNeg=''; for(let i=0;i<pts.length;i++){ const [x,y]=pts[i]; dPos+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(Math.max(0,y)).toFixed(1)+' '; dNeg+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(Math.min(0,y)).toFixed(1)+' '; }
  g+=`<path d="${dPos}L${X(x1)} ${Y(0)} L${X(x0)} ${Y(0)}Z" style="fill:var(--up);fill-opacity:.18"/><path d="${dNeg}L${X(x1)} ${Y(0)} L${X(x0)} ${Y(0)}Z" style="fill:var(--dn);fill-opacity:.16"/>`;
  g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(0).toFixed(1)}" y2="${Y(0).toFixed(1)}" style="stroke:var(--mut)" stroke-width="1"/>`;
  g+=`<path d="${pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ')}" fill="none" style="stroke:var(--gold)" stroke-width="${opt.mini?2.4:2.2}" stroke-linejoin="round"/>`;
  if(!opt.mini){ g+=`<path d="${now.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ')}" fill="none" style="stroke:var(--us)" stroke-width="1.8" stroke-dasharray="5 3"/>`;
    g+=`<line x1="${X(env.S).toFixed(1)}" x2="${X(env.S).toFixed(1)}" y1="${p.t}" y2="${H-p.b}" style="stroke:var(--fg)" stroke-opacity=".5" stroke-dasharray="2 3"/><text x="${(X(env.S)+4).toFixed(1)}" y="${p.t+10}" style="font-size:10px;fill:var(--fg)">Giá ${fmt(env.S,1)}</text>`;
    A.be.filter(b=>b>=x0&&b<=x1).forEach(b=>g+=`<circle cx="${X(b).toFixed(1)}" cy="${Y(0).toFixed(1)}" r="4" style="fill:var(--bg);stroke:var(--fg)" stroke-width="1.6"/><text x="${X(b).toFixed(1)}" y="${(Y(0)+15).toFixed(1)}" text-anchor="middle" class="lbl-strong" style="font-size:10px">${fmt(b,1)}</text>`);
    g+=`<text x="${p.l}" y="${p.t-1}" style="font-size:9.5px">Lãi/lỗ mỗi hợp đồng (100 cp)</text>`; }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Biểu đồ lãi lỗ chiến lược quyền chọn">${g}</svg>`;
}
function greekProfileSVG(legs,env,greek,tau){
  const W=360,H=150,p={l:44,r:10,t:10,b:24}; const x0=env.S*.6,x1=env.S*1.4,N=120; const pts=[];
  for(let i=0;i<=N;i++){ const x=x0+(x1-x0)*i/N; pts.push([x,positionGreeks(legs,env,x,tau)[greek]]); }
  let lo=Math.min(0,...pts.map(q=>q[1])),hi=Math.max(0,...pts.map(q=>q[1])); if(hi-lo<1e-9){hi+=1;lo-=1;} const pad=(hi-lo)*.1; lo-=pad; hi+=pad;
  const X=x=>p.l+(x-x0)/(x1-x0)*(W-p.l-p.r), Y=y=>p.t+(hi-y)/(hi-lo)*(H-p.t-p.b); const mult= greek==='delta'||greek==='gamma'?100:100;
  let g=''; niceTicks(lo,hi,4).forEach(v=>g+=`<line class="grid-l" x1="${p.l}" x2="${W-p.r}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}"/><text x="${p.l-5}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end" style="font-size:10px">${fmt(v*mult,greek==='gamma'?2:0)}</text>`);
  niceTicks(x0,x1,5).forEach(v=>g+=`<text x="${X(v).toFixed(1)}" y="${H-7}" text-anchor="middle" style="font-size:10px">${fmt(v,0)}</text>`);
  g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(0)}" y2="${Y(0)}" style="stroke:var(--mut)"/><line x1="${X(env.S)}" x2="${X(env.S)}" y1="${p.t}" y2="${H-p.b}" style="stroke:var(--fg)" stroke-opacity=".5" stroke-dasharray="2 3"/>`;
  g+=`<path d="${pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ')}" fill="none" style="stroke:var(--ceil)" stroke-width="2.2"/>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hồ sơ ${greek} theo giá cổ phiếu">${g}</svg>`;
}

  pts:['Giá trị thời gian của quyền chọn ATM giảm gần tỷ lệ với √T — mất giá chậm lúc đầu, rất nhanh trong 30 ngày cuối.','Người mua có theta âm (mất tiền mỗi ngày); người bán có theta dương.','Vega lớn nhất với quyền chọn ATM, thời hạn dài. Vị thế mua quyền chọn có vega dương: lợi khi IV tăng.','Rho thường nhỏ với quyền chọn ngắn hạn, quan trọng hơn với LEAPS (thời hạn trên 1 năm).','Theta và gamma là hai mặt của một đồng xu: muốn hưởng gamma phải trả theta.'],
  thr:[['DTE < 30','Theta tăng tốc'],['DTE 30–60','Vùng phổ biến cho chiến lược bán phí']],
  hook:'<b>Mẹo nhớ:</b> thời gian là kẻ thù của người mua, bạn của người bán.',src:'Natenberg (2015); Sinclair, Volatility Trading (2nd ed., 2013).'},
 {id:'opt-iv',g:'Quyền chọn (Options)',t:'Biến động ngầm định (IV)',d:'Thị trường đang “định giá” bao nhiêu biến động',
  vis:()=>{ const X=v=>14+v/60*172; let g=`<line class="axis" x1="14" x2="186" y1="100" y2="100"/>`; let p=''; for(let d=0;d<=60;d++){ const iv=28+ (d<40? d*.35: 42-(d-40)*1.2) + (d===40?0:0); const y=100-(d<=40? 28+d*.45 : 46-(d-40)*1.3)*1.6; p+=(d?'L':'M')+X(d).toFixed(1)+' '+y.toFixed(1); }
    g+=`<path d="${p}" fill="none" style="stroke:var(--ceil)" stroke-width="2.2"/><line x1="${X(40)}" x2="${X(40)}" y1="16" y2="100" style="stroke:var(--dn)" stroke-dasharray="3 3"/>`+T(X(40),14,'Công bố KQKD','text-anchor="middle" style="font-size:8px;fill:var(--dn);font-weight:700"')+T(X(52),40,'IV crush','style="font-size:8px;fill:var(--dn);font-weight:700"')+T(16,112,'IV tăng dần trước sự kiện, sụp ngay sau đó',TS);
    return sv(g,'IV tăng trước kết quả kinh doanh và sụp sau đó'); },
  f:'Biên độ kỳ vọng ±1σ ≈ S × IV × √(Số ngày ÷ 365)',
  pts:['IV là mức biến động làm cho giá Black–Scholes khớp với giá thị trường — giải ngược từ phí quyền chọn.','So IV với biến động lịch sử (HV): IV cao hơn HV nghĩa là quyền chọn “đắt”, có lợi cho người bán.','IV Rank = (IV hiện tại − IV thấp nhất 1 năm) ÷ (IV cao nhất − IV thấp nhất). IV Rank cao thường đi kèm chiến lược bán phí.','IV crush: sau tin tức (KQKD, FDA), IV sụp mạnh — người mua call/put có thể lỗ dù đoán đúng hướng.','Ví dụ: S = 100, IV = 30%, 30 ngày → ±1σ ≈ 100 × 0,30 × √(30/365) ≈ ±8,6.','Chỉ số VIX đo IV 30 ngày của quyền chọn S&P 500 — “thước đo sợ hãi”.'],
  thr:[['IV Rank > 50','Quyền chọn tương đối đắt'],['IV Rank < 20','Tương đối rẻ']],
  hook:'<b>Mẹo nhớ:</b> “Mua tin đồn, bán sự thật” — với quyền chọn là mua IV trước, IV sụp sau.',src:'CBOE VIX White Paper; Sinclair (2013); Natenberg (2015), ch. 8.'},
 {id:'opt-smile',g:'Quyền chọn (Options)',t:'Nụ cười biến động và độ lệch',d:'Vì sao Black–Scholes không hoàn hảo',
  vis:()=>{ const X=v=>14+(v-70)/60*172; let g=`<line class="axis" x1="14" x2="186" y1="105" y2="105"/>`; let p='',q=''; for(let k=70;k<=130;k+=1){ const sk=26+.012*(100-k)*(100-k)/2+.25*(100-k); const sm=24+.012*(100-k)*(100-k); p+=(k>70?'L':'M')+X(k).toFixed(1)+' '+(110-sk*1.9).toFixed(1); q+=(k>70?'L':'M')+X(k).toFixed(1)+' '+(110-sm*1.9).toFixed(1); }
    g+=`<path d="${q}" fill="none" style="stroke:var(--mut)" stroke-width="1.6" stroke-dasharray="4 3"/><path d="${p}" fill="none" style="stroke:var(--ceil)" stroke-width="2.2"/>`+T(18,20,'Lệch (skew) cổ phiếu','style="font-size:8px;fill:var(--ceil);font-weight:700"')+T(150,66,'Nụ cười','style="font-size:8px"')+T(100,118,'Giá thực hiện →','text-anchor="middle" '+TS);
    return sv(g,'Nụ cười và độ lệch biến động'); },
  f:'IV khác nhau theo giá thực hiện (skew) và theo thời hạn (cấu trúc kỳ hạn)',
  pts:['Với cổ phiếu và chỉ số, put OTM thường có IV cao hơn call OTM — thị trường trả giá cao cho bảo hiểm giảm giá (skew âm) từ sau sự cố năm 1987.','Hàng hóa, tiền điện tử có thể có skew ngược (call đắt hơn) khi lo sợ giá tăng vọt.','Cấu trúc kỳ hạn: bình thường IV dài hạn cao hơn ngắn hạn (contango); khi hoảng loạn thì ngược lại.','Chiến lược spread cho phép mua phần IV rẻ và bán phần IV đắt.'],
  thr:[['Skew dốc','Nhu cầu bảo hiểm cao, tâm lý lo ngại']],
  hook:'<b>Mẹo nhớ:</b> nụ cười lệch về phía nỗi sợ.',src:'Derman & Kani (1994); Gatheral, The Volatility Surface (2006).'},
 {id:'opt-income',g:'Quyền chọn (Options)',t:'Covered call và bán put bảo đảm',d:'Chiến lược thu nhập và “bánh xe”',
  vis:()=>pm([OL('stock',1,null),OL('call',-1,105)]),
  f:'Covered call = Cổ phiếu + Bán call OTM · Cash-secured put = Bán put + giữ đủ tiền mua',
  pts:['Covered call thu phí đều đặn nhưng giới hạn phần tăng trên giá thực hiện; vẫn chịu gần như toàn bộ rủi ro giảm.','Bán put bảo đảm tiền: được trả phí để chờ mua cổ phiếu muốn sở hữu ở giá thấp hơn.','“Bánh xe” (wheel): bán put → bị chỉ định mua → bán covered call → bị gọi bán → lặp lại.','Theo put–call parity, covered call và bán put cùng K có lãi/lỗ như nhau.','Hiệu quả nhất trong thị trường đi ngang và IV cao; kém hiệu quả khi thị trường tăng mạnh.'],
  thr:[['Delta call bán 0,2–0,3','Phổ biến cho covered call'],['30–45 ngày','Cân bằng theta và rủi ro']],
  hook:'<b>Mẹo nhớ:</b> cho thuê cổ phiếu để lấy “tiền nhà” hằng tháng.',src:'CBOE BXM Index methodology; McMillan (2012), ch. 2.'},
 {id:'opt-hedge',g:'Quyền chọn (Options)',t:'Put bảo vệ và Collar',d:'Mua bảo hiểm cho danh mục',
  vis:()=>pm([OL('stock',1,null),OL('put',1,95),OL('call',-1,110)]),
  f:'Put bảo vệ = Cổ phiếu + Mua put · Collar = Cổ phiếu + Mua put + Bán call',
  pts:['Put bảo vệ đặt “sàn” cho lỗ: lỗ tối đa = (S − K) + phí put.','Phí bảo hiểm tốn kém nếu mua thường xuyên — giống bảo hiểm xe, phần lớn thời gian “mất phí”.','Collar dùng tiền bán call để mua put: khóa vùng giá, chi phí gần 0 (zero-cost collar).','Phù hợp khi muốn giữ cổ phiếu qua sự kiện rủi ro (KQKD, bầu cử) hoặc bảo vệ khoản lãi lớn.','Có thể bảo hiểm cả danh mục bằng put trên chỉ số (SPY, SPX) thay vì từng mã.'],
  thr:[['Put OTM 5–10%','Bảo hiểm thảm họa, phí thấp'],['Put ATM','Bảo vệ tối đa, phí cao']],
  hook:'<b>Mẹo nhớ:</b> collar là “thắt dây an toàn” cho cổ phiếu — đổi phần tăng lấy phần bảo vệ.',src:'Hull (2021), ch. 12; OCC ODD.'},
 {id:'opt-vertical',g:'Quyền chọn (Options)',t:'Spread dọc (vertical spread)',d:'Giới hạn rủi ro bằng hai giá thực hiện',
  vis:()=>pm([OL('call',1,100),OL('call',-1,110)]),
  f:'Debit spread: lỗ tối đa = phí ròng · Credit spread: lỗ tối đa = chênh lệch K − phí thu',
  pts:['Bull call spread (mua K thấp, bán K cao): rẻ hơn mua call đơn, lãi tối đa = chênh lệch K − phí ròng.','Bear put spread: tương tự cho kịch bản giảm.','Bull put / bear call (credit spread): thu phí ngay, lãi khi giá không đi ngược hướng.','Spread giảm ảnh hưởng của IV và theta so với quyền chọn đơn.','Chọn độ rộng spread theo tỷ lệ lời/lỗ và xác suất bạn chấp nhận.'],
  thr:[['Credit = 1/3 độ rộng','Mức thu phổ biến cho credit spread']],
  hook:'<b>Mẹo nhớ:</b> bán một chân để “tài trợ” chân còn lại.',src:'McMillan (2012), ch. 7–8.'},
 {id:'opt-straddle',g:'Quyền chọn (Options)',t:'Straddle và Strangle',d:'Đặt cược vào biến động, không vào hướng',
  vis:()=>pm([OL('call',1,100),OL('put',1,100)]),
  f:'Long straddle hòa vốn = K ± tổng phí',
  pts:['Long straddle/strangle: lãi khi giá chạy mạnh theo bất kỳ hướng nào vượt tổng phí.','Kẻ thù là thời gian và IV crush — thường mua trước sự kiện thì đã phải trả IV cao.','Short straddle/strangle: thu phí khi giá đứng yên; rủi ro lỗ lớn hai phía, cần quản lý chặt.','Giá straddle ATM xấp xỉ biên độ biến động thị trường kỳ vọng (≈ 0,8 × S × IV × √T).'],
  thr:[['Biến động thực > IV','Người mua straddle có lợi'],['Biến động thực < IV','Người bán có lợi']],
  hook:'<b>Mẹo nhớ:</b> straddle là chữ V — giá càng xa đáy V càng lãi.',src:'Natenberg (2015), ch. 11; Sinclair (2013).'},
 {id:'opt-condor',g:'Quyền chọn (Options)',t:'Iron condor và Butterfly',d:'Kiếm lời từ thị trường đứng yên, rủi ro giới hạn',
  vis:()=>pm([OL('put',1,85),OL('put',-1,92),OL('call',-1,108),OL('call',1,115)]),
  f:'Iron condor = Bull put spread + Bear call spread',
  pts:['Iron condor thu phí trong một vùng giá; lỗ tối đa = độ rộng cánh − phí thu.','Butterfly (1–2–1): chi phí thấp, lãi lớn nhất nếu giá đáo hạn đúng giá thực hiện giữa.','Cả hai đều có theta dương và vega âm: lợi khi thời gian trôi và IV giảm.','Quản lý: chốt lời ở 50% lãi tối đa, điều chỉnh khi giá chạm chân bán.'],
  thr:[['Chân bán delta ≈ 0,15','Vùng lãi rộng, phí thấp'],['Chân bán delta ≈ 0,30','Phí cao, xác suất thấp hơn']],
  hook:'<b>Mẹo nhớ:</b> condor dang rộng hai cánh, butterfly gập cánh lại một điểm.',src:'Cohen, The Bible of Options Strategies (2nd ed., 2015).'},
 {id:'opt-calendar',g:'Quyền chọn (Options)',t:'Calendar và Diagonal',d:'Khai thác chênh lệch tốc độ mất giá',
  vis:()=>pm([OL('call',-1,100,1,30),OL('call',1,100,1,90)]),
  f:'Calendar = Bán quyền chọn gần hạn + Mua quyền chọn xa hạn (cùng K)',
  pts:['Quyền chọn gần hạn mất giá trị thời gian nhanh hơn — người bán chân gần hưởng chênh lệch theta.','Lãi tốt nhất khi giá đứng gần K tại ngày đáo hạn chân gần; vega dương nên lợi khi IV tăng.','Diagonal: hai chân khác cả thời hạn lẫn giá thực hiện, cho phép có thiên hướng tăng/giảm nhẹ.','Biểu đồ lãi/lỗ tính tại ngày đáo hạn chân gần, chân xa vẫn còn giá trị thời gian (định giá Black–Scholes).'],
  thr:[['Chân gần 20–30 ngày, chân xa 60–90 ngày','Cấu hình phổ biến']],
  hook:'<b>Mẹo nhớ:</b> bán thời gian ngắn, mua thời gian dài.',src:'McMillan (2012), ch. 9.'},
 {id:'opt-risk',g:'Quyền chọn (Options)',t:'Rủi ro và quản lý vị thế',d:'Những điều người mới thường bỏ qua',
  vis:()=>{ const it=['Chỉ định sớm','Cổ tức','Pin risk','Lỗ vô hạn','Thanh khoản','Đòn bẩy','IV crush','Gap đêm']; let g='';

    return sv(g,'Tám rủi ro khi giao dịch quyền chọn'); },
  f:'Quy mô vị thế: rủi ro tối đa mỗi chiến lược ≤ 1–5% vốn',
  pts:['Quyền chọn kiểu Mỹ có thể bị thực hiện sớm, đặc biệt call ITM ngay trước ngày không hưởng quyền cổ tức.','Pin risk: giá đóng cửa sát K ngày đáo hạn — không chắc bị chỉ định hay không.','Bán call không có cổ phiếu hoặc bán strangle có thể lỗ vượt vốn; cần ký quỹ và cấp quyền cao.','Quyền chọn thanh khoản kém có chênh lệch giá mua–bán rộng, ăn mòn lợi nhuận; ưu tiên mã có open interest lớn.','Đòn bẩy: mua quyền chọn OTM giá rẻ dễ mất 100% phí; phần lớn quyền chọn OTM đáo hạn vô giá trị.','Lập kế hoạch trước: điều kiện chốt lời, cắt lỗ, điều chỉnh (roll) và khi nào đóng trước đáo hạn.'],
  thr:[['Open interest > 1.000, spread < 5% phí','Thanh khoản chấp nhận được']],
  hook:'<b>Mẹo nhớ:</b> biết lỗ tối đa trước khi bấm lệnh — nếu là “không giới hạn”, nghĩ lại.',src:'OCC, Characteristics and Risks of Standardized Options; FINRA Rule 2360.'},
 {id:'opt-vn',g:'Quyền chọn (Options)',t:'Chứng quyền Việt Nam và phái sinh',d:'Sản phẩm giống quyền chọn trên HOSE',
  vis:()=>sv(`<rect x="10" y="14" width="85" height="96" rx="8" style="fill:var(--s1);stroke:var(--vn)"/><rect x="105" y="14" width="85" height="96" rx="8" style="fill:var(--s1);stroke:var(--us)"/>${T(52,32,'Chứng quyền VN','text-anchor="middle" style="font-size:9px;font-weight:800;fill:var(--vn)"')}${T(147,32,'Options Mỹ','text-anchor="middle" style="font-size:9px;font-weight:800;fill:var(--us)"')}${[['CTCK phát hành','Sàn chuẩn hóa'],['Chỉ quyền mua','Call & put'],['Kiểu châu Âu','Kiểu Mỹ'],['Thanh toán tiền','Giao cổ phiếu'],['Không bán khống','Mua & bán']].map(([a,b],i)=>T(52,50+i*13,a,'text-anchor="middle" style="font-size:7.5px;fill:var(--fg)"')+T(147,50+i*13,b,'text-anchor="middle" style="font-size:7.5px;fill:var(--fg)"')).join('')}`,'So sánh chứng quyền Việt Nam và options Mỹ'),
  f:'Giá trị CW khi đáo hạn = max(Giá TB 5 phiên − Giá thực hiện, 0) ÷ Tỷ lệ chuyển đổi',
  pts:['Chứng quyền có bảo đảm (CW) giao dịch trên HOSE từ 2019: do công ty chứng khoán phát hành, là quyền chọn mua kiểu châu Âu, thanh toán bằng tiền.','Nhà đầu tư chỉ được mua CW (không bán khống); tổ chức phát hành phòng hộ bằng cổ phiếu cơ sở.','Tỷ lệ chuyển đổi, ví dụ 5:1, nghĩa là 5 chứng quyền tương ứng 1 cổ phiếu — nhớ chia khi tính giá trị.','Giá thanh toán thường là giá đóng cửa bình quân 5 phiên trước ngày đáo hạn (không tính ngày đáo hạn).','Phái sinh chỉ số VN30F (HNX) là hợp đồng tương lai, không phải quyền chọn: lãi/lỗ tuyến tính, có ký quỹ và đáo hạn thứ Năm tuần thứ ba.','Quyền chọn cổ phiếu niêm yết chưa có ở Việt Nam (tính đến thông tin của ứng dụng) — kiểm tra quy định mới nhất.'],
  thr:[['Giá CW ≈ giá trị nội tại ÷ tỷ lệ + giá trị thời gian','So sánh để biết CW đắt hay rẻ'],['IV của CW','Thường cao hơn biến động lịch sử của cổ phiếu']],

];

const LIVE={q:{},e:{},snap:{},hist:{},histReq:{},meta:null,status:'init',db:null};
const IDX_NAME={'IDX.VNINDEX':'VN-Index','IDX.VN30':'VN30','IDX.SPX':'S&P 500','IDX.IXIC':'Nasdaq','IDX.DJI':'Dow Jones'};

/* chỉ số định giá điều chỉnh theo giá mới: P/E, P/B, P/S tỷ lệ thuận với giá; tỷ suất cổ tức, FCF tỷ lệ nghịch */
function liveFund(s){
  const q=LIVE.q[s.t]; if(!q||!isNum(q.px)) return {};
  const o={};
  if(isNum(q.cap)&&q.cap>0) o.cap=q.cap;
  if(isNum(s.pxf)&&s.pxf>0){
    const r=q.px/s.pxf;
    if(r>0.2&&r<5){
      ['pe','fpe','pb','ps'].forEach(k=>{ if(isNum(s[k])) o[k]=+(s[k]*r).toFixed(2); });
      ['dy','fcf'].forEach(k=>{ if(isNum(s[k])) o[k]=+(s[k]/r).toFixed(2); });
      if(isNum(s.ev)) o.ev=+(s.ev*(0.35+0.65*r)).toFixed(1); /* EV gồm cả nợ ròng — điều chỉnh xấp xỉ */
    }
  }
  if(Object.keys(o).length) o._liveFund=1; return o;
}
function latestDate(m){ const sn=LIVE.snap[m]; return sn&&sn.d||''; }
function isStale(q){ return !!q&&!!q.d&&!!latestDate(q.mk)&&q.d<latestDate(q.mk); }
function fmtLivePx(q){ if(!q||!isNum(q.px)) return '—'; const idx=String(q.t).startsWith('IDX'); return q.m==='US'? (idx?fmt(q.px,2):'$'+fmt(q.px,2)) : (idx?fmt(q.px,2):fmt(q.px,0)); }
function boardClass(q){
  if(!q||!isNum(q.pct)) return 'mut';
  const s=BY[q.t];
  if(q.m==='VN'&&s&&isNum(q.ref)&&!String(q.t).startsWith('IDX')){ const b=priceBand(q.ref,s.ex==='HNX'?'HNX':s.ex==='UPCOM'?'UPCOM':'HOSE'); if(q.px>=b.ceil) return 'ceil'; if(q.px<=b.floor) return 'floor'; }
  if(Math.abs(q.pct)<0.005) return 'ref'; return q.pct>0?'up':'dn';
}
function pctTxt(q){ if(!q||!isNum(q.pct)) return '—'; return (q.pct>0?'▲':q.pct<0?'▼':'■')+' '+fmt(Math.abs(q.pct),2)+'%'; }
function pxChip(t,opt){
  const etf=!!(opt&&opt.etf); const q=etf?liveE(t):liveQ(t); if(!q) return ''; const c=boardClass(q);
  return `<span class="lpx ${c}" data-px="${esc(t)}"${etf?' data-pxe="1"':''}>${fmtLivePx(q)} <small>${pctTxt(q)}</small>${isStale(q)?` <small class="mut">(${esc(q.d.slice(8,10)+'/'+q.d.slice(5,7))})</small>`:''}</span>`;
}
function seriesOf(q){ if(!q) return []; if(q.hist&&q.hist.length) return q.hist.map(b=>b[4]); return (q.cl||[]).filter(isNum); }
function sparkSVG(src,w,h){
  const raw=Array.isArray(src)?src:seriesOf(src);
  const c=raw.map(b=>Array.isArray(b)?b[4]:b).filter(isNum).slice(-60); if(c.length<2) return '';
  const lo=Math.min(...c),hi=Math.max(...c); const X=i=>i/(c.length-1)*w, Y=v=>h-2-(v-lo)/((hi-lo)||1)*(h-4);
  const up=c[c.length-1]>=c[0];
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true" style="display:block"><path d="${c.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ')}" fill="none" style="stroke:${up?'var(--up)':'var(--dn)'}" stroke-width="1.5"/></svg>`;
}

/* ---------- dựng bản ghi giá từ ảnh chụp + lịch sử ---------- */
function stockHid(s){ return s? s.m+'.'+(s.tk||s.t) : null; }
function mergeBars(bars,dates,cl){
  const out=(bars||[]).filter(b=>Array.isArray(b)&&b[0]&&isNum(b[4])).slice().sort((a,b)=>a[0]<b[0]?-1:1);
  const last=out.length?out[out.length-1][0]:'';
  (dates||[]).forEach((d,i)=>{ const c=cl&&cl[i]; if(d>last&&isNum(c)) out.push([d,c,c,c,c,null,1]); });
  return out;
}
function buildQ(id,raw,mk,row,sn,etf){
  const px=row[0], pct=row[1];
  const q={t:id,m:mk,mk:etf?'ETF':mk,px,pct,d:(row[3]||sn.d),cap:isNum(row[2])?row[2]:null};
  if(isNum(px)&&isNum(pct)){ q.ref=px/(1+pct/100); q.chg=px-q.ref; }
  q.cl=(sn.c&&sn.c[raw])||[]; q.dates=sn.dates||[];
  const hid= etf? 'E.'+raw : mk+'.'+raw; q.hid=hid;
  const hd=LIVE.hist[hid];
  if(hd){ q.hist=mergeBars(hd.bars,q.dates,q.cl); q.src=hd.src; q.adjWarn=hd.adjWarn||null; q.histKind='ohlc'; }
  else { q.hist=mergeBars([],q.dates,q.cl); q.histKind='close'; }
  const lb=q.hist[q.hist.length-1];
  if(lb&&lb[0]===q.d&&!lb[6]){ q.o=lb[1]; q.h=lb[2]; q.l=lb[3]; q.v=lb[5]; }
  return q;
}
function rebuildLive(){
  const q={}, e={};
  ['US','VN'].forEach(mk=>{
    const sn=LIVE.snap[mk]; if(!sn||!sn.q) return;
    Object.keys(sn.q).forEach(raw=>{ const row=sn.q[raw]; if(!Array.isArray(row)||!isNum(row[0])||row[0]<=0) return; const id= mk==='VN'? vnId(raw) : raw; q[id]=buildQ(id,raw,mk,row,sn,false); });
  });
  const se=LIVE.snap.ETF;
  if(se&&se.q) Object.keys(se.q).forEach(t=>{ const row=se.q[t]; if(!Array.isArray(row)||!isNum(row[0])||row[0]<=0) return; e[t]=buildQ(t,t,'US',row,se,true); });
  const si=LIVE.snap.IDX;
  if(si&&si.q) Object.keys(si.q).forEach(t=>{ const v=si.q[t]; if(v&&isNum(v.px)){ const mk=(t==='IDX.VNINDEX'||t==='IDX.VN30')?'VN':'US'; q[t]=Object.assign({},v,{t,m:mk,mk}); } });
  LIVE.q=q; LIVE.e=e;
  LIVE.status=(Object.keys(q).length||Object.keys(e).length)?'ok':'empty';
}
/* lịch sử nến lưu theo gói 40 mã: hist/US-0..12, hist/VN-0..12, hist/E-0..4 (thứ tự theo danh sách nhúng) */
const HCHUNK=40;
const CHUNK_OF={};
UNI_US.forEach((r,i)=>CHUNK_OF['US.'+r[0]]='US-'+Math.floor(i/HCHUNK));
UNI_VN.forEach((r,i)=>CHUNK_OF['VN.'+r[0]]='VN-'+Math.floor(i/HCHUNK));
ETF_UNI.forEach((r,i)=>CHUNK_OF['E.'+r[0]]='E-'+Math.floor(i/HCHUNK));
function ensureHist(id,etf){
  const db=LIVE.db; if(!db) return;
  const hid= etf? 'E.'+id : stockHid(BY[id]||STOCKS.find(x=>x.t===id)); if(!hid) return;
  const ck=CHUNK_OF[hid]; if(!ck||LIVE.histReq[ck]) return;
  LIVE.histReq[ck]=1;
  try{
    db.doc('hist/'+ck).get().then(s=>{
      if(!s||!s.exists) return; const v=s.data(); if(!v||!v.bars) return;
      const pre=ck.split('-')[0]==='E'?'E.':ck.split('-')[0]+'.';
      Object.keys(v.bars).forEach(t=>{ const b=v.bars[t]; if(Array.isArray(b)&&b.length) LIVE.hist[pre+t]={bars:b,src:(v.src&&v.src[t])||v.srcAll||'stockanalysis.com',adjWarn:v.adj&&v.adj[t]||null}; });
      rebuildLive(); liveChanged(false,{hist:etf?'E:'+id:id});
    }).catch(()=>{ LIVE.histReq[ck]=0; });
  }catch(e){}
}

let liveT=null, liveFull=false;
function liveChanged(full,info){
  if(full) liveFull=true;
  clearTimeout(liveT);
  liveT=setTimeout(()=>{
    const doFull=liveFull; liveFull=false;
    if(doFull) computeAll();
    const bs=$('#brandSub'); if(bs) bs.textContent= LIVE.status==='ok'? feedTimeText().replace(/ · cập nhật.*/,'') : 'Mỹ & Việt Nam · 6 nhân tố';
    if(!$('#sheet').hidden){
      $$('[data-px]').forEach(el=>{ const t=el.dataset.px; const tmp=document.createElement('span'); tmp.innerHTML=pxChip(t,{etf:!!el.dataset.pxe}); if(tmp.firstElementChild) el.replaceWith(tmp.firstElementChild); });
      const lb=$('#liveSlot'); if(lb&&lb.dataset.t){ const etf=!!lb.dataset.etf; const s=etf?EBY[lb.dataset.t]:BY[lb.dataset.t]; if(s) lb.innerHTML=liveBlockHTML(s,etf); }
      if(typeof refreshEtfSheet==='function') refreshEtfSheet(info);
      return;
    }
    if(S.view==='home') RENDER.home();
    else if(S.view==='screen'){ if(S.scrMode&&S.scrMode!=='stock'){ if(typeof renderEtfBody==='function') renderEtfBody(); } else if($('#resList')) renderList(); }
    else if(S.view==='port') RENDER.port();
    else if(S.view==='chart'&&(doFull||(info&&info.hist===CH.t))) RENDER.chart();
  },220);
}
function applyFundDoc(k,v){
  if(!v||!v.rows) return;
  if(k==='ETF'){ DBFUND.ETF=v.rows; if(Array.isArray(v.keys)) DBFUND.ekeys=v.keys; }
  else { DBFUND[k]=v.rows; if(Array.isArray(v.keys)) DBFUND.keys=v.keys; }
  DBFUND.asof[k]=v.upd||null;
  rebuildUniverse();
}
async function initLive(){
  let db=null;
  try{ if(window.claude&&typeof window.claude.use==='function') db=await window.claude.use('db'); }catch(e){ db=null; }
  if(!db){ LIVE.status='off'; liveChanged(false); return; }
  LIVE.db=db;
  try{
    let pending=4;
    ['US','VN','ETF','IDX'].forEach(k=>{
      db.doc('snap/'+k).onSnapshot(s=>{
        LIVE.snap[k]= s.exists? s.data() : null; rebuildLive();
        if(pending>0) pending--; if(pending===0||LIVE.status==='ok') liveChanged(true);
      },()=>{ if(pending>0) pending--; if(pending===0){ if(LIVE.status!=='ok') LIVE.status='off'; liveChanged(false); } });
    });
    ['US','VN','ETF'].forEach(k=>{
      db.doc('fund/'+k).onSnapshot(s=>{ if(s.exists){ applyFundDoc(k,s.data()); liveChanged(true); } },()=>{});
    });
    db.doc('meta/feed').onSnapshot(s=>{ LIVE.meta=s.exists?s.data():null; liveChanged(false); },()=>{});
  }catch(e){ LIVE.status='off'; liveChanged(false); }
}

const ETF_GROUP_ORDER=['Chỉ số Mỹ','Phong cách','Nhân tố','Cổ tức','Thu nhập quyền chọn','Ngành','Chủ đề','Quốc tế','Trái phiếu','Tiền mặt','Hàng hóa','Bất động sản','Tiền mã hóa','Biến động','Tiền tệ','Cổ phiếu đơn'];

function aumTxt(v){ return !isNum(v)?'—': v>=1? '$'+fmt(v,v>=100?0:1)+' tỷ' : '$'+fmt(v*1000,0)+' tr'; }

function closeMap(t){ const q=liveE(t); const m=new Map(); (q&&q.hist||[]).forEach(b=>{ if(isNum(b[4])) m.set(b[0],b[4]); }); return m; }
function pairStats(i){
  const [a,b,g,u]=ETF_PAIRS[i]; const A=EBY[a]||{t:a}, B=EBY[b]||{t:b};
  const qa=liveE(a), qb=liveE(b);
  const ma=closeMap(a), mb=closeMap(b);
  const dates=[...ma.keys()].filter(d=>mb.has(d)).sort();
  const la=dates.map(d=>ma.get(d)), lb=dates.map(d=>mb.get(d));
  const ra=[], rb=[];
  for(let k=1;k<dates.length;k++){ ra.push(la[k]/la[k-1]-1); rb.push(lb[k]/lb[k-1]-1); }
  let corr=null, beta=null;
  if(ra.length>=8){
    const n=ra.length, mA=ra.reduce((x,y)=>x+y,0)/n, mB=rb.reduce((x,y)=>x+y,0)/n;
    let sab=0,saa=0,sbb=0; for(let k=0;k<n;k++){ sab+=(ra[k]-mA)*(rb[k]-mB); saa+=(ra[k]-mA)**2; sbb+=(rb[k]-mB)**2; }
    corr= saa&&sbb? sab/Math.sqrt(saa*sbb) : null; beta= saa? sab/saa : null;
  }
  const n=dates.length;
  const retA= n>=2? (la[n-1]/la[0]-1)*100 : null, retB= n>=2? (lb[n-1]/lb[0]-1)*100 : null;
  const both= n>=2? ((la[n-1]/la[0]+lb[n-1]/lb[0])/2-1)*100 : null;
  /* lợi nhuận tài sản cơ sở suy ra từ chuỗi long: tích lũy r/lev */
  let under=null; if(ra.length&&isNum(A.lev)&&A.lev){ under=(ra.reduce((p,r)=>p*(1+r/A.lev),1)-1)*100; }
  const levA=isNum(A.lev)?A.lev:1, levB=isNum(B.lev)?B.lev:-1;
  const dev= qa&&qb&&isNum(qa.pct)&&isNum(qb.pct)&&qa.d===qb.d? qa.pct/Math.abs(levA)+qb.pct/Math.abs(levB) : null;
  return {i,a,b,g,u,A,B,qa,qb,dates,la,lb,ra,rb,corr,beta,retA,retB,both,under,dev,levA,levB,n};
}
function pairMiniSVG(P,w,h){
  if(P.n<3) return `<div class="note" style="text-align:center;padding:14px 0">Chưa đủ lịch sử giá chung</div>`;
  const na=P.la.map(v=>v/P.la[0]*100), nb=P.lb.map(v=>v/P.lb[0]*100);
  const all=na.concat(nb), lo=Math.min(...all,100), hi=Math.max(...all,100);
  const X=i=>2+i/(P.n-1)*(w-4), Y=v=>h-3-(v-lo)/((hi-lo)||1)*(h-6);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" preserveAspectRatio="none" aria-hidden="true" style="display:block"><line x1="0" x2="${w}" y1="${Y(100).toFixed(1)}" y2="${Y(100).toFixed(1)}" style="stroke:var(--line2)" stroke-dasharray="3 3"/><path d="${path(na)}" fill="none" style="stroke:var(--up)" stroke-width="1.7"/><path d="${path(nb)}" fill="none" style="stroke:var(--dn)" stroke-width="1.7"/></svg>`;
}
function pctSpan(q){ if(!q||!isNum(q.pct)) return '<span class="mut">—</span>'; return `<span class="${q.pct>0?'up':q.pct<0?'dn':'ref'}">${q.pct>0?'+':''}${fmt(q.pct,2)}%</span>`; }
function pairsStripHTML(){
  if(!ETF_PAIRS.length||!Object.keys(LIVE.e).length) return '';
  const L=ETF_PAIRS.map((p,i)=>({i,a:p[0],b:p[1],u:p[3],qa:liveE(p[0]),qb:liveE(p[1])})).filter(x=>x.qa&&x.qb&&isNum(x.qa.pct)).sort((x,y)=>Math.abs(y.qa.pct)-Math.abs(x.qa.pct)).slice(0,4);
  if(!L.length) return '';
  return `<div class="pair-strip"><div class="sec-h" style="margin:10px 0 6px"><span class="mut" style="font-size:12.5px;font-weight:600">Cặp ETF đối xứng biến động mạnh nhất</span><button class="btn sm ghost" data-gopairs="1">Tất cả cặp</button></div>

}

function etfSortVal(e,k){
  const q=liveE(e.t);
  switch(k){ case 'aum': return isNum(e.aum)?e.aum:-1; case 'er': return isNum(e.er)?-e.er:-99; case 'dy': return isNum(e.dy)?e.dy:-1;
    case 'r1y': return isNum(e.r1y)?e.r1y:-999; case 'chg': return q&&isNum(q.pct)?q.pct:-999; case 'chgabs': return q&&isNum(q.pct)?Math.abs(q.pct):-1;
    case 'b': return isNum(e.b)?e.b:-9; case 'lev': return isNum(e.lev)?Math.abs(e.lev)*(e.lev<0?1.001:1):0; case 'age': return isNum(e.inc)?-e.inc:-9999; }
  return 0;
}

function renderEtfScatter(){

function pairSortVal(P,k){
  switch(k){ case 'move': return P.qa&&isNum(P.qa.pct)?Math.abs(P.qa.pct):-1; case 'decay': return isNum(P.both)?-P.both:-999;
    case 'dev': return isNum(P.dev)?Math.abs(P.dev):-1; case 'lev': return Math.abs(P.levA||1); case 'grp': return -ETF_PAIRS.findIndex(x=>x[2]===P.g)*1000-P.i; }
  return 0;
}

function pairScatterSVG(P){
  if(P.ra.length<5) return '';

  const X=v=>W/2+v/mx*(W/2-p), Y=v=>H/2-v/mx*(H/2-p);
  let g=`<line class="axis" x1="${p}" x2="${W-p}" y1="${H/2}" y2="${H/2}"/><line class="axis" x1="${W/2}" x2="${W/2}" y1="${p/2}" y2="${H-p/2}"/>`;
  const ideal=P.levB/P.levA; g+=`<line x1="${X(-mx)}" y1="${Y(-mx*ideal)}" x2="${X(mx)}" y2="${Y(mx*ideal)}" style="stroke:var(--gold)" stroke-dasharray="4 3" stroke-width="1.2"/>`;
  P.ra.forEach((r,k)=>{ g+=`<circle cx="${X(r).toFixed(1)}" cy="${Y(P.rb[k]).toFixed(1)}" r="2.6" style="fill:var(--us);fill-opacity:.7"/>`; });
  g+=`<text x="${W-p}" y="${H/2-4}" text-anchor="end">${esc(P.a)} →</text><text x="${W/2+4}" y="${p/2+8}">↑ ${esc(P.b)}</text><text x="${p}" y="${H-6}" style="fill:var(--gold);font-size:9px">Đứt nét: đối xứng hoàn hảo (hệ số ${fmt(ideal,2)})</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lợi nhuận ngày của ${esc(P.a)} so với ${esc(P.b)}">${g}</svg>`;
}
function pairBigSVG(P){
  if(P.n<3) return '<p class="note">Lịch sử giá chung của hai quỹ đang được tải hoặc chưa có.</p>';
  const W=340,H=170,p={l:34,r:8,t:10,b:22};
  const na=P.la.map(v=>v/P.la[0]*100), nb=P.lb.map(v=>v/P.lb[0]*100), nh=na.map((v,i)=>(v+nb[i])/2);
  const all=na.concat(nb), lo=Math.min(...all), hi=Math.max(...all);
  const X=i=>p.l+i/(P.n-1)*(W-p.l-p.r), Y=v=>H-p.b-(v-lo)/((hi-lo)||1)*(H-p.t-p.b);
  const path=a=>a.map((v,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1)).join(' ');
  let g=''; [lo,(lo+hi)/2,hi].forEach(v=>g+=`<line class="grid-l" x1="${p.l}" x2="${W-p.r}" y1="${Y(v)}" y2="${Y(v)}"/><text x="${p.l-4}" y="${Y(v)+3}" text-anchor="end">${fmt(v,0)}</text>`);
  g+=`<line x1="${p.l}" x2="${W-p.r}" y1="${Y(100)}" y2="${Y(100)}" style="stroke:var(--line2)" stroke-dasharray="3 3"/>`;
  g+=`<path d="${path(na)}" fill="none" style="stroke:var(--up)" stroke-width="2"/><path d="${path(nb)}" fill="none" style="stroke:var(--dn)" stroke-width="2"/><path d="${path(nh)}" fill="none" style="stroke:var(--gold)" stroke-width="1.6" stroke-dasharray="5 3"/>`;
  g+=`<text x="${p.l}" y="${H-6}">${esc(fmtDate(P.dates[0]))}</text><text x="${W-p.r}" y="${H-6}" text-anchor="end">${esc(fmtDate(P.dates[P.n-1]))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Diễn biến hai quỹ, chuẩn hóa về 100">${g}</svg><div class="legend"><span><i style="background:var(--up)"></i>${esc(P.a)}</span><span><i style="background:var(--dn)"></i>${esc(P.b)}</span><span><i style="background:var(--gold)"></i>Giữ cả hai 50/50</span></div>`;
}

  f:'Tỷ trọng cổ phiếu phù hợp phụ thuộc: thời gian chưa cần tiền + mức giảm chịu được + độ ổn định thu nhập',
  pts:['Trước khi hỏi “mua mã gì”, hãy trả lời: tiền này để làm gì, khi nào cần, nếu mất 30% thì đời sống có bị ảnh hưởng không.','Phép thử thực tế: nếu danh mục giảm 30% trong ba tháng, bạn sẽ bán tháo, đứng yên hay mua thêm? Câu trả lời trung thực quyết định tỷ trọng cổ phiếu.','Người có thu nhập ổn định, còn trẻ, chưa cần tiền trong 10 năm có thể nắm nhiều cổ phiếu hơn người sắp nghỉ hưu.','Kiến thức cũng là một phần khẩu vị rủi ro: chưa đọc được BCTC thì nên dùng quỹ chỉ số nhiều hơn cổ phiếu riêng lẻ.','Viết ra một trang “chính sách đầu tư cá nhân”: mục tiêu, tỷ trọng, quy tắc mua bán. Đọc lại mỗi khi thị trường làm bạn hoảng.'],
  thr:[['Thận trọng','Khoảng 20–40% cổ phiếu, còn lại tiền gửi, trái phiếu'],['Cân bằng','Khoảng 50–70% cổ phiếu'],['Tăng trưởng','Khoảng 80–100% cổ phiếu, thời gian trên 10 năm']],
  hook:'<b>Mẹo nhớ:</b> danh mục tốt nhất là danh mục bạn giữ được qua cả mùa thị trường sập.',src:'CFA Institute, Elements of an Investment Policy Statement for Individual Investors (2010); Vanguard, Investor Questionnaire.'},
 {id:'l3-inflation',t:'Lạm phát và lợi nhuận thực',d:'Tiền đứng yên là tiền mất giá',
  vis:()=>{ let g=''; const yrs=[[0,100],[5,82.2],[10,67.6],[15,55.5],[20,45.6]];
    yrs.forEach(([y,v],i)=>{ const x=18+i*38, h=v*0.62; g+=`<rect x="${x}" y="${94-h}" width="26" height="${h}" rx="3" style="fill:var(--gold);fill-opacity:${1-i*.15}"/>`+T(x+13,90-h,fmt(v,1),'text-anchor="middle" style="font-size:7.5px;font-weight:800"')+T(x+13,103,y?'sau '+y+' năm':'hôm nay','text-anchor="middle" style="font-size:6.5px"'); });
    g+=T(100,10,'Sức mua của 100 triệu đồng nếu lạm phát 4%/năm','text-anchor="middle" '+TB)+T(100,117,'Tiền gửi phải sinh lời hơn lạm phát mới thật sự tăng','text-anchor="middle" '+TS);
    return sv(g,'Sức mua của 100 triệu giảm dần theo lạm phát 4% mỗi năm'); },
  f:'Lợi nhuận thực = (1 + lợi nhuận danh nghĩa) ÷ (1 + lạm phát) − 1 ≈ danh nghĩa − lạm phát',
  pts:['Lạm phát (CPI) Việt Nam khoảng 3–4%/năm trong vài năm gần đây. Với 4%/năm, sức mua của tiền giảm một nửa sau khoảng 18 năm.','Gửi tiết kiệm 5% khi lạm phát 3,5% thì lợi nhuận thực chỉ khoảng 1,4%/năm.','Cổ phiếu là quyền sở hữu doanh nghiệp — doanh nghiệp tăng giá bán theo lạm phát — nên về dài hạn thường giữ được sức mua tốt hơn tiền mặt và trái phiếu lãi cố định.','Lạm phát cao làm lãi suất tăng, định giá cổ phiếu thường giảm trong ngắn hạn — ngắn hạn và dài hạn có thể ngược nhau.','Luôn so sánh mục tiêu tích sản bằng “tiền hôm nay”: 5 tỷ sau 20 năm chỉ tương đương khoảng 2,3 tỷ bây giờ nếu lạm phát 4%.'],
  thr:[['Lạm phát 4%/năm','Sức mua giảm một nửa sau ≈ 18 năm'],['Lợi nhuận thực âm','Đang nghèo đi dù số dư tăng'],['Mục tiêu tích sản','Luôn quy về tiền hôm nay']],
  hook:'<b>Mẹo nhớ:</b> lạm phát là khoản thuế vô hình đánh vào người giữ tiền mặt.',src:'Tổng cục Thống kê, chỉ số giá tiêu dùng (CPI); Fisher, The Theory of Interest (1930).'},
 /* ---------- cấp 4: đọc BCTC ---------- */
 {id:'l4-bs',t:'Bảng cân đối kế toán chi tiết',d:'Tài sản ngắn hạn, dài hạn và nguồn vốn',
  vis:()=>{ let g=''; const L=[['Tiền & tương đương',18,'var(--up)'],['Phải thu',20,'var(--us)'],['Hàng tồn kho',22,'var(--gold)'],['TSCĐ, XDCB',30,'var(--mut)'],['Đầu tư dài hạn',10,'var(--vn)']], R=[['Nợ ngắn hạn',30,'var(--dn)'],['Nợ dài hạn',20,'var(--dn)'],['Vốn chủ sở hữu',50,'var(--up)']];
    let y=18; L.forEach(([n,h,c])=>{ g+=`<rect x="14" y="${y}" width="74" height="${h*0.9-1}" rx="2" style="fill:${c};fill-opacity:.55"/>`+T(51,y+h*0.45+2,n,'text-anchor="middle" style="font-size:6.6px;font-weight:700"'); y+=h*0.9; });
    y=18; R.forEach(([n,h,c],i)=>{ g+=`<rect x="112" y="${y}" width="74" height="${h*0.9-1}" rx="2" style="fill:${c};fill-opacity:${i===1?.35:.55}"/>`+T(149,y+h*0.45+2,n,'text-anchor="middle" style="font-size:6.6px;font-weight:700"'); y+=h*0.9; });
    g+=T(51,12,'TÀI SẢN','text-anchor="middle" '+TB)+T(149,12,'NGUỒN VỐN','text-anchor="middle" '+TB)+T(100,64,'=','text-anchor="middle" style="font-size:14px;font-weight:800"');
    g+=T(51,118,'Có gì','text-anchor="middle" '+TS)+T(149,118,'Tiền từ đâu','text-anchor="middle" '+TS);
    return sv(g,'Cấu trúc bảng cân đối kế toán: tài sản bằng nợ cộng vốn chủ'); },
  f:'Vốn lưu động = Tài sản ngắn hạn − Nợ ngắn hạn · Nợ vay ròng = Vay ngắn + dài hạn − Tiền và tương đương tiền',
  pts:['Tài sản ngắn hạn (dưới 12 tháng): tiền, đầu tư tài chính ngắn hạn, phải thu khách hàng, trả trước cho người bán, phải thu khác, hàng tồn kho.','Tài sản dài hạn: tài sản cố định, xây dựng cơ bản dở dang, bất động sản đầu tư, đầu tư vào công ty liên kết, lợi thế thương mại.','Nợ phải trả: phải trả người bán, người mua trả tiền trước (rất lớn ở doanh nghiệp bất động sản), vay ngắn hạn và dài hạn, trái phiếu.','Vốn chủ sở hữu: vốn góp, thặng dư vốn, lợi nhuận sau thuế chưa phân phối, lợi ích cổ đông không kiểm soát.','Đọc theo xu hướng: so sánh 4–8 kỳ liên tiếp. Khoản nào tăng nhanh bất thường so với doanh thu là chỗ cần đọc thuyết minh.','Chú ý “phải thu khác” và “trả trước cho người bán” lớn — ở Việt Nam đôi khi là kênh chuyển tiền cho bên liên quan.'],
  thr:[['Nợ vay ròng ÷ Vốn chủ dưới 1','Đòn bẩy vừa phải với doanh nghiệp sản xuất'],['Tài sản ngắn hạn lớn hơn nợ ngắn hạn','Đủ khả năng trả nợ đến hạn'],['Phải thu khác, trả trước tăng mạnh','Đọc thuyết minh: đối tượng là ai?']],
  hook:'<b>Mẹo nhớ:</b> bên trái là “có gì”, bên phải là “tiền từ đâu” — hai bên luôn bằng nhau.',src:'Thông tư 200/2014/TT-BTC (mẫu B01-DN); Chuẩn mực kế toán Việt Nam VAS 21.'},
 {id:'l4-is',t:'Báo cáo kết quả kinh doanh chi tiết',d:'Lợi nhuận đến từ đâu, có lặp lại không',
  vis:()=>{ const st=[['Doanh thu',100,0,'var(--us)'],['Giá vốn',-70,0,'var(--dn)'],['LN gộp',30,1,'var(--up)'],['Bán hàng & QL',-14,0,'var(--dn)'],['Tài chính',-2,0,'var(--dn)'],['LN khác',4,0,'var(--gold)'],['Thuế',-4,0,'var(--dn)'],['LNST',14,1,'var(--up)']];

    st.forEach(([n,v,tot,c],i)=>{ const x=8+i*23.5; let a,b; if(tot){ a=0;b=v; run=v; } else { a=run; b=run+v; run=b; }

    return sv(g,'Thác lợi nhuận từ doanh thu đến lợi nhuận sau thuế'); },
  f:'LN thuần từ HĐKD = LN gộp + DT tài chính − CP tài chính + LN liên doanh − CP bán hàng − CP quản lý',
  pts:['Doanh thu thuần đã trừ giảm giá, hàng bán bị trả lại. Giá vốn hàng bán là chi phí trực tiếp tạo ra sản phẩm.','Lợi nhuận gộp ÷ doanh thu = biên gộp, đo sức mạnh định giá. Chi phí bán hàng và quản lý đo hiệu quả vận hành.','Doanh thu và chi phí tài chính gồm lãi tiền gửi, lãi vay, chênh lệch tỷ giá, lãi lỗ đầu tư chứng khoán — dễ biến động.','“Lợi nhuận khác” và lãi thanh lý tài sản, đánh giá lại khoản đầu tư là một lần. Khi định giá, dùng lợi nhuận cốt lõi đã loại các khoản này.','EPS tính trên lợi nhuận sau thuế của cổ đông công ty mẹ, không phải tổng lợi nhuận hợp nhất (có phần của cổ đông không kiểm soát).','So sánh quý này với cùng quý năm trước (YoY) để loại mùa vụ; dùng tổng 4 quý gần nhất (TTM) để tính P/E.'],
  thr:[['Lợi nhuận khác trên 20% LNTT','Lợi nhuận kém bền vững'],['Chi phí lãi vay trên 30% LN gộp','Đòn bẩy đang ăn lợi nhuận'],['LN tăng nhanh hơn DT nhiều quý','Biên mở rộng thật — hoặc yếu tố bất thường']],
  hook:'<b>Mẹo nhớ:</b> hỏi mỗi dòng lợi nhuận một câu: “năm sau còn lặp lại không?”',src:'Thông tư 200/2014/TT-BTC (mẫu B02-DN); VAS 01, VAS 14.'},
 {id:'l4-ratios',t:'Bộ chỉ số tài chính cốt lõi',d:'Thanh khoản, đòn bẩy, hiệu quả, sinh lời',
  vis:()=>{ const q=[['THANH KHOẢN','var(--us)',['Hiện hành = TSNH ÷ Nợ NH','Nhanh = (TSNH − HTK) ÷ Nợ NH']],['ĐÒN BẨY','var(--dn)',['Nợ vay ròng ÷ EBITDA','Trả lãi = EBIT ÷ Chi phí lãi']],['HIỆU QUẢ','var(--gold)',['Vòng quay TS = DT ÷ Tổng TS','Ngày thu tiền = PT ÷ DT × 365']],['SINH LỜI','var(--up)',['ROE = LNST ÷ Vốn CSH','ROIC = EBIT(1−t) ÷ Vốn ĐT']]];
    let g=''; q.forEach(([n,c,f],i)=>{ const x=6+(i%2)*97, y=8+Math.floor(i/2)*56; g+=`<rect x="${x}" y="${y}" width="91" height="50" rx="7" style="fill:var(--s1);stroke:${c}"/>`+T(x+45.5,y+13,n,`text-anchor="middle" style="font-size:7.5px;font-weight:800;fill:${c}"`)+f.map((t,k)=>T(x+45.5,y+27+k*11,t,'text-anchor="middle" style="font-size:5.4px"')).join(''); });

  f:'Đọc chỉ số theo xu hướng 3–5 năm và so với trung vị ngành — một con số đơn lẻ không nói lên nhiều',
  pts:['Thanh khoản: hệ số hiện hành, hệ số nhanh, hệ số tiền mặt — doanh nghiệp có trả được nợ đến hạn không.','Đòn bẩy: nợ vay ÷ vốn chủ, nợ vay ròng ÷ EBITDA (bao nhiêu năm lợi nhuận hoạt động để trả hết nợ), khả năng trả lãi (EBIT ÷ chi phí lãi vay).','Hiệu quả: vòng quay tài sản, số ngày thu tiền, số ngày tồn kho, số ngày trả tiền người bán — tiền bị “chôn” bao lâu.','Sinh lời: biên gộp, biên ròng, ROA, ROE, ROIC. ROE cao nhờ đòn bẩy kém chất lượng hơn ROE cao nhờ biên lợi nhuận (xem bài DuPont).','Ngân hàng, bảo hiểm, chứng khoán dùng bộ chỉ số riêng (xem bài “Đọc BCTC theo ngành”).','Trang chi tiết mỗi mã trong ứng dụng đã tính sẵn phần lớn các chỉ số này.'],
  thr:[['Hệ số hiện hành trên 1,2','Thanh khoản ổn'],['Nợ vay ròng ÷ EBITDA dưới 3','Đòn bẩy chấp nhận được'],['Khả năng trả lãi trên 3 lần','Không bị áp lực lãi vay']],
  hook:'<b>Mẹo nhớ:</b> bốn câu hỏi — trả nợ được không, vay nhiều không, dùng tài sản giỏi không, kiếm lời giỏi không.',src:'CFA Institute, Financial Analysis Techniques (CFA Program Curriculum Level I).'},
 {id:'l4-notes',t:'Thuyết minh và ý kiến kiểm toán',d:'Nơi ẩn chứa thông tin quan trọng nhất',
  vis:()=>{ const op=[['Chấp nhận toàn phần','An tâm','var(--up)'],['Có đoạn nhấn mạnh','Đọc kỹ đoạn đó','var(--us)'],['Ngoại trừ','Cẩn trọng cao','var(--gold)'],['Trái ngược / Từ chối','Tránh xa','var(--dn)']];
    let g=T(100,12,'Bốn mức ý kiến kiểm toán','text-anchor="middle" '+TB); op.forEach(([a,b,c],i)=>{ const y=20+i*22; g+=`<rect x="8" y="${y}" width="${124-i*12}" height="18" rx="5" style="fill:${c};fill-opacity:.75"/>`+T(14,y+12,a,'style="font-size:7px;font-weight:800;fill:var(--bg)"')+T(194,y+12,b,'text-anchor="end" style="font-size:6.8px;font-weight:700"'); });
    g+=T(100,118,'Đọc ý kiến kiểm toán trước, số liệu sau','text-anchor="middle" '+TS);
    return sv(g,'Các mức ý kiến kiểm toán từ an toàn đến rủi ro'); },
  f:'Thứ tự đọc: Ý kiến kiểm toán → Chính sách kế toán → Bên liên quan → Vay nợ, bảo lãnh → Sự kiện sau ngày kết thúc kỳ',
  pts:['Ý kiến kiểm toán có bốn mức: chấp nhận toàn phần; ngoại trừ (một phần số liệu không đủ bằng chứng hoặc sai); trái ngược; từ chối đưa ra ý kiến. Có thể kèm đoạn “vấn đề cần nhấn mạnh”, ví dụ nghi ngờ khả năng hoạt động liên tục.','Cổ phiếu có ý kiến ngoại trừ, trái ngược hoặc từ chối có thể bị đưa vào diện cảnh báo, kiểm soát, thậm chí hủy niêm yết nếu lặp lại.','Thuyết minh cho biết chi tiết từng khoản: vay ai, lãi suất bao nhiêu, tài sản thế chấp, phải thu của ai, giao dịch với công ty của lãnh đạo.','So sánh số liệu trước và sau kiểm toán (hoặc soát xét bán niên): chênh lệch lợi nhuận lớn là dấu hiệu kế toán thiếu thận trọng.','BCTC hợp nhất thể hiện cả tập đoàn; BCTC riêng chỉ công ty mẹ. Cổ tức chi từ lợi nhuận chưa phân phối của công ty mẹ.','Đổi công ty kiểm toán thường xuyên, nộp báo cáo trễ hạn — cờ vàng về quản trị.'],
  thr:[['Ý kiến ngoại trừ','Tìm hiểu lý do trước khi mua'],['Từ chối hoặc trái ngược','Loại khỏi danh sách'],['Chênh lệch trước – sau kiểm toán lớn','Giảm độ tin cậy với số liệu tự lập']],
  hook:'<b>Mẹo nhớ:</b> con số ở trang đầu, sự thật ở thuyết minh.',src:'Chuẩn mực kiểm toán Việt Nam VSA 700, 705, 706; Thông tư 96/2020/TT-BTC về công bố thông tin.'},
 /* ---------- cấp 5: dòng tiền & sức khỏe ---------- */

    return sv(g,'Dấu của ba dòng tiền theo từng pha vòng đời doanh nghiệp'); },
  f:'Tiền cuối kỳ = Tiền đầu kỳ + Lưu chuyển từ kinh doanh (CFO) + từ đầu tư (CFI) + từ tài chính (CFF)',
  pts:['CFO — dòng tiền kinh doanh: tiền thu từ khách hàng trừ tiền trả nhà cung cấp, nhân viên, lãi vay, thuế. Đây là “máu” của doanh nghiệp.','CFI — dòng tiền đầu tư: chi mua sắm tài sản cố định (capex), góp vốn, mua bán công ty con, gửi tiền có kỳ hạn; thường âm khi doanh nghiệp mở rộng.','CFF — dòng tiền tài chính: vay và trả nợ, phát hành cổ phiếu, trả cổ tức tiền mặt.','Phần lớn doanh nghiệp Việt Nam lập CFO theo phương pháp gián tiếp: bắt đầu từ lợi nhuận trước thuế, cộng khấu hao, điều chỉnh thay đổi phải thu, tồn kho, phải trả.','Nhìn tổ hợp dấu để biết pha vòng đời: doanh nghiệp trưởng thành có CFO dương, dùng tiền đó để đầu tư và trả nợ, trả cổ tức (+, −, −).','Đáng lo nhất: lợi nhuận dương nhiều năm nhưng CFO âm, phải liên tục vay mới (CFF dương) để bù.'],
  thr:[['CFO ÷ LNST trên 1 (3–5 năm)','Lợi nhuận thành tiền thật'],['CFO âm nhiều năm khi có lãi','Cờ đỏ chất lượng lợi nhuận'],['Cổ tức trả bằng tiền vay','Không bền vững']],
  hook:'<b>Mẹo nhớ:</b> lợi nhuận là ý kiến, tiền mặt là sự thật.',src:'VAS 24 (Báo cáo lưu chuyển tiền tệ); Dickinson (2011), Cash Flow Patterns as a Proxy for Firm Life Cycle, The Accounting Review 86(6).'},
 {id:'l5-capex',t:'Capex, khấu hao và lợi nhuận chủ sở hữu',d:'Tiền để đứng yên và tiền để lớn lên',
  vis:()=>{ let g=''; const parts=[['Capex bảo trì',30,'var(--dn)'],['Capex mở rộng',35,'var(--us)'],['Tiền tự do',35,'var(--up)']]; let x=10;
    g+=T(100,14,'Dòng tiền kinh doanh = 100','text-anchor="middle" '+TB);

    g+=T(10,70,'≈ khấu hao: giữ năng lực hiện có','style="font-size:6.5px;fill:var(--dn)"')+T(10,82,'Mở rộng: chỉ tốt khi ROIC của dự án > chi phí vốn','style="font-size:6.5px;fill:var(--us)"')+T(10,94,'Tiền tự do: trả cổ tức, mua lại cổ phiếu, trả nợ','style="font-size:6.5px;fill:var(--up)"');

    return sv(g,'Phân bổ dòng tiền kinh doanh: capex bảo trì, capex mở rộng, tiền tự do'); },
  f:'Lợi nhuận chủ sở hữu (Buffett) = LNST + Khấu hao − Capex bảo trì − Tăng vốn lưu động cần thiết',
  pts:['Capex là tiền chi mua, xây tài sản cố định — xem dòng “Tiền chi để mua sắm, xây dựng TSCĐ” trên báo cáo lưu chuyển tiền tệ.','Capex bảo trì giữ nguyên năng lực sản xuất (thay máy cũ); capex mở rộng tạo tăng trưởng mới. Báo cáo không tách riêng; ước lượng thô: capex bảo trì ≈ khấu hao.','FCF = CFO − toàn bộ capex. Doanh nghiệp đang mở rộng mạnh có FCF âm tạm thời — không xấu nếu dự án có ROIC cao.','Doanh nghiệp “thâm dụng vốn” (thép, hàng không, điện) cần capex lớn mãi mãi để đứng yên; doanh nghiệp “nhẹ vốn” (phần mềm, bán lẻ online, thương hiệu tiêu dùng) giữ lại nhiều tiền tự do hơn.','Xây dựng cơ bản dở dang kéo dài nhiều năm mà không chuyển thành tài sản tạo doanh thu là dấu hiệu dự án gặp vấn đề.'],
  thr:[['Capex ÷ Khấu hao gần 1','Chủ yếu bảo trì, tăng trưởng thấp'],['Capex ÷ Khấu hao trên 2','Đang mở rộng mạnh — kiểm tra nguồn vốn'],['FCF dương đều nhiều năm','Có thể trả cổ tức bền vững']],
  hook:'<b>Mẹo nhớ:</b> khấu hao là chi phí thật — máy móc rồi sẽ phải thay.',src:'Buffett, Thư gửi cổ đông Berkshire Hathaway 1986 (Owner earnings); Greenwald và cộng sự, Value Investing: From Graham to Buffett and Beyond (2001).'},

  f:'Tỷ lệ dồn tích = (LNST − CFO) ÷ Tổng tài sản bình quân · Mong muốn: CFO ÷ LNST ≥ 1',
  pts:['Kế toán dồn tích ghi nhận doanh thu khi bán, không phải khi thu tiền — nên lợi nhuận và tiền có thể lệch nhau, nhất là khi bán chịu.','Nghiên cứu của Sloan (1996): doanh nghiệp có phần lợi nhuận “dồn tích” lớn (không đi kèm tiền) thường có lợi nhuận và giá cổ phiếu kém hơn về sau.','Dấu hiệu lợi nhuận kém chất lượng: phải thu tăng nhanh hơn doanh thu, tồn kho phình to, vốn hóa chi phí lãi vay vào tài sản, hoàn nhập dự phòng, lãi đánh giá lại.','Kiểm tra số ngày thu tiền (DSO): tăng đột biến là doanh nghiệp đang nới lỏng bán chịu để “đẩy” doanh thu.','Lợi nhuận chất lượng cao: CFO xấp xỉ hoặc lớn hơn LNST nhiều năm, biên lợi nhuận ổn định, ít khoản bất thường.'],
  thr:[['Tỷ lệ dồn tích trên 10% tài sản','Cảnh báo'],['DSO tăng hơn 30% trong một năm','Soi chính sách bán chịu'],['CFO ÷ LNST trung bình 3 năm dưới 0,5','Lợi nhuận khó tin']],
  hook:'<b>Mẹo nhớ:</b> doanh thu chưa thu được tiền chỉ là một lời hứa.',src:'Sloan (1996), Do Stock Prices Fully Reflect Information in Accruals and Cash Flows about Future Earnings?, The Accounting Review 71(3); Schilit, Perler & Engelhart, Financial Shenanigans (4th ed., 2018).'},
 {id:'l5-redflags',t:'12 cờ đỏ trong báo cáo tài chính',d:'Danh sách kiểm tra trước khi xuống tiền',
  vis:()=>{ const f=['CFO âm khi có lãi','Phải thu tăng vọt','Phải thu khác lớn','Tồn kho phình to','Lãi từ thanh lý','Vay ngắn đầu tư dài','Phát hành liên tục','Bên liên quan lớn','Kiểm toán ngoại trừ','Lãnh đạo bán ra','Lệch sau kiểm toán','XDCB dở dang lâu'];
    let g=''; f.forEach((t,i)=>{ const x=4+(i%3)*65, y=8+Math.floor(i/3)*28; g+=`<rect x="${x}" y="${y}" width="62" height="24" rx="5" style="fill:var(--s1);stroke:var(--dn)" stroke-opacity=".6"/><path d="M${x+6} ${y+18} V${y+5} l7 3 -7 3" style="fill:var(--dn);stroke:var(--dn)" stroke-width="1"/>`;
      const w=t.split(' '); const l1=w.slice(0,Math.ceil(w.length/2)).join(' '), l2=w.slice(Math.ceil(w.length/2)).join(' '); g+=T(x+37,y+11,l1,'text-anchor="middle" style="font-size:6.2px;font-weight:700"')+T(x+37,y+19,l2,'text-anchor="middle" style="font-size:6.2px;font-weight:700"'); });
    return sv(g,'Mười hai cờ đỏ thường gặp trong báo cáo tài chính'); },
  f:'Một cờ đỏ = cần lời giải thích · Ba cờ đỏ trở lên = bỏ qua, thị trường còn hàng trăm lựa chọn khác',
  pts:['1. Lợi nhuận dương nhiều năm nhưng dòng tiền kinh doanh âm.','2. Phải thu khách hàng tăng nhanh hơn doanh thu nhiều kỳ liên tiếp.','3. “Phải thu khác”, “trả trước cho người bán”, “cho vay” lớn và không rõ đối tượng.','4. Hàng tồn kho tăng nhanh hơn doanh thu (hàng khó bán, có thể phải trích lập dự phòng).','5. Lợi nhuận đến chủ yếu từ thanh lý tài sản, đánh giá lại, hoàn nhập dự phòng.','6. Vay ngắn hạn để đầu tư dự án dài hạn (lệch kỳ hạn, dễ gãy khi tín dụng thắt chặt).','7. Phát hành tăng vốn liên tục, EPS bị pha loãng, tiền huy động dùng sai mục đích công bố.','8. Giao dịch lớn với bên liên quan: mua bán, cho vay, bảo lãnh cho công ty của lãnh đạo.','9. Ý kiến kiểm toán ngoại trừ, đổi công ty kiểm toán, nộp báo cáo trễ hạn.','10. Lãnh đạo, cổ đông lớn bán ra mạnh; cổ phiếu cầm cố bị bán giải chấp.','11. Lợi nhuận sau kiểm toán chênh lệch lớn so với báo cáo tự lập.','12. Xây dựng cơ bản dở dang, vốn hóa lãi vay lớn và kéo dài nhiều năm.'],
  thr:[['0 cờ đỏ','Tiếp tục định giá'],['1–2 cờ đỏ','Tìm lời giải thích trong thuyết minh, báo cáo thường niên'],['3+ cờ đỏ','Loại']],
  hook:'<b>Mẹo nhớ:</b> bạn không cần đúng ở mọi cổ phiếu — chỉ cần tránh những cổ phiếu có thể làm mất trắng.',src:'Schilit, Perler & Engelhart, Financial Shenanigans (2018); Beneish (1999), The Detection of Earnings Manipulation, Financial Analysts Journal 55(5).'},
 {id:'l5-practice',t:'Thực hành: đọc BCTC trong 15 phút',d:'Ví dụ giả định có lời giải từng bước',interactive:'practice',
  vis:()=>{ const yrs=['2023','2024','2025'], ni=[100,130,180], cfo=[110,60,-20], Y=v=>78-v*0.28; let g=`<line class="grid-l" x1="14" x2="190" y1="${Y(0)}" y2="${Y(0)}"/>`;

      const top=cfo[i]>=0?Y(cfo[i]):Y(0), h=Math.abs(cfo[i])*0.28; g+=`<rect x="${x+20}" y="${top}" width="18" height="${Math.max(1,h)}" rx="2" style="fill:${cfo[i]>=0?'var(--up)':'var(--dn)'};fill-opacity:.8"/>`+T(x+29,cfo[i]>=0?Y(cfo[i])-3:Y(cfo[i])+9,cfo[i],'text-anchor="middle" style="font-size:7px;font-weight:700"')+T(x+19,107,y,'text-anchor="middle" style="font-size:7px"'); });
    g+=T(100,9,'Công ty giả định Sen Vàng · Vàng: LNST · Xanh/đỏ: CFO','text-anchor="middle" style="font-size:6.4px"')+T(100,120,'Lợi nhuận tăng 80% nhưng tiền âm — vì sao?','text-anchor="middle" '+TB);
    return sv(g,'Ví dụ giả định: lợi nhuận tăng trong khi dòng tiền kinh doanh giảm'); },
  f:'Quy trình 6 bước: Tăng trưởng → Biên lợi nhuận → Dòng tiền → Vốn lưu động → Nợ vay → Kết luận',
  pts:['Bước 1 — Tăng trưởng: doanh thu, lợi nhuận tăng bao nhiêu mỗi năm, có đều không.','Bước 2 — Biên lợi nhuận: biên gộp, biên ròng đang mở rộng hay co lại.','Bước 3 — Dòng tiền: CFO so với LNST.','Bước 4 — Vốn lưu động: phải thu, tồn kho tăng nhanh hơn doanh thu không (tính số ngày thu tiền, số ngày tồn kho).','Bước 5 — Nợ: tiền thiếu được bù bằng vay hay phát hành; nợ vay ÷ vốn chủ thay đổi ra sao.','Bước 6 — Kết luận bằng một câu: tăng trưởng này lành mạnh hay “nóng”. Làm bài thực hành bên dưới, tự trả lời trước khi bấm xem đáp án.'],
  thr:[['Doanh thu và CFO cùng tăng','Tăng trưởng lành mạnh'],['Doanh thu tăng, CFO giảm, nợ tăng','Tăng trưởng “nóng”, cần lời giải thích']],
  hook:'<b>Mẹo nhớ:</b> câu chuyện tăng trưởng nào cũng phải đi qua được bảng lưu chuyển tiền tệ.',src:'Ví dụ giả định do ứng dụng soạn để luyện tập; phương pháp theo CFA Institute, Financial Reporting and Analysis.'},
