  f:'Doanh nghiệp tốt + Giá hợp lý + Biên an toàn + Kế hoạch rõ ràng = Quyết định đầu tư',
  pts:['Bước 1 — Sàng lọc định lượng: dùng bộ lọc La Bàn (thử các bộ trọng số Giá trị, Chất lượng, Cổ tức…) để giữ lại khoảng 100 mã có điểm cao, không cờ đỏ.','Bước 2 — Đọc BCTC 5 năm: tăng trưởng, biên lợi nhuận, dòng tiền, nợ (cấp 4–5). Loại mã có từ 3 cờ đỏ.','Bước 3 — Định tính: ngành có hấp dẫn không, doanh nghiệp có hào kinh tế không, lãnh đạo có đáng tin không.','Bước 4 — Định giá: P/E, P/B so với lịch sử và ngành, DCF, định giá ngược. Chỉ mua khi giá thấp hơn giá trị ước tính một khoảng an toàn (thường 20–30%).','Bước 5 — Viết luận điểm đầu tư, xác định tỷ trọng (thường không quá 10–15% danh mục cho một mã) và điều kiện bán.','Lặp lại mỗi quý khi có BCTC mới — danh sách theo dõi thay đổi theo thời gian.'],
  thr:[['Số mã nên nắm giữ','Khoảng 8–20 mã, hoặc một quỹ chỉ số'],['Tỷ trọng tối đa một mã','10–15% danh mục'],['Biên an toàn','Mua dưới giá trị ước tính 20–30%']],
  hook:'<b>Mẹo nhớ:</b> phễu càng nhiều tầng, càng ít quyết định cảm tính.',src:'Graham & Dodd, Security Analysis (6th ed., 2008); Lynch, One Up on Wall Street (1989); Greenblatt, The Little Book That Still Beats the Market (2010).'},
 {id:'l7-industry',t:'Phân tích ngành: 5 áp lực cạnh tranh',d:'Ngành tốt giúp doanh nghiệp tốt dễ thắng',
  vis:()=>{ let g=AR2; const c=[100,62]; const n=[[100,14,'Đối thủ mới','Rào cản gia nhập?'],[100,110,'Sản phẩm thay thế','Dễ bị thay thế?'],[36,62,'Nhà cung cấp','Họ ép giá được?'],[164,62,'Khách hàng','Họ ép giá được?']];
    n.forEach(([x,y,a,b])=>{ g+=`<line x1="${x}" y1="${y}" x2="${c[0]+(x-c[0])*0.32}" y2="${c[1]+(y-c[1])*0.32}" style="stroke:var(--mut)" marker-end="url(#ar2)"/>`+`<rect x="${x-33}" y="${y-10}" width="66" height="20" rx="5" style="fill:var(--s1);stroke:var(--us)"/>`+T(x,y-1,a,'text-anchor="middle" style="font-size:6.2px;font-weight:800"')+T(x,y+7,b,'text-anchor="middle" style="font-size:5.4px;fill:var(--mut)"'); });
    g+=`<circle cx="100" cy="62" r="24" style="fill:var(--gold);fill-opacity:.9"/>`+T(100,60,'Cạnh tranh','text-anchor="middle" style="font-size:6.2px;font-weight:800;fill:var(--gold-ink)"')+T(100,68,'trong ngành','text-anchor="middle" style="font-size:6.2px;font-weight:800;fill:var(--gold-ink)"');
    return sv(g,'Mô hình năm áp lực cạnh tranh của Porter'); },
  f:'Ngành có lợi nhuận cao bền vững khi cả 5 áp lực đều yếu',
  pts:['Đối thủ mới: ngành cần giấy phép, vốn lớn, mạng lưới (ngân hàng, cảng biển, sân bay) khó bị gia nhập hơn ngành dễ mở (quán cà phê, may mặc).','Sản phẩm thay thế: dịch vụ có thể bị công nghệ khác thay thế làm trần giá bị khống chế.','Nhà cung cấp mạnh (một nguồn nguyên liệu duy nhất) ép biên lợi nhuận; khách hàng mạnh (vài khách lớn chiếm phần lớn doanh thu) ép giá bán.','Cạnh tranh trong ngành: sản phẩm giống nhau, nhiều đối thủ, chi phí cố định cao (thép, phân bón, vận tải) → chiến tranh giá, lợi nhuận theo chu kỳ.','Ngành chu kỳ (thép, hóa chất, vận tải biển, chứng khoán) thường có P/E thấp nhất ở đỉnh lợi nhuận và cao nhất ở đáy — ngược trực giác.','Dùng bản đồ ngành trên trang chủ để so sánh điểm La Bàn bình quân từng ngành.'],
  thr:[['Rào cản gia nhập cao','Lợi nhuận bền hơn'],['Top 3 khách hàng trên 50% doanh thu','Rủi ro tập trung'],['Ngành chu kỳ','Đừng mua vì P/E thấp ở đỉnh chu kỳ']],
  hook:'<b>Mẹo nhớ:</b> một thuyền trưởng giỏi khó thắng nổi con sóng của cả ngành.',src:'Porter (1979), How Competitive Forces Shape Strategy, Harvard Business Review; Porter (2008), The Five Competitive Forces That Shape Strategy, HBR.'},
 {id:'l7-mgmt',t:'Ban lãnh đạo, cổ đông và quản trị',d:'Họ có ngồi cùng thuyền với bạn không',
  vis:()=>{ const it=[['Lãnh đạo sở hữu nhiều cổ phần','y'],['Kế hoạch ĐHĐCĐ thường đạt','y'],['Cổ tức tiền đều đặn','y'],['Phát hành, pha loãng liên tục','n'],['Cổ phiếu lãnh đạo bị cầm cố','n'],['Giao dịch lớn với công ty người nhà','n']];
    let g=''; it.forEach(([t,k],i)=>{ const y=12+i*17; g+=`<rect x="10" y="${y-9}" width="180" height="14" rx="4" style="fill:var(--s1);stroke:var(--line)"/><circle cx="20" cy="${y-2}" r="5" style="fill:${k==='y'?'var(--up)':'var(--dn)'}"/>`+T(20,y+1,k==='y'?'✓':'✗','text-anchor="middle" style="font-size:7px;font-weight:800;fill:var(--bg)"')+T(30,y+1,t,'style="font-size:7.2px"'); });
    g+=T(100,118,'Xanh: dấu hiệu tốt · Đỏ: dấu hiệu cần cảnh giác','text-anchor="middle" '+TS);
    return sv(g,'Danh sách kiểm tra quản trị doanh nghiệp'); },
  f:'Quản trị tốt = Lợi ích lãnh đạo gắn với cổ đông + Phân bổ vốn hợp lý + Minh bạch thông tin',
  pts:['Đọc báo cáo thường niên và thư của chủ tịch/CEO qua nhiều năm: họ có nói thật về khó khăn, có làm đúng điều đã hứa không.','So sánh kế hoạch lợi nhuận đại hội cổ đông với kết quả thực hiện 3–5 năm.','Phân bổ vốn: tiền lãi được dùng để mở rộng hiệu quả (ROIC cao), trả cổ tức, hay đổ vào dự án ngoài ngành, cho bên liên quan vay.','Theo dõi giao dịch của cổ đông nội bộ (bắt buộc công bố): lãnh đạo mua vào thường là tín hiệu tốt hơn bán ra.','Cổ phiếu lãnh đạo cầm cố vay ký quỹ có thể bị bán giải chấp hàng loạt khi thị trường giảm — đã xảy ra nhiều lần ở Việt Nam.','Phát hành ESOP quá nhiều, thù lao lãnh đạo tăng khi lợi nhuận giảm là dấu hiệu lợi ích không đồng hướng.'],
  thr:[['Lãnh đạo sở hữu trên 5–10%','Cùng thuyền với cổ đông'],['ESOP trên 1–2% mỗi năm','Pha loãng đáng kể'],['Đạt kế hoạch 4/5 năm','Lãnh đạo đáng tin về dự báo']],
  hook:'<b>Mẹo nhớ:</b> đầu tư vào doanh nghiệp là thuê ban lãnh đạo quản lý tiền của bạn — hãy phỏng vấn họ qua những gì họ đã làm.',src:'Nghị định 155/2020/NĐ-CP (quản trị công ty đại chúng); G20/OECD Principles of Corporate Governance (2023).'},
 {id:'l7-sector',t:'Đọc BCTC theo ngành',d:'Mỗi ngành có chỉ số riêng',
  vis:()=>{ const c=[['Ngân hàng','var(--us)',['NIM, nợ xấu','CASA, CAR']],['Bất động sản','var(--gold)',['Người mua trả trước','Tồn kho, quỹ đất']],['Bán lẻ','var(--up)',['Doanh thu/cửa hàng','Vòng quay tồn kho']],['Sản xuất','var(--dn)',['Biên gộp, công suất','Giá đầu vào, capex']],['Chứng khoán','var(--vn)',['Dư nợ margin','Tự doanh, thị phần']],['Tiện ích, điện','var(--mut)',['Sản lượng, giá bán','Nợ dự án, khấu hao']]];
    let g=''; c.forEach(([n,col,l],i)=>{ const x=4+(i%3)*65, y=6+Math.floor(i/3)*58; g+=`<rect x="${x}" y="${y}" width="62" height="52" rx="7" style="fill:var(--s1);stroke:${col}"/>`+T(x+31,y+14,n,`text-anchor="middle" style="font-size:7.4px;font-weight:800;fill:${col}"`)+l.map((t,k)=>T(x+31,y+28+k*10,t,'text-anchor="middle" style="font-size:5.4px"')).join(''); });
    return sv(g,'Các chỉ số đặc thù theo ngành'); },
  f:'So sánh doanh nghiệp với đối thủ cùng ngành, dùng chỉ số đặc thù của ngành đó',
  pts:['Ngân hàng: không dùng biên gộp, nợ/vốn. Xem NIM (biên lãi thuần), tỷ lệ nợ xấu và nợ nhóm 2, CASA (tiền gửi không kỳ hạn), CAR (hệ số an toàn vốn), chi phí tín dụng, P/B.','Bất động sản: “người mua trả tiền trước” là doanh thu tương lai; hàng tồn kho là dự án; quỹ đất sạch, pháp lý dự án và nợ vay đến hạn quyết định rủi ro. Lợi nhuận theo đợt bàn giao nên rất thất thường.','Bán lẻ: tăng trưởng doanh thu trên mỗi cửa hàng cũ (same-store sales), vòng quay tồn kho, chi phí thuê trên doanh thu.','Sản xuất hàng hóa (thép, phân bón, hóa chất): biên gộp phụ thuộc giá nguyên liệu và giá bán thế giới; định giá theo chu kỳ.','Chứng khoán: dư nợ cho vay margin, danh mục tự doanh (lãi lỗ theo thị trường), thị phần môi giới.','Bảo hiểm, ngân hàng thường có Altman Z và Piotroski kém ý nghĩa — La Bàn đã tách ngân hàng ra so với ngân hàng.'],
  thr:[['Ngân hàng: nợ xấu dưới 1,5%','Chất lượng tài sản tốt'],['BĐS: người mua trả trước tăng','Doanh thu tương lai được bảo đảm'],['Bán lẻ: vòng quay tồn kho giảm','Hàng chậm bán']],
  hook:'<b>Mẹo nhớ:</b> đừng dùng thước đo của tiệm phở để đo ngân hàng.',src:'Thông tư 41/2016/TT-NHNN (tỷ lệ an toàn vốn); Damodaran, The Dark Side of Valuation (2018).'},
 {id:'l7-styles',t:'Bốn phong cách chọn cổ phiếu',d:'Giá trị, tăng trưởng giá hợp lý, tăng trưởng, cổ tức',act:'styles',
  vis:()=>{ let g=`<line class="axis" x1="22" x2="190" y1="108" y2="108"/><line class="axis" x1="22" x2="22" y1="10" y2="108"/><line x1="106" x2="106" y1="10" y2="108" style="stroke:var(--line2)" stroke-dasharray="3 3"/><line x1="22" x2="190" y1="59" y2="59" style="stroke:var(--line2)" stroke-dasharray="3 3"/>`;
    const q=[[64,32,'GARP','tăng nhanh, giá hợp lý','var(--gold)'],[148,32,'Tăng trưởng','tăng nhanh, giá cao','var(--up)'],[64,82,'Giá trị · Cổ tức','rẻ, tăng chậm','var(--us)'],[148,82,'Cẩn thận','đắt mà tăng chậm','var(--dn)']];
    q.forEach(([x,y,a,b,c])=>{ g+=T(x,y,a,`text-anchor="middle" style="font-size:8.5px;font-weight:800;fill:${c}"`)+T(x,y+10,b,'text-anchor="middle" style="font-size:6px"'); });
    g+=T(106,121,'Định giá: rẻ ← → đắt','text-anchor="middle" '+TS)+`<text transform="translate(12 60) rotate(-90)" text-anchor="middle" style="font-size:6.5px">Tăng trưởng →</text>`;
    return sv(g,'Bản đồ bốn phong cách chọn cổ phiếu theo định giá và tăng trưởng'); },
  f:'Chọn một phong cách hợp tính cách, áp dụng nhất quán — đổi phong cách theo phong trào là cách thua nhanh nhất',
  pts:['Giá trị (Graham): mua doanh nghiệp đang rẻ so với tài sản, lợi nhuận: P/E thấp, P/B thấp, bảng cân đối an toàn. Rủi ro: “bẫy giá trị” — rẻ vì đang suy yếu.','GARP (Lynch): tăng trưởng với giá hợp lý, PEG dưới 1. Cân bằng giữa hai trường phái.','Tăng trưởng (Fisher, O’Neil): doanh thu, EPS tăng nhanh, ROE cao; chấp nhận P/E cao. Rủi ro: giá giảm mạnh khi tăng trưởng chậm lại.','Cổ tức: dòng tiền đều, tỷ suất cao, chi trả bền vững — hợp với tích sản và người cần thu nhập.','Chất lượng (Buffett): ROIC cao bền vững, ít nợ, hào kinh tế — kết hợp được với cả bốn phong cách.','Bấm các nút bên dưới để áp dụng bộ trọng số tương ứng trong bộ lọc La Bàn.'],
  thr:[['Giá trị','P/E dưới 12, P/B dưới 1,5, F-Score từ 6'],['Tăng trưởng','EPS 3 năm trên 20%/năm, ROE trên 18%'],['Cổ tức','Tỷ suất trên 4%, chi trả dưới 70%, FCF lớn hơn cổ tức'],['Chất lượng','ROIC trên 15%, nợ ÷ vốn dưới 0,5']],
  hook:'<b>Mẹo nhớ:</b> phong cách nào cũng có năm thắng năm thua — kỷ luật mới là lợi thế.',src:'Graham, The Intelligent Investor (1973); Lynch, One Up on Wall Street (1989); Fama & French (1992), The Cross-Section of Expected Stock Returns, Journal of Finance 47(2).'},
 {id:'l7-thesis',t:'Luận điểm đầu tư và khi nào bán',d:'Viết ra trước khi mua',
  vis:()=>{ const r=[['Tôi mua vì…','3 lý do có số liệu'],['Giá trị hợp lý…','và biên an toàn'],['Tôi sai nếu…','điều kiện đo được'],['Tôi bán khi…','luận điểm sai, giá quá cao'],['Tỷ trọng…','tối đa bao nhiêu %']];
    let g=`<rect x="22" y="6" width="156" height="112" rx="8" style="fill:var(--s1);stroke:var(--gold)"/>`+T(100,18,'PHIẾU LUẬN ĐIỂM ĐẦU TƯ','text-anchor="middle" style="font-size:7.5px;font-weight:800;fill:var(--gold)"');
    r.forEach(([a,b],i)=>{ const y=34+i*17; g+=T(30,y,a,'style="font-size:7px;font-weight:800"')+T(170,y,b,'text-anchor="end" style="font-size:6px;fill:var(--mut)"')+`<line x1="30" x2="170" y1="${y+4}" y2="${y+4}" style="stroke:var(--line2)" stroke-dasharray="2 2"/>`; });
    return sv(g,'Mẫu phiếu luận điểm đầu tư'); },
  f:'Bán khi: luận điểm sai · giá vượt xa giá trị · có cơ hội tốt hơn rõ rệt · cần tiền theo kế hoạch — không bán chỉ vì giá giảm',
  pts:['Viết luận điểm trong 5 dòng trước khi mua: vì sao doanh nghiệp tốt, vì sao giá hấp dẫn, chất xúc tác, rủi ro chính, điều kiện bán.','“Tôi sai nếu…” phải đo được: ví dụ “biên gộp giảm dưới 20% hai quý liên tiếp” hoặc “dự án X chậm quá 12 tháng”.','Giá giảm không phải lý do bán nếu luận điểm còn đúng — có khi là cơ hội mua thêm. Giá tăng mạnh cũng không phải lý do bán nếu giá trị doanh nghiệp tăng theo.','Cắt lỗ theo phần trăm (ví dụ −8%) phù hợp với giao dịch ngắn hạn theo kỹ thuật; nhà đầu tư dài hạn cắt lỗ khi luận điểm gãy.','Xem lại luận điểm mỗi khi có BCTC quý. Ghi nhật ký: quyết định đúng sai vì lý do gì — đây là cách học nhanh nhất.'],
  thr:[['Luận điểm còn đúng, giá giảm','Giữ hoặc mua thêm theo tỷ trọng kế hoạch'],['Luận điểm gãy','Bán, kể cả khi đang lỗ'],['Giá vượt giá trị hợp lý 30%+','Cân nhắc chốt một phần']],
  hook:'<b>Mẹo nhớ:</b> nếu không viết được lý do mua trong 5 dòng, bạn chưa hiểu doanh nghiệp đủ để mua.',src:'Fisher, Common Stocks and Uncommon Profits (1958); Lynch, One Up on Wall Street (1989); Marks, The Most Important Thing (2011).'},
 /* ---------- cấp 8: tích sản ---------- */
 {id:'l8-plan',t:'Kế hoạch tích sản',d:'Góp đều + lãi kép + thời gian',interactive:'fv',

  f:'Giá trị tương lai = Góp mỗi tháng × [(1 + r)ⁿ − 1] ÷ r  (r: lợi nhuận mỗi tháng, n: số tháng)',
  pts:['Tích sản là tích lũy tài sản sinh lời đều đặn trong nhiều năm, không phải tìm một cổ phiếu tăng gấp 10 lần.','Ba đòn bẩy: số tiền góp (tỷ lệ tiết kiệm), lợi nhuận, và thời gian — thời gian là đòn bẩy mạnh nhất vì lãi kép.','Thứ tự ưu tiên: quỹ khẩn cấp 3–6 tháng chi tiêu → trả hết nợ lãi cao (thẻ tín dụng, vay tiêu dùng) → góp định kỳ vào danh mục.','Tự động hóa: chuyển tiền ngay ngày nhận lương; tăng khoản góp mỗi khi thu nhập tăng; tái đầu tư toàn bộ cổ tức.','Đừng ngắt quãng: rút tiền giữa chừng hoặc ngừng góp khi thị trường giảm là cách phá lãi kép hiệu quả nhất.','Dùng máy tính bên dưới để thử số tiền, thời gian và lợi nhuận của bạn; kết quả có cả giá trị quy về tiền hôm nay (đã trừ lạm phát).'],
  thr:[['Tỷ lệ tiết kiệm','Từ 20% thu nhập trở lên'],['Lợi nhuận giả định thận trọng','6–8%/năm cho danh mục cân bằng'],['Xem lại kế hoạch','Mỗi năm một lần, không phải mỗi ngày']],
  hook:'<b>Mẹo nhớ:</b> người thắng trong tích sản không phải người chọn mã giỏi nhất, mà người không bỏ cuộc lâu nhất.',src:'Công thức giá trị tương lai của chuỗi tiền đều (annuity); Bogle, The Little Book of Common Sense Investing (2017).'},
 {id:'l8-alloc',t:'Phân bổ tài sản',d:'Quyết định quan trọng nhất của danh mục',
  vis:()=>{ const P=[['Thận trọng',[30,50,10,10]],['Cân bằng',[60,30,5,5]],['Tăng trưởng',[85,10,5,0]]], C=['var(--up)','var(--us)','var(--mut)','var(--gold)']; let g='';

  f:'Quy tắc ngón tay cái: % cổ phiếu ≈ 110 − tuổi, rồi điều chỉnh theo khẩu vị rủi ro và mục tiêu',
  pts:['Phân bổ tài sản là chia tiền giữa các nhóm: cổ phiếu, trái phiếu/tiền gửi, tiền mặt, vàng, bất động sản. Nghiên cứu kinh điển cho thấy phần lớn mức biến động của danh mục đến từ quyết định này, không phải từ việc chọn mã.','Cổ phiếu: động cơ tăng trưởng. Trái phiếu, tiền gửi: giảm biến động, có tiền mua khi thị trường giảm. Vàng: phòng hộ khủng hoảng, lạm phát. Tiền mặt: thanh khoản.','Đa dạng hóa theo địa lý: kết hợp cổ phiếu Việt Nam và quốc tế giúp không phụ thuộc một nền kinh tế.','Bất động sản thường chiếm phần lớn tài sản của người Việt — tính cả nó khi quyết định tỷ trọng cổ phiếu.','Tỷ trọng cổ phiếu giảm dần khi gần đến ngày cần tiền (ví dụ nghỉ hưu, mua nhà) — gọi là đường trượt (glide path).'],
  thr:[['30 tuổi, chưa cần tiền 20 năm','70–90% cổ phiếu'],['50 tuổi','50–60% cổ phiếu'],['Cần tiền trong 3 năm','Dưới 30% cổ phiếu cho khoản đó']],
  hook:'<b>Mẹo nhớ:</b> chọn đúng giỏ quan trọng hơn chọn đúng quả trứng.',src:'Brinson, Hood & Beebower (1986), Determinants of Portfolio Performance, Financial Analysts Journal 42(4); Vanguard Research, The global case for strategic asset allocation (2023).'},
 {id:'l8-rebal',t:'Tái cân bằng danh mục',d:'Bán cao, mua thấp một cách kỷ luật',

  f:'Tái cân bằng khi tỷ trọng lệch quá ±5 điểm % so với mục tiêu, hoặc định kỳ mỗi năm một lần',
  pts:['Khi cổ phiếu tăng mạnh, tỷ trọng cổ phiếu vượt mục tiêu → danh mục rủi ro hơn bạn định. Tái cân bằng là bán bớt phần đã tăng, mua phần đã giảm.','Đây là cách “mua thấp bán cao” có kỷ luật, không cần dự đoán thị trường.','Cách rẻ nhất: dùng tiền góp mới và cổ tức để mua phần đang thiếu thay vì bán (tránh thuế, phí).','Định kỳ (mỗi năm) hoặc theo ngưỡng (lệch ±5 điểm %) đều hiệu quả; tái cân bằng quá thường xuyên chỉ tốn phí.','Áp dụng cả bên trong danh mục cổ phiếu: một mã tăng lên chiếm quá 15–20% danh mục thì cân nhắc giảm.'],
  thr:[['Lệch dưới 5 điểm %','Để yên'],['Lệch trên 5 điểm %','Tái cân bằng'],['Một mã vượt 20% danh mục','Rủi ro tập trung — cân nhắc giảm']],
  hook:'<b>Mẹo nhớ:</b> tái cân bằng là kỷ luật bán lúc mọi người tham và mua lúc mọi người sợ — nhưng theo lịch, không theo cảm xúc.',src:'Vanguard Research, Best practices for portfolio rebalancing (2022 update); Swensen, Unconventional Success (2005).'},
 {id:'l8-dividend',t:'Tích sản bằng cổ tức',d:'Tái đầu tư cổ tức và lợi suất trên giá vốn',
  vis:()=>{ let g=''; const yrs=[0,2,4,6,8,10]; yrs.forEach((y,i)=>{ const sh=1000*Math.pow(1.06,y), x=14+i*31, h=sh/1800*62; g+=`<rect x="${x}" y="${94-h}" width="22" height="${h}" rx="2" style="fill:var(--gold);fill-opacity:${.45+i*.1}"/>`+T(x+11,90-h,Math.round(sh),'text-anchor="middle" style="font-size:6.8px;font-weight:700"')+T(x+11,103,'năm '+y,'text-anchor="middle" style="font-size:6px"'); });

  f:'Lợi suất trên giá vốn = Cổ tức mỗi cổ phiếu hiện tại ÷ Giá mua ban đầu · Tổng lợi nhuận = Tăng giá + Cổ tức',
  pts:['Tái đầu tư cổ tức (mua thêm cổ phiếu bằng tiền cổ tức) làm số cổ phiếu tự tăng — cộng hưởng với việc doanh nghiệp tăng cổ tức theo thời gian.','Về dài hạn, cổ tức tái đầu tư đóng góp một phần rất lớn vào tổng lợi nhuận của thị trường chứng khoán Mỹ.','Lợi suất trên giá vốn: mua giá 20.000, cổ tức hiện tại 2.000 → 10% trên vốn ban đầu, dù tỷ suất trên giá thị trường chỉ 4%.','Chọn cổ phiếu cổ tức bền: tỷ lệ chi trả dưới 70%, FCF lớn hơn cổ tức, nợ thấp, lịch sử trả đều. Tránh “bẫy cổ tức”: tỷ suất rất cao vì giá đã sập.','Ở Việt Nam, cổ tức tiền mặt bị khấu trừ thuế 5%; cổ tức bằng cổ phiếu không làm bạn giàu hơn ngay lúc chia (giá điều chỉnh tương ứng).'],
  thr:[['Tỷ suất cổ tức 3–6%','Vùng bền vững thường gặp'],['Trên 10%','Kiểm tra: có thể là bẫy cổ tức'],['Tăng cổ tức nhiều năm liền','Dấu hiệu doanh nghiệp chất lượng']],
  hook:'<b>Mẹo nhớ:</b> cổ tức là những “con gà đẻ trứng” — đừng ăn trứng khi đang tích sản, hãy ấp thêm gà.',src:'Siegel, Stocks for the Long Run (6th ed., 2022); S&P Dow Jones Indices, dividend contribution research.'},
 {id:'l8-fire',t:'Tự do tài chính và quy tắc 4%',d:'Cần bao nhiêu tài sản để sống bằng tài sản',
  vis:()=>{ let g=AR2; g+=`<rect x="12" y="34" width="56" height="40" rx="7" style="fill:var(--s1);stroke:var(--us)"/>`+T(40,48,'Chi tiêu/năm','text-anchor="middle" style="font-size:7px;font-weight:800;fill:var(--us)"')+T(40,62,'300 triệu','text-anchor="middle" style="font-size:9px;font-weight:800"');

  f:'Tài sản mục tiêu ≈ Chi tiêu một năm × 25  (tương ứng rút 4% năm đầu, sau đó tăng theo lạm phát)',
  pts:['Nghiên cứu của Bengen (1994) và “Trinity Study” (1998) trên dữ liệu Mỹ: rút 4% tài sản năm đầu, sau đó điều chỉnh theo lạm phát, danh mục cân bằng cổ phiếu – trái phiếu hầu như đủ dùng 30 năm.','Muốn sống bằng tài sản lâu hơn 30 năm, hoặc thị trường biến động mạnh hơn, nên dùng mức rút thận trọng 3–3,5%.','Ví dụ: chi tiêu 300 triệu/năm → cần khoảng 7,5 tỷ (4%) đến 10 tỷ (3%).','Ghép với bài Kế hoạch tích sản: biết đích đến rồi tính ngược số tiền cần góp mỗi tháng và số năm.','Nguồn thu khác (lương hưu, cho thuê, kinh doanh) làm giảm số tài sản cần có.','Đây là quy tắc kinh nghiệm dựa trên lịch sử Mỹ, không bảo đảm cho tương lai hay cho thị trường Việt Nam.'],
  thr:[['Rút 4%','Tài sản = 25 × chi tiêu'],['Rút 3,5%','≈ 29 × chi tiêu'],['Rút 3%','≈ 33 × chi tiêu']],
  hook:'<b>Mẹo nhớ:</b> tự do tài chính bắt đầu từ việc biết mình tiêu bao nhiêu mỗi năm.',src:'Bengen (1994), Determining Withdrawal Rates Using Historical Data, Journal of Financial Planning; Cooley, Hubbard & Walz (1998), Retirement Savings: Choosing a Withdrawal Rate That Is Sustainable, AAII Journal.'}

  pts:['Sàn chứng khoán là “chợ” có tổ chức. Bạn không mua trực tiếp từ công ty mà mua của nhà đầu tư khác, qua công ty chứng khoán làm môi giới.','Mọi lệnh được xếp vào sổ lệnh: ưu tiên giá tốt hơn trước, cùng giá thì ai đặt trước khớp trước.','Tin tốt (lợi nhuận tăng, hợp đồng lớn) làm nhiều người muốn mua → giá lên; tin xấu ngược lại. Giá hôm nay phản ánh kỳ vọng tương lai, không phải chỉ kết quả quá khứ.','Thanh khoản là mức dễ mua bán: cổ phiếu khớp hàng triệu đơn vị mỗi ngày dễ thoát hơn cổ phiếu chỉ khớp vài nghìn.','Vốn hóa = giá × số cổ phiếu lưu hành — thước đo “công ty to cỡ nào” trong mắt thị trường.'],

  pts:['Không có kênh nào vừa lãi cao vừa không rủi ro. Cổ phiếu có lợi nhuận dài hạn cao nhất trong các kênh phổ biến chính vì giá dao động mạnh.','Cổ phiếu Mỹ (S&P 500, gồm cổ tức) bình quân khoảng 10%/năm từ 1928, nhưng có năm giảm 37% (2008) và có năm tăng 38%.','VN-Index biến động còn mạnh hơn: tăng khoảng 144% năm 2006, giảm khoảng 66% năm 2008.','Thời gian nắm giữ càng dài, xác suất lỗ càng giảm: lịch sử S&P 500 cho thấy khoảng 3/4 số năm có lãi, và nắm giữ từ 20 năm trở lên (tính cả cổ tức) chưa từng lỗ danh nghĩa. Quá khứ không bảo đảm tương lai.','Tiền cần dùng trong 1–2 năm tới không nên bỏ vào cổ phiếu.'],

  f:'Tiền cần có = Giá × Số lượng + Phí môi giới (khoảng 0,1–0,35% ở Việt Nam)',
  pts:['Mở tài khoản tại một công ty chứng khoán được cấp phép. Phần lớn làm trực tuyến bằng căn cước công dân (eKYC) trong vài phút.','Nạp tiền vào tài khoản chứng khoán (tiền vẫn đứng tên bạn, gửi tại ngân hàng lưu ký).','Đặt lệnh: chọn mã, giá, số lượng. Người mới nên dùng lệnh giới hạn (LO) để biết chắc giá tối đa mình trả.','Việt Nam thanh toán T+2: cổ phiếu mua hôm nay về tài khoản sau 2 ngày làm việc. Mỹ là T+1.','Nhà đầu tư Việt Nam muốn mua cổ phiếu Mỹ cần tài khoản ở công ty môi giới quốc tế; ở Mỹ có thể mua từ 1 cổ phiếu, thậm chí phần lẻ cổ phiếu.','Ghi nhật ký: vì sao mua, mục tiêu, điểm cắt lỗ. Đây là thói quen phân biệt nhà đầu tư với người đánh bạc.'],
  thr:[['HOSE','Lô 100 cổ phiếu, lô lẻ 1–99 cổ phiếu'],['Thuế khi bán (VN)','0,1% giá trị bán'],['Phí môi giới (VN)','Khoảng 0,1–0,35% mỗi chiều']],

  pts:['TC (tham chiếu) là giá đóng cửa phiên trước. Trần = TC + 7%, Sàn = TC − 7% trên HOSE (HNX ±10%, UPCoM ±15%), làm tròn theo bước giá.','“Giá mua 1, 2, 3” và khối lượng đi kèm là ba mức giá tốt nhất người mua đang chờ; “Giá bán 1, 2, 3” là ba mức người bán đang chờ.','Cột Khớp lệnh cho biết giá và khối lượng vừa giao dịch; Tổng khối lượng là lượng đã khớp từ đầu phiên.','Cột NN mua/bán cho biết khối ngoại đang mua hay bán ròng — nhiều người theo dõi như tín hiệu dòng tiền lớn.','Màu chỉ cho biết giá so với tham chiếu, không cho biết cổ phiếu tốt hay xấu.'],

  pts:['LO (giới hạn): bạn đặt giá tối đa muốn mua hoặc tối thiểu muốn bán. Không khớp thì lệnh chờ đến hết phiên.','ATO/ATC: tham gia phiên khớp định kỳ mở cửa (9:00–9:15) hoặc đóng cửa (14:30–14:45), được ưu tiên trước lệnh LO, khớp tại một giá chung.','MP (lệnh thị trường, HOSE): khớp ngay với giá tốt nhất đang có; dễ bị khớp xấu khi thanh khoản mỏng.','Ở Mỹ: market (thị trường), limit (giới hạn), stop (kích hoạt khi chạm giá — thường dùng cắt lỗ), stop-limit, và hiệu lực DAY hoặc GTC (đến khi hủy).','Lệnh dừng giúp tự động cắt lỗ nhưng có thể khớp xa giá đặt khi thị trường biến động mạnh.'],

/* ---------- tiến độ ---------- */
function lvState(i){
  const L=LEVELS[i]; const done=L.ids.filter(id=>S.learned.includes(id)).length;
  const passed=(store.lvPass||{})[i+1]; const qn=QUIZ.filter(q=>q.lv===i+1).length;
  return {done,tot:L.ids.length,passed:!!passed,best:passed||0,qn,complete:!!passed||done===L.ids.length};
}
function currentLevel(){ for(let i=0;i<LEVELS.length;i++){ if(!lvState(i).complete) return i+1; } return 10; }

/* ---------- infographic bậc thang 10 cấp ---------- */
function ladderSVG(cur,open){
  const W=360,H=168,p=8, sw=(W-2*p)/10; let g='';
  const tiers=[['Người mới',0,3],['Trung cấp',3,6],['Nâng cao',6,9],['Chuyên gia',9,10]];
  tiers.forEach(([t,a,b])=>{ g+=`<rect x="${p+a*sw+1}" y="146" width="${(b-a)*sw-2}" height="4" rx="2" style="fill:${TIER_COL[t]}"/><text x="${p+(a+b)/2*sw}" y="162" text-anchor="middle" style="font-size:9.5px;font-weight:700;fill:${TIER_COL[t]}">${t}</text>`; });
  for(let i=0;i<10;i++){
    const st=lvState(i), h=22+i*10.5, x=p+i*sw, y=140-h;
    const isCur=i+1===cur, isOpen=i+1===open;
    const fill= st.complete?'var(--gold)':'var(--s1)';
    g+=`<g data-lv="${i+1}" style="cursor:pointer" role="button" aria-label="Cấp ${i+1}: ${esc(LEVELS[i].n)}${st.complete?', đã hoàn thành':''}">`;
    g+=`<rect x="${x+2}" y="${y}" width="${sw-4}" height="${h}" rx="5" style="fill:${fill};stroke:${isOpen?'var(--fg)':isCur?'var(--gold)':'var(--line2)'}" stroke-width="${isOpen||isCur?2:1}"/>`;
    const pr=st.tot?st.done/st.tot:0; if(!st.complete&&pr>0) g+=`<rect x="${x+4}" y="${y+h-4-(h-8)*pr}" width="${sw-8}" height="${(h-8)*pr}" rx="3" style="fill:var(--gold);fill-opacity:.35"/>`;
    g+=`<text x="${x+sw/2}" y="${y+16}" text-anchor="middle" style="font-family:var(--f-disp);font-size:13px;font-weight:800;fill:${st.complete?'var(--gold-ink)':'var(--fg)'}">${i+1}</text>`;
    if(st.passed) g+=`<text x="${x+sw/2}" y="${y+28}" text-anchor="middle" style="font-size:9px;fill:var(--gold-ink)">✓</text>`;
    if(isCur) g+=`<g transform="translate(${x+sw/2} ${y-6})"><line x1="0" y1="0" x2="0" y2="-16" style="stroke:var(--fg)" stroke-width="1.4"/><path d="M0 -16 L12 -12 L0 -8z" style="fill:var(--dn)"/></g>`;
    g+='</g>';
  }
  return `<svg class="chart ladder" viewBox="0 0 ${W} ${H}" role="img" aria-label="Lộ trình 10 cấp độ, bạn đang ở cấp ${cur}">${g}</svg>`;
}
function lcardHTML(l){ return `<button class="lcard" data-lesson="${l.id}"><span class="th">${l.vis()}${S.learned.includes(l.id)?'<span class="done" aria-label="Đã học"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></span>':''}</span><span class="tx"><b>${esc(l.t)}</b><span>${esc(l.d)}</span></span></button>`; }

RENDER.learn=function(){
  const el=$('#v-learn'); const cur=currentLevel(); if(!S.lvOpen) S.lvOpen=cur;
  const open=S.lvOpen, L=LEVELS[open-1], st=lvState(open-1);
  const doneAll=S.learned.filter(id=>LESSONS.some(l=>l.id===id)).length;
  const leit=store.leit||{}; const boxes=[0,0,0,0,0]; QUIZ.forEach((_,i)=>{ boxes[clamp((leit[i]||1)-1,0,4)]++; });
  const lessons=L.ids.map(id=>LESSONS.find(l=>l.id===id)).filter(Boolean);
  el.innerHTML=`<div class="sec-h" style="margin:0"><div><h2>Học thuật đầu tư</h2><p>10 cấp độ · ${LESSONS.length} bài có infographic · ${QUIZ.length} câu hỏi · cấp 1 cho người chưa biết gì</p></div></div>
  <section class="panel lv-hero">
    <div class="lv-hero-top"><div><span class="mut" style="font-size:12px;letter-spacing:.06em;text-transform:uppercase">Bạn đang ở</span><b>Cấp ${cur} · ${esc(LEVELS[cur-1].n)}</b><span class="note">${doneAll}/${LESSONS.length} bài đã học · ${Object.keys(store.lvPass||{}).length}/10 bài kiểm tra cấp đã vượt</span></div>
      <button class="btn pri" data-lvgo="${cur}">${S.lvOpen===cur?'Học tiếp':'Về cấp '+cur}</button></div>
    ${ladderSVG(cur,open)}
    <p class="note">Chạm một bậc để mở cấp đó. Bậc tô vàng: đã học hết bài hoặc vượt bài kiểm tra cấp (đạt 4/5). Lá cờ: cấp nên học tiếp.</p>
  </section>
  <section class="panel lv-detail" id="lvDetail" aria-labelledby="lvTitle">
    <div class="lv-head"><span class="lv-num" style="background:${TIER_COL[L.tier]}">${open}</span><div><span class="mut" style="font-size:12px;font-weight:700;color:${TIER_COL[L.tier]}">${esc(L.tier.toUpperCase())}</span><h2 id="lvTitle">${esc(L.n)}</h2><p class="note" style="margin:0">${esc(L.d)}</p></div></div>
    <div class="lv-goal"><b>Sau cấp này bạn sẽ</b><ul>${L.goal.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="lv-prog"><div class="progress"><i style="width:${st.tot?st.done/st.tot*100:0}%"></i></div><span>${st.done}/${st.tot} bài${st.passed?` · đã vượt kiểm tra (${st.best}/5)`:''}</span></div>
    <div class="learn-grid">${lessons.map(lcardHTML).join('')}</div>
    ${L.extra==='cdl'?'<div class="row-btns" style="margin-top:12px"><button class="btn" data-lesson="cdl-library">Thư viện 34 mẫu nến Nhật</button><button class="btn" id="goCpat">15 mô hình giá kinh điển</button></div>':''}
    <div class="row-btns" style="margin-top:14px">
      <button class="btn pri" id="lvQuiz"${st.qn<3?' disabled':''}>Kiểm tra cấp ${open} · 5 câu</button>
      ${open>1?`<button class="btn" data-lvgo="${open-1}">← Cấp ${open-1}</button>`:''}${open<10?`<button class="btn" data-lvgo="${open+1}">Cấp ${open+1} →</button>`:''}
    </div>
  </section>
  <section><div class="sec-h"><h2 style="font-size:18px">Tất cả 10 cấp</h2></div>
    <div class="lv-list">${LEVELS.map((x,i)=>{ const s=lvState(i); return `<button class="lv-row${i+1===open?' on':''}" data-lvgo="${i+1}"><span class="lv-num sm" style="background:${s.complete?'var(--gold)':TIER_COL[x.tier]};${s.complete?'color:var(--gold-ink)':''}">${s.complete?'✓':i+1}</span><span class="lv-txt"><b>${esc(x.n)}</b><span>${esc(x.d)}</span></span><span class="lv-meta"><i style="--p:${s.tot?s.done/s.tot*100:0}%"></i>${s.done}/${s.tot}</span></button>`; }).join('')}</div>
  </section>
  <section class="panel" style="display:flex;flex-direction:column;gap:12px">
    <div class="sec-h" style="margin:0"><div><h2 style="font-size:17px">Ôn tập ngắt quãng</h2><p>Trộn câu hỏi mọi cấp đã mở · kỷ lục ${S.quizBest}/8</p></div><button class="btn sm" id="startQuiz">Ôn 8 câu</button></div>
    <div style="display:flex;gap:4px;align-items:flex-end;height:34px" aria-label="Phân bố hộp Leitner">${boxes.map((n,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><i style="display:block;width:18px;height:${4+Math.min(26,n*.6)}px;border-radius:3px;background:var(--gold);opacity:${.35+i*.16}"></i><span style="font-size:10px" class="mut">${i+1}</span></div>`).join('')}<p class="note" style="margin-left:10px">Hộp Leitner: trả lời đúng, câu hỏi lên hộp cao và ít xuất hiện lại; sai thì về hộp 1.</p></div>
  </section>
  <div class="sec-h" style="margin:4px 0 0"><div><h2 style="font-size:18px">Thư viện tra cứu</h2><p>Mẫu nến và mô hình giá cho cấp 9, xem bất cứ lúc nào</p></div></div>`;
  $$('[data-lvgo]',el).forEach(b=>b.onclick=()=>{ S.lvOpen=+b.dataset.lvgo; RENDER.learn(); const d=$('#lvDetail'); if(d) d.scrollIntoView({block:'start',behavior:REDUCED()?'auto':'smooth'}); });
  $$('.ladder [data-lv]',el).forEach(g=>g.addEventListener('click',()=>{ S.lvOpen=+g.dataset.lv; RENDER.learn(); }));
  $('#lvQuiz').onclick=()=>startLevelQuiz(open);
  $('#startQuiz').onclick=startQuiz;
  const gc=$('#goCpat'); if(gc) gc.onclick=()=>{ const c=$('#cpatLib'); if(c) c.scrollIntoView({block:'start'}); };
  appendLibs();
  if(HAS_GSAP()&&!REDUCED()){ gsap.from('.ladder [data-lv] rect',{scaleY:0,transformOrigin:'50% 100%',duration:.6,stagger:.04,ease:'power2.out'}); }
};
/* ôn tập chung chỉ lấy câu của các cấp đã mở (≤ cấp hiện tại + 1) */
const _pickBase=pickQuestions;
pickQuestions=function(n){ const cap=Math.min(10,currentLevel()+1); const pool=QUIZ.map((q,i)=>i).filter(i=>(QUIZ[i].lv||10)<=cap); if(pool.length<n) return _pickBase(n);
  const leit=store.leit||{}; const w=pool.map(i=>({i,r:Math.random()/(leit[i]||1)})); w.sort((a,b)=>b.r-a.r); return w.slice(0,n).map(x=>x.i); };
function startLevelQuiz(lv){
  const pool=QUIZ.map((q,i)=>i).filter(i=>QUIZ[i].lv===lv);
  const qs=shuffle(pool).slice(0,5); const st={k:0,score:0,qs};
  const render=()=>{
    if(st.k>=st.qs.length){
      const pass=st.score>=Math.ceil(st.qs.length*.8); const lp=store.lvPass||{};
      if(pass&&(!lp[lv]||st.score>lp[lv])){ lp[lv]=st.score; store.lvPass=lp; persist(); }
      $('#sheetBody').innerHTML=`<div class="lesson" style="text-align:center;align-items:center"><div class="bigring" style="margin:10px auto">${ringSVG(st.score/st.qs.length*100,108,9)}<div class="v"><b>${st.score}/${st.qs.length}</b><span>câu đúng</span></div></div>
        <h3>${pass?`Đã vượt cấp ${lv}!`:`Chưa vượt cấp ${lv}`}</h3><p>${pass?(lv<10?`Cấp ${lv+1} — ${esc(LEVELS[lv].n)} — đã sẵn sàng.`:'Bạn đã hoàn thành cả 10 cấp.'):'Cần 4/5 câu đúng. Xem lại các bài của cấp này rồi thử lại.'}</p>
        <div class="row-btns" style="justify-content:center">${pass&&lv<10?`<button class="btn pri" id="lqNext">Sang cấp ${lv+1}</button>`:`<button class="btn pri" id="lqAgain">Làm lại</button>`}<button class="btn" id="lqClose">Đóng</button></div></div>`;
      animateRings($('#sheetBody'));
      const nx=$('#lqNext'); if(nx) nx.onclick=()=>{ closeSheet(); S.lvOpen=lv+1; if(S.view==='learn') RENDER.learn(); };
      const ag=$('#lqAgain'); if(ag) ag.onclick=()=>startLevelQuiz(lv);
      $('#lqClose').onclick=()=>{ closeSheet(); if(S.view==='learn') RENDER.learn(); };
      if(pass&&HAS_GSAP()&&!REDUCED()) gsap.from('#sheetBody h3',{scale:.6,opacity:0,duration:.5,ease:'back.out(2)'});
      return; }
    const qi=st.qs[st.k], Q=QUIZ[qi]; const order=shuffle(Q.a.map((t,i)=>({t,i})));
    $('#sheetBody').innerHTML=`<div class="lesson"><div style="display:flex;justify-content:space-between;align-items:center"><span class="note">Cấp ${lv} · Câu ${st.k+1}/${st.qs.length}</span><span class="note">Đúng: ${st.score}</span></div>
      <div class="progress"><i style="width:${st.k/st.qs.length*100}%"></i></div>
      <h3 style="font-size:19px;line-height:1.3">${esc(Q.q)}</h3>
      <div style="display:flex;flex-direction:column;gap:8px" id="qOpts">${order.map(o=>`<button class="quiz-opt" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
      <div id="qFb"></div></div>`;
    let answered=false;
    $$('#qOpts .quiz-opt').forEach(b=>b.onclick=()=>{ if(answered) return; answered=true; const ok=+b.dataset.i===Q.c;
      $$('#qOpts .quiz-opt').forEach(x=>{ if(+x.dataset.i===Q.c) x.classList.add('ok'); x.disabled=true; }); if(!ok) b.classList.add('bad');
      const leit=store.leit||{}; leit[qi]= ok? Math.min(5,(leit[qi]||1)+1) : 1; store.leit=leit; persist(); if(ok) st.score++;
      $('#qFb').innerHTML=`<div class="hook" style="border-color:${ok?'var(--up)':'var(--dn)'}"><b style="color:${ok?'var(--up)':'var(--dn)'}">${ok?'Chính xác.':'Chưa đúng.'}</b> ${esc(Q.e)}</div><div class="row-btns" style="margin-top:10px"><button class="btn pri" id="qNext">${st.k+1<st.qs.length?'Câu tiếp':'Xem kết quả'}</button></div>`;
      $('#qNext').onclick=()=>{ st.k++; render(); }; $('#qNext').focus({preventScroll:true}); });
  };
  openSheet(`Kiểm tra cấp ${lv} · ${LEVELS[lv-1].n}`,'',()=>render());
}
/* nút “Bài tiếp” trong bài học: sang cấp kế tiếp khi hết cấp */
const _openLessonLv=openLesson;
openLesson=function(id){ _openLessonLv(id); const l=LESSONS.find(x=>x.id===id); if(!l) return;
  const ids=LEVELS[l.lv-1].ids; const last=ids.indexOf(l.id)===ids.length-1; const nb=$('#lNext');
  if(nb&&last){ nb.textContent=l.lv<10?`Kiểm tra cấp ${l.lv}`:'Kiểm tra cấp 10'; nb.onclick=()=>startLevelQuiz(l.lv); }
  if(S.view==='learn') S.lvOpen=l.lv; };

/* ---------- phần tương tác của bài mở rộng ---------- */
const _openLessonX=openLesson;
openLesson=function(id){
  _openLessonX(id); const l=LESSONS.find(x=>x.id===id); if(!l) return;
  const fm=$('#sheetBody .formula'); if(!fm) return;
  const box=document.createElement('div'); box.style.cssText='display:flex;flex-direction:column;gap:12px';
  if(l.interactive==='fv'){
    box.innerHTML=`<section class="panel" style="display:flex;flex-direction:column;gap:10px"><b style="font-family:var(--f-disp)">Máy tính kế hoạch tích sản</b>
      <label class="slider-row"><span>Góp mỗi tháng</span><input type="range" id="fvM" min="1" max="50" step="1" value="5"><output id="fvMo"></output></label>
      <label class="slider-row"><span>Số năm</span><input type="range" id="fvN" min="1" max="40" step="1" value="20"><output id="fvNo"></output></label>
      <label class="slider-row"><span>Lợi nhuận/năm</span><input type="range" id="fvR" min="0" max="15" step="0.5" value="8"><output id="fvRo"></output></label>
      <label class="slider-row"><span>Lạm phát/năm</span><input type="range" id="fvI" min="0" max="8" step="0.5" value="3.5"><output id="fvIo"></output></label>
      <div class="result" id="fvOut"></div><div id="fvChart"></div>
      <p class="note">Giả định lợi nhuận đều mỗi năm và góp cuối mỗi tháng; thực tế thị trường lên xuống thất thường. Kết quả chỉ để lập kế hoạch, không phải dự báo.</p></section>`;
    fm.after(box);
    const up=()=>{ const m=+$('#fvM').value, n=+$('#fvN').value, R=+$('#fvR').value, I=+$('#fvI').value;
      $('#fvMo').textContent=m+' tr'; $('#fvNo').textContent=n+' năm'; $('#fvRo').textContent=fmt(R,1)+'%'; $('#fvIo').textContent=fmt(I,1)+'%';
      const r=Math.pow(1+R/100,1/12)-1; const fvAt=k=>r? m*((Math.pow(1+r,k)-1)/r) : m*k;
      const fv=fvAt(n*12), ct=m*n*12, real=fv/Math.pow(1+I/100,n), pass=real*0.04/12;
      const ty=v=>v>=1000? fmt(v/1000,2)+' tỷ' : fmt(v,0)+' tr';
      $('#fvOut').innerHTML=`<div><b class="gold">${ty(fv)}</b><span>Giá trị sau ${n} năm</span></div><div><b>${ty(ct)}</b><span>Tiền bạn góp</span></div><div><b class="up">${ty(Math.max(0,fv-ct))}</b><span>Lãi kép tạo ra</span></div><div><b>${ty(real)}</b><span>Quy về tiền hôm nay</span></div><div><b>${ty(pass)}/tháng</b><span>Thu nhập thụ động (rút 4%, tiền hôm nay)</span></div>`;
      const W=340,H=140,p={l:36,r:8,t:8,b:20}; const X=y=>p.l+y/n*(W-p.l-p.r), Y=v=>H-p.b-v/(fv||1)*(H-p.t-p.b);
      let a='',b=''; for(let y=0;y<=n;y++){ a+=(y?'L':'M')+X(y).toFixed(1)+' '+Y(fvAt(y*12)).toFixed(1); b+=(y?'L':'M')+X(y).toFixed(1)+' '+Y(m*12*y).toFixed(1); }
      let g=`<path d="${a} L${X(n)} ${Y(0)} L${X(0)} ${Y(0)}Z" style="fill:var(--up);fill-opacity:.3"/><path d="${b} L${X(n)} ${Y(0)} L${X(0)} ${Y(0)}Z" style="fill:var(--us);fill-opacity:.5"/><line class="axis" x1="${p.l}" x2="${W-p.r}" y1="${Y(0)}" y2="${Y(0)}"/>`;
      [0,.5,1].forEach(k=>g+=`<text x="${p.l-4}" y="${Y(fv*k)+3}" text-anchor="end">${ty(fv*k)}</text>`); [0,Math.round(n/2),n].forEach(y=>g+=`<text x="${X(y)}" y="${H-5}" text-anchor="middle">năm ${y}</text>`);
      $('#fvChart').innerHTML=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Tăng trưởng tài sản theo năm">${g}</svg><div class="legend"><span><i style="background:var(--us)"></i>Tiền góp</span><span><i style="background:var(--up)"></i>Tổng giá trị (gồm lãi kép)</span></div>`; };
    ['fvM','fvN','fvR','fvI'].forEach(i=>$('#'+i).oninput=up); up();
  }
  if(l.interactive==='practice'){
    const rows=[['Doanh thu',1000,1200,1500],['Lợi nhuận gộp',300,348,405],['LNST',100,130,180],['Dòng tiền KD (CFO)',110,60,-20],['Phải thu khách hàng',150,260,450],['Hàng tồn kho',200,230,260],['Vay nợ',200,300,520],['Vốn chủ sở hữu',800,900,1050]];
    const qa=[['Doanh thu tăng bao nhiêu mỗi năm?','2024: +20% (1.200 ÷ 1.000), 2025: +25% (1.500 ÷ 1.200). Tăng trưởng nhanh dần.'],
      ['Biên lợi nhuận gộp đang thế nào?','30% → 29% → 27%. Biên co lại dù doanh thu tăng: có thể giảm giá bán hoặc chi phí đầu vào tăng để đẩy doanh số.'],
      ['Lợi nhuận tăng 80% trong 2 năm. Dòng tiền kinh doanh có theo kịp không?','Không: CFO từ 110 xuống 60 rồi âm 20. Lợi nhuận không biến thành tiền. CFO ÷ LNST: 1,1 → 0,46 → −0,11.'],
      ['Tiền bị kẹt ở đâu?','Phải thu tăng gấp 3 (150 → 450) trong khi doanh thu chỉ +50%. Số ngày thu tiền từ ≈ 55 ngày lên ≈ 110 ngày: doanh nghiệp bán chịu nhiều hơn để tăng doanh thu.'],
      ['Thiếu tiền thì doanh nghiệp bù bằng gì?','Vay nợ tăng 200 → 520. Nợ vay ÷ vốn chủ từ 0,25 lên ≈ 0,50.'],
      ['Kết luận?','Tăng trưởng “nóng”, chất lượng thấp: 3 cờ đỏ (CFO âm khi có lãi, phải thu tăng vọt, nợ vay tăng mạnh). Theo quy tắc của cấp này: loại, hoặc chỉ cân nhắc lại khi dòng tiền cải thiện.']];
    box.innerHTML=`<section class="panel" style="display:flex;flex-direction:column;gap:10px"><b style="font-family:var(--f-disp)">Công ty CP Sen Vàng — số liệu giả định (tỷ đồng)</b>
      <div class="scroll-x"><table class="thr"><thead><tr><th>Khoản mục</th><th>2023</th><th>2024</th><th>2025</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r[0])}</td>${r.slice(1).map(v=>`<td style="text-align:right;${v<0?'color:var(--dn);font-weight:700':''}">${fmt(v,0)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <p class="note">Tự trả lời từng câu trước khi mở đáp án — nhớ lâu hơn nhiều so với đọc ngay lời giải.</p>
      ${qa.map(([q,a],i)=>`<details class="acc"><summary>${i+1}. ${esc(q)}</summary><div class="acc-b"><p style="font-size:14px">${esc(a)}</p></div></details>`).join('')}</section>`;
    fm.after(box);
  }
  if(l.act==='screen'||l.act==='styles'){
    const ps= l.act==='styles'? [['value','Giá trị'],['garp','GARP'],['growth','Tăng trưởng'],['income','Cổ tức'],['quality','Chất lượng']] : [['balanced','Mở bộ lọc La Bàn']];
    box.innerHTML=`<section class="panel" style="display:flex;flex-direction:column;gap:8px"><b style="font-family:var(--f-disp)">Áp dụng ngay trong ứng dụng</b><div class="row-btns">${ps.map(([k,n])=>`<button class="btn sm" data-lpreset="${k}">${esc(n)}</button>`).join('')}</div><p class="note">Bộ lọc xếp hạng toàn bộ cổ phiếu theo bộ trọng số bạn chọn; dùng như bước sàng lọc đầu tiên, không phải danh sách mua.</p></section>`;
    fm.after(box);
    $$('[data-lpreset]',box).forEach(b=>b.onclick=()=>{ S.preset=b.dataset.lpreset; S.scrMode='stock'; S.filters.sort='score'; S.listN=60; saveState(); computeAll(); closeSheet(); setView('screen'); toast('Đã áp dụng bộ trọng số '+(PRESETS[S.preset]?PRESETS[S.preset].n:'')); });
  }
};
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
