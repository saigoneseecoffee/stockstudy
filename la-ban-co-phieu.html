<title>La Bàn Cổ Phiếu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#150F0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap">
<style>
/* Bố cục: thanh tab đáy trên iPhone, thanh dọc bên trái trên máy tính; nội dung một cột, hai cột từ 960px.
   Chất liệu: sơn mài — nền đen ánh đỏ, điểm nhấn vàng lá; màu tăng/giảm theo quy ước bảng điện Việt Nam. */
:root{
  --bg:#150F0E; --s1:#1D1614; --s2:#271E1B; --line:#3A2D29; --line2:#4B3A35;
  --fg:#F3EADF; --mut:#A99A8E; --mut2:#7E7067;
  --gold:#D8AE57; --gold-ink:#1A1208; --gold-soft:rgba(216,174,87,.14);
  --up:#3DB98E; --dn:#E85A4F; --ref:#E7C24C; --ceil:#B583EA; --floor:#4CC4E4;
  --us:#86A8F3; --vn:#E58457;
  --shadow:0 18px 40px rgba(0,0,0,.45);
  --f-disp:"Bricolage Grotesque","Be Vietnam Pro",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r1:8px; --r2:14px; --r3:22px;
  --tabh:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#E8ECE9; --s1:#F6F8F6; --s2:#FFFFFF; --line:#CBD3CE; --line2:#B5BFB9;
  --fg:#1B1512; --mut:#5C5751; --mut2:#6B655F;
  --gold:#8E6416; --gold-ink:#FFF8EA; --gold-soft:rgba(142,100,22,.12);
  --up:#13805A; --dn:#C3352B; --ref:#866806; --ceil:#7A48BE; --floor:#0F7BA2;
  --us:#2C5BC2; --vn:#B4461F; --shadow:0 18px 40px rgba(30,40,35,.18); color-scheme:light } }
:root[data-theme="light"]{
  --bg:#E8ECE9; --s1:#F6F8F6; --s2:#FFFFFF; --line:#CBD3CE; --line2:#B5BFB9;
  --fg:#1B1512; --mut:#5C5751; --mut2:#6B655F;
  --gold:#8E6416; --gold-ink:#FFF8EA; --gold-soft:rgba(142,100,22,.12);
  --up:#13805A; --dn:#C3352B; --ref:#866806; --ceil:#7A48BE; --floor:#0F7BA2;
  --us:#2C5BC2; --vn:#B4461F; --shadow:0 18px 40px rgba(30,40,35,.18); color-scheme:light }

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; text-size-adjust:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; font-variant-numeric:tabular-nums; overflow-x:hidden;
  -webkit-tap-highlight-color:transparent}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:60; background:var(--bg)}
button,select,input{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold); outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-disp); margin:0; text-wrap:balance; letter-spacing:-.01em}
p{margin:0}
.mut{color:var(--mut)} .up{color:var(--up)} .dn{color:var(--dn)} .gold{color:var(--gold)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- khung ---------- */
.shell{min-height:100%; padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(14px); -webkit-backdrop-filter:saturate(1.4) blur(14px); border-bottom:1px solid var(--line)}
.top-in{display:flex; align-items:center; gap:12px; padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); max-width:1240px; margin:0 auto}
.brand{display:flex; align-items:center; gap:9px; min-width:0; flex:1}
.brand svg{flex:none}
.brand b{font-family:var(--f-disp); font-weight:800; font-size:18px; letter-spacing:-.02em; white-space:nowrap}
.brand small{display:block; font-size:11px; color:var(--mut); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.seg{display:inline-flex; background:var(--s1); border:1px solid var(--line); border-radius:999px; padding:3px; gap:2px; flex:none}
.seg button{border:0; background:none; padding:6px 11px; border-radius:999px; font-size:13px; font-weight:600; color:var(--mut); min-height:32px; white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--gold); color:var(--gold-ink)}
.icon-btn{width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:var(--s1); display:grid; place-items:center; flex:none}
.icon-btn svg{width:19px;height:19px}

main{max-width:1240px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:18px 0}
.view{display:flex; flex-direction:column; gap:22px}
.view[hidden]{display:none!important}

.tabbar{position:fixed; left:0; right:0; bottom:0; z-index:45; background:color-mix(in srgb,var(--s1) 92%,transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border-top:1px solid var(--line);
  display:grid; grid-template-columns:repeat(6,1fr); padding-bottom:env(safe-area-inset-bottom,0px);
  padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
.tabbar button{border:0; background:none; height:var(--tabh); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:10.5px; white-space:nowrap; font-weight:600; color:var(--mut); position:relative}
.tabbar svg{width:23px;height:23px}
.tabbar button[aria-current="page"]{color:var(--gold)}
.tabbar button[aria-current="page"]::before{content:""; position:absolute; top:0; left:30%; right:30%; height:2px; background:var(--gold); border-radius:0 0 3px 3px}

@media (min-width:960px){
  .shell{padding-left:92px; padding-bottom:40px}
  .tabbar{top:0; right:auto; width:92px; grid-template-columns:1fr; grid-auto-rows:78px; align-content:start; padding-top:calc(env(safe-area-inset-top,0px) + 72px); border-top:0; border-right:1px solid var(--line)}
  .tabbar button{height:78px}
  .tabbar button[aria-current="page"]::before{top:22%; bottom:22%; left:0; right:auto; width:3px; height:auto; border-radius:0 3px 3px 0}
  .top-in{padding-left:max(24px,env(safe-area-inset-left,0px))}
  main{padding-left:max(28px,env(safe-area-inset-left,0px)); padding-right:max(28px,env(safe-area-inset-right,0px))}
}

/* ---------- khối nội dung ---------- */
.sec-h{display:flex; align-items:end; justify-content:space-between; gap:12px; margin-bottom:10px}
.sec-h h2{font-size:21px; font-weight:700}
.sec-h p{font-size:13px; color:var(--mut)}
.panel{background:var(--s1); border:1px solid var(--line); border-radius:var(--r2); padding:16px; min-width:0}
.panel.flat{background:none; border:0; padding:0}
.grid2{display:grid; gap:22px; grid-template-columns:1fr}
@media (min-width:960px){ .grid2{grid-template-columns:1fr 1fr} .grid2 .span2{grid-column:1/-1} }
.note{font-size:12px; color:var(--mut); line-height:1.45}
.note b{color:var(--fg); font-weight:600}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line2); border-radius:999px; padding:4px 10px; font-size:12.5px; font-weight:600; background:var(--s2); white-space:nowrap}
.chip.on{background:var(--gold); color:var(--gold-ink); border-color:var(--gold)}
.chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; -webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips .chip{min-height:36px; padding:6px 14px; font-size:13.5px}
.mk{font-size:10.5px; font-weight:700; letter-spacing:.06em; border-radius:5px; padding:1px 5px; border:1px solid currentColor}
.mk.US{color:var(--us)} .mk.VN{color:var(--vn)}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:0 16px; border-radius:12px; border:1px solid var(--line2); background:var(--s2); font-weight:600; font-size:14px}
.btn.pri{background:var(--gold); color:var(--gold-ink); border-color:var(--gold)}
.btn.ghost{background:none}
.btn.sm{min-height:36px; padding:0 12px; font-size:13px; border-radius:10px}
.btn svg{width:17px;height:17px}
.btn[disabled]{opacity:.5}
.row-btns{display:flex; flex-wrap:wrap; gap:8px}

/* ---------- hero la bàn ---------- */
.hero{display:grid; gap:16px; grid-template-columns:1fr; align-items:center}
@media (min-width:760px){ .hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)} }
.hero-copy h1{font-size:clamp(30px,8.4vw,52px); line-height:1.02; font-weight:800; letter-spacing:-.035em}
.hero-copy h1 .tk{color:var(--gold)}
.hero-copy .lead{font-size:15px; color:var(--mut); margin-top:10px; max-width:46ch}
.compass{position:relative; width:100%; max-width:440px; margin:0 auto; aspect-ratio:1/1}
.compass svg{width:100%; height:100%; display:block; overflow:visible}
.pick-rail{display:flex; gap:8px; margin-top:14px; flex-wrap:wrap}
.pick{border:1px solid var(--line2); background:var(--s1); border-radius:12px; padding:7px 10px; display:flex; align-items:center; gap:8px; min-height:44px; text-align:left}
.pick b{font-family:var(--f-disp); font-size:15px}
.pick span{font-size:12px; color:var(--mut)}
.pick[aria-pressed="true"]{border-color:var(--gold); background:var(--gold-soft)}
.hero-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-top:16px}
.hero-stats div{border-top:1px solid var(--line2); padding-top:8px}
.hero-stats b{display:block; font-family:var(--f-disp); font-size:22px; font-weight:700}
.hero-stats span{font-size:11.5px; color:var(--mut)}

/* ---------- biểu đồ chung ---------- */
.chart{width:100%; display:block; overflow:visible}
.chart text{font-family:var(--f-body); fill:var(--mut); font-size:11px}
.chart .lbl-strong{fill:var(--fg); font-weight:600}
.axis{stroke:var(--line2); stroke-width:1}
.grid-l{stroke:var(--line); stroke-width:1}
.scroll-x{overflow-x:auto; -webkit-overflow-scrolling:touch}
.legend{display:flex; flex-wrap:wrap; gap:12px; font-size:12px; color:var(--mut); margin-top:8px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:-1px}

/* treemap */
.tree{position:relative; width:100%; aspect-ratio:16/11; border-radius:10px; overflow:hidden; max-width:100%}
.tree .cell{position:absolute; padding:5px 6px; border:1px solid var(--bg); overflow:hidden; text-align:left; display:flex; flex-direction:column; justify-content:space-between; border-radius:3px}
.tree .cell b{font-size:12px; font-weight:700; line-height:1.15; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tree .cell span{font-size:11px; color:rgba(255,255,255,.85); font-weight:600}

/* ---------- sàng lọc ---------- */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.field{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--mut); min-width:0}
.field select,.field input[type=text],.field input[type=number],.inp{min-height:44px; border-radius:11px; border:1px solid var(--line2); background:var(--s2); padding:0 12px; font-size:15px; width:100%}
.search{flex:1 1 180px; position:relative}
.field.search input{padding-left:40px}
.search svg{position:absolute; left:12px; top:13px; width:18px; height:18px; color:var(--mut)}
.filters{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px}
@media (min-width:700px){ .filters{grid-template-columns:repeat(4,minmax(0,1fr))} }
.switch{display:flex; align-items:center; gap:10px; min-height:44px; font-size:13.5px; color:var(--fg)}
.switch input{appearance:none; -webkit-appearance:none; width:44px; height:26px; border-radius:99px; background:var(--line2); position:relative; flex:none; transition:background .2s}
.switch input::after{content:""; position:absolute; left:3px; top:3px; width:20px; height:20px; border-radius:50%; background:var(--fg); transition:transform .2s}
.switch input:checked{background:var(--gold)} .switch input:checked::after{transform:translateX(18px); background:var(--gold-ink)}
details.acc{border:1px solid var(--line); border-radius:var(--r2); background:var(--s1)}
details.acc>summary{list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-weight:600; min-height:48px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:""; width:9px; height:9px; border-right:2px solid var(--mut); border-bottom:2px solid var(--mut); transform:rotate(45deg); transition:transform .2s; flex:none}
details.acc[open]>summary::after{transform:rotate(-135deg)}
details.acc .acc-b{padding:0 16px 16px}
.wts{display:grid; gap:12px; grid-template-columns:1fr}
@media (min-width:700px){ .wts{grid-template-columns:1fr 1fr} }
.wt{display:grid; grid-template-columns:92px 1fr 36px; align-items:center; gap:10px; font-size:13.5px}
.wt output{text-align:right; font-weight:700}
input[type=range]{-webkit-appearance:none; appearance:none; width:100%; height:28px; background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px; border-radius:4px; background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--gold); margin-top:-9px; border:3px solid var(--s1)}
input[type=range]::-moz-range-track{height:4px; border-radius:4px; background:var(--line2)}
input[type=range]::-moz-range-thumb{width:18px; height:18px; border-radius:50%; background:var(--gold); border:3px solid var(--s1)}

.list{display:flex; flex-direction:column; border:1px solid var(--line); border-radius:var(--r2); overflow:hidden; background:var(--s1)}
.srow{display:grid; grid-template-columns:28px minmax(0,1fr) auto 50px; gap:10px; align-items:center; padding:11px 12px; border:0; border-bottom:1px solid var(--line); background:none; text-align:left; width:100%; min-height:64px}
.srow:last-child{border-bottom:0}
.srow:hover{background:var(--s2)}
.srow .rk{font-size:12px; color:var(--mut2); font-weight:700; text-align:center}
.srow .nm{min-width:0}
.srow .nm b{font-family:var(--f-disp); font-size:16px; font-weight:700; display:flex; align-items:center; gap:6px}
.srow .nm span{display:block; font-size:12px; color:var(--mut); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.glyph{display:flex; align-items:flex-end; gap:2px; height:26px}
.glyph i{width:6px; border-radius:2px 2px 0 0; background:var(--gold); opacity:.9}
.ring{width:46px; height:46px; position:relative}
.ring svg{width:100%; height:100%; transform:rotate(-90deg)}
.ring b{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-disp); font-size:15px; font-weight:700}
.grade{font-family:var(--f-disp); font-weight:800; font-size:11px; border-radius:5px; padding:1px 6px; white-space:nowrap}
.g-A{background:color-mix(in srgb,var(--up) 22%,transparent); color:var(--up)}
.g-B{background:color-mix(in srgb,var(--gold) 22%,transparent); color:var(--gold)}
.g-C{background:color-mix(in srgb,var(--mut) 22%,transparent); color:var(--mut)}
.g-D{background:color-mix(in srgb,var(--dn) 22%,transparent); color:var(--dn)}
.star{border:0; background:none; width:30px; height:30px; display:grid; place-items:center; color:var(--mut2); padding:0}
.star[aria-pressed="true"]{color:var(--ref)}
.star svg{width:18px; height:18px}
.empty{padding:28px 18px; text-align:center; color:var(--mut); font-size:14px}

/* ---------- sheet chi tiết ---------- */
.sheet{position:fixed; inset:0; z-index:80; display:flex; justify-content:flex-end; align-items:flex-end}
.sheet[hidden]{display:none!important}
.scrim{position:absolute; inset:0; background:rgba(5,3,2,.55)}
.sheet-card{position:relative; width:100%; max-height:calc(100% - env(safe-area-inset-top,0px) - 10px); background:var(--bg); border-radius:22px 22px 0 0; border:1px solid var(--line);
  display:flex; flex-direction:column; box-shadow:var(--shadow); overflow:hidden}
@media (min-width:960px){ .sheet{align-items:stretch} .sheet-card{width:600px; max-height:none; height:100%; border-radius:0; border-width:0 0 0 1px} }
.sheet-head{display:flex; align-items:center; gap:12px; padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px)); border-bottom:1px solid var(--line); background:var(--s1); flex:none}
.sheet-head .grab{position:absolute; top:5px; left:50%; width:38px; height:4px; margin-left:-19px; border-radius:4px; background:var(--line2)}
.sheet-head h3{font-size:18px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sheet-body{overflow-y:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; padding:16px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:18px}
.dt-top{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center}
.dt-top h2{font-size:38px; font-weight:800; letter-spacing:-.035em; line-height:1}
.dt-top .sub{font-size:13px; color:var(--mut); margin-top:6px}
.bigring{width:108px; height:108px; position:relative}
.bigring svg{width:100%; height:100%; transform:rotate(-90deg)}
.bigring .v{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center}
.bigring .v b{font-family:var(--f-disp); font-size:32px; font-weight:800; line-height:1}
.bigring .v span{font-size:11px; color:var(--mut)}
.flags{display:flex; flex-wrap:wrap; gap:6px}
.flag{font-size:12px; font-weight:600; border-radius:7px; padding:3px 8px; background:color-mix(in srgb,var(--dn) 16%,transparent); color:var(--dn)}
.flag.ok{background:color-mix(in srgb,var(--up) 16%,transparent); color:var(--up)}
.fbar{display:grid; grid-template-columns:96px 1fr 34px; gap:10px; align-items:center; font-size:13.5px}
.fbar .tr{height:8px; border-radius:8px; background:var(--line); overflow:hidden}
.fbar .tr i{display:block; height:100%; border-radius:8px; background:var(--gold)}
.fbar b{text-align:right}
.mtab{width:100%; border-collapse:collapse; font-size:13px}
.mtab td{padding:6px 0; border-bottom:1px solid var(--line)}
.mtab td:nth-child(2){text-align:right; font-weight:600; white-space:nowrap; padding-left:8px}
.mtab td:nth-child(3){width:70px; padding-left:10px}
.mini{height:5px; border-radius:5px; background:var(--line); overflow:hidden}
.mini i{display:block; height:100%; background:var(--gold)}
.kv{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.kv div{background:var(--s1); border:1px solid var(--line); border-radius:12px; padding:10px}
.kv b{display:block; font-family:var(--f-disp); font-size:20px; font-weight:700; line-height:1.15}
.kv span{font-size:11.5px; color:var(--mut); line-height:1.3; display:block}
.f9{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px}
.f9 div{border-radius:9px; padding:8px; font-size:11.5px; line-height:1.3; border:1px solid var(--line)}
.f9 div.y{background:color-mix(in srgb,var(--up) 13%,transparent); border-color:color-mix(in srgb,var(--up) 40%,transparent)}
.f9 div.n{background:color-mix(in srgb,var(--dn) 9%,transparent); border-color:color-mix(in srgb,var(--dn) 30%,transparent); color:var(--mut)}
.f9 b{display:block; font-size:12px; margin-bottom:2px}
.slider-row{display:grid; grid-template-columns:118px 1fr 52px; gap:10px; align-items:center; font-size:13px}
.slider-row output{text-align:right; font-weight:700}
.verdicts{display:flex; flex-wrap:wrap; gap:6px}
.verdict{font-size:12.5px; border-radius:9px; padding:5px 9px; border:1px solid var(--line2); display:flex; gap:6px; align-items:center}
.verdict.y{border-color:var(--up); color:var(--up)} .verdict.n{color:var(--mut)}

/* ---------- chuyên gia ---------- */
.subtabs{display:flex; gap:6px; overflow-x:auto; scrollbar-width:none}
.subtabs::-webkit-scrollbar{display:none}
.subtabs button{border:1px solid var(--line2); background:none; border-radius:10px; padding:0 14px; min-height:40px; font-weight:600; font-size:13.5px; color:var(--mut); white-space:nowrap}
.subtabs button[aria-selected="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.persona-grid{display:grid; gap:14px; grid-template-columns:1fr}

function interp(pts,v){
  if(v<=pts[0][0]) return pts[0][1];
  for(let i=1;i<pts.length;i++){ if(v<=pts[i][0]){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; return y0+(y1-y0)*(v-x0)/(x1-x0);} }
  return pts[pts.length-1][1];
}
const fscore=s=> isNum(s.fsn)? s.fsn : (s.f&&/^[01]{9}$/.test(s.f))? s.f.split('').filter(c=>c==='1').length : null;
const kn=(v,f)=> isNum(v)? f(v) : null; /* tiêu chí không có dữ liệu → null */
function metric(s,k){
  switch(k){
    case 'peg': return (isNum(s.pe)&&s.pe>0&&isNum(s.fg)&&s.fg>0)? s.pe/s.fg : null;
    case 'fs': return fscore(s);
    case 'pbroe': return (isNum(s.pb)&&s.pb>0&&isNum(s.roe)&&s.roe>0)? s.pb/s.roe*10 : null;
    case 'posafe':
      if(!isNum(s.dy)) return null;
      if(s.dy<=0) return .35;
      if(!isNum(s.po)) return .6;
      return s.po<=0?.35: s.po<60?1: s.po<80?.7: s.po<100?.35: 0;
    default: return isNum(s[k])? s[k] : null;
  }
}
/* giá trị dùng để xếp hạng: bội số âm (thua lỗ) xếp cuối */
function rankVal(s,k){
  const v=metric(s,k); if(v==null) return null;
  if((k==='pe'||k==='pb'||k==='ev')&&v<=0) return 9999;
  return v;
}
function absScore(s,k){
  const v=metric(s,k); if(v==null) return null;
  if(k==='posafe') return v;
  if((k==='pe'||k==='ev'||k==='pb')&&v<=0) return 0;
  return ABS[k]? interp(ABS[k],v) : null;
}

  value:{n:'Giá trị (Graham)',d:'Ưu tiên rẻ và an toàn',w:{val:40,qual:15,grow:5,safe:25,mom:0,inc:15}},
  quality:{n:'Chất lượng (Buffett)',d:'Hào kinh tế, ROIC, bảng cân đối',w:{val:15,qual:40,grow:15,safe:20,mom:0,inc:10}},
  garp:{n:'GARP (Lynch)',d:'Tăng trưởng với giá hợp lý',w:{val:30,qual:15,grow:35,safe:10,mom:5,inc:5}},

};
function curWeights(){ return S.preset==='custom'&&S.custW? S.custW : PRESETS[S.preset]?PRESETS[S.preset].w : PRESETS.balanced.w; }

/* ---------- vũ trụ cổ phiếu & tính điểm ---------- */
let U=[]; let BY={};
function universe(){
  const base=STOCKS.concat(S.custom.map(c=>Object.assign({custom:1},c)));
  return base.map(s=>{ const o=Object.assign({},s); return Object.assign(o,liveFund(o),S.overrides[s.t]||{},{edited:!!S.overrides[s.t]}); });
}
function computeAll(){
  U=universe(); BY={};
  U.forEach(s=>{ s._type=s.bank?'bank':'gen'; BY[s.t]=s; });
  const groupCache={};
  const peersOf=s=>{
    const key=s._type+'|'+s.m;
    if(groupCache[key]) return groupCache[key];
    let P=U.filter(x=>x._type===s._type&&x.m===s.m);
    if(P.length<6) P=U.filter(x=>x._type===s._type);
    return groupCache[key]=P;
  };
  const sorted={};
  const pctRank=(s,k,dir)=>{
    const P=peersOf(s); const key=s._type+'|'+s.m+'|'+k;
    let arr=sorted[key];
    if(!arr){ arr=P.map(x=>rankVal(x,k)).filter(v=>v!=null).sort((a,b)=>a-b); sorted[key]=arr; }
    const v=rankVal(s,k); if(v==null||arr.length<3) return null;
    let a0=0,b0=arr.length; while(a0<b0){ const m=(a0+b0)>>1; if(arr[m]<v) a0=m+1; else b0=m; } const lo=a0;
    let c0=lo,d0=arr.length; while(c0<d0){ const m=(c0+d0)>>1; if(arr[m]<=v) c0=m+1; else d0=m; } const eq=c0-lo;
    const r=(lo+(eq-1)/2)/(arr.length-1);
    return dir>0? r : 1-r;
  };
  const W=curWeights(); const wsum=Object.values(W).reduce((a,b)=>a+b,0)||1;
  U.forEach(s=>{
    s._f={}; s._m={};
    FACTORS.forEach(F=>{
      const list=F[s._type]; let tot=0, wt=0;
      list.forEach(([k,dir,w])=>{
        const r=pctRank(s,k,dir), a=absScore(s,k);
        let sc=null;
        if(r!=null&&a!=null) sc=.55*r+.45*a; else if(r!=null) sc=r; else if(a!=null) sc=a;
        s._m[k]={v:metric(s,k),sc,r,a};
        if(sc!=null){ tot+=sc*w; wt+=w; }
      });
      s._f[F.k]= wt? Math.round(tot/wt*100) : 50;
    });
    let comp=0; FACTORS.forEach(F=>comp+=s._f[F.k]*(W[F.k]||0)); comp/=wsum;
    /* cờ đỏ — nhân hệ số phạt */
    const flags=[]; let mult=1;
    const fs=fscore(s);
    if(!s.bank&&isNum(s.z)&&s.z<1.81){ flags.push('Altman Z vùng nguy hiểm'); mult*=.86; }
    if(!s.bank&&s.s!=='ins'&&s.s!=='broker'&&fs!=null&&fs<=3){ flags.push('F-Score yếu ('+fs+'/9)'); mult*=.88; }
    if(!s.bank&&isNum(s.de)&&s.de>2){ flags.push('Đòn bẩy cao (D/E '+fmt(s.de)+')'); mult*=.93; }
    if(!s.bank&&isNum(s.ic)&&s.ic<2.5){ flags.push('Trả lãi khó (ICR '+fmt(s.ic)+')'); mult*=.92; }
    if(s.bank&&isNum(s.npl)&&s.npl>3){ flags.push('Nợ xấu cao ('+fmt(s.npl)+'%)'); mult*=.88; }
    if(s.bank&&isNum(s.car)&&s.car<9){ flags.push('Đệm vốn mỏng (CAR '+fmt(s.car)+'%)'); mult*=.94; }
    if(isNum(s.fcf)&&s.fcf<0){ flags.push('Dòng tiền tự do âm'); mult*=.95; }
    if(isNum(s.pe)&&(s.pe>60||s.pe<=0)){ flags.push(s.pe<=0?'Đang thua lỗ':'P/E rất cao ('+fmt(s.pe,0)+'x)'); mult*=.93; }
    if(isNum(s.po)&&s.po>100){ flags.push('Chi trả vượt lợi nhuận'); mult*=.95; }
    s._flags=flags;
    s._score=Math.round(clamp(comp*mult,0,100));
    const vals=FACTORS.map(F=>s._f[F.k]); const mean=vals.reduce((a,b)=>a+b,0)/6;
    s._disp=Math.round(Math.sqrt(vals.reduce((a,b)=>a+(b-mean)*(b-mean),0)/6));
    s._grade= s._score>=70?'A': s._score>=58?'B': s._score>=45?'C':'D';
  });
  /* xếp hạng trong thị trường, Magic Formula, động lượng */
  ['US','VN'].forEach(m=>{
    const L=U.filter(s=>s.m===m).sort((a,b)=>b._score-a._score);
    L.forEach((s,i)=>{ s._rank=i+1; s._of=L.length; });
    const G=L.filter(s=>!s.bank&&s.s!=='broker'&&s.s!=='ins'&&isNum(s.ev)&&s.ev>0&&isNum(s.roic));
    const byEY=[...G].sort((a,b)=>a.ev-b.ev), byRC=[...G].sort((a,b)=>b.roic-a.roic);
    G.forEach(s=>s._mfRank=byEY.indexOf(s)+byRC.indexOf(s));
    const mf=[...G].sort((a,b)=>a._mfRank-b._mfRank); mf.forEach((s,i)=>s._mfPct=1-i/Math.max(1,mf.length-1));
    const mo=[...L].filter(s=>isNum(s.mo)).sort((a,b)=>b.mo-a.mo); mo.forEach((s,i)=>s._moPct=1-i/Math.max(1,mo.length-1));
  });
  U.forEach(s=>{ s._val=valuation(s); s._persona=PERSONAS.map(P=>personaEval(P,s)); });
}
function inMarket(list){ return S.market==='ALL'? list : list.filter(s=>s.m===S.market); }
function ranked(){ return inMarket(U).slice().sort((a,b)=>b._score-a._score); }
function median(arr){ const a=arr.filter(isNum).sort((x,y)=>x-y); if(!a.length) return null; const m=a.length>>1; return a.length%2?a[m]:(a[m-1]+a[m])/2; }
function marketMedianFactors(m){ const L=U.filter(s=>m==='ALL'||s.m===m); const o={}; FACTORS.forEach(F=>o[F.k]=median(L.map(s=>s._f[F.k]))); return o; }

/* ---------- định giá nội tại (giá chuẩn hóa = 100) ---------- */
function mktAssump(s){ const st=S.settings; return s.m==='US'? {aaa:st.aaaUS,rf:st.rfUS,erp:st.erpUS,gt:st.gtUS} : {aaa:st.aaaVN,rf:st.rfVN,erp:st.erpVN,gt:st.gtVN}; }
function costOfEquity(s){ const a=mktAssump(s); return +(a.rf+(isNum(s.b)?s.b:1)*a.erp).toFixed(2); }
function dcfBase(s){
  const eps= isNum(s.pe)&&s.pe>0? 100/s.pe : 0;
  if(s.bank){ const g=clamp(s.fg||0,0,25); const reinv= isNum(s.roe)&&s.roe>0? clamp(g/s.roe,0,.9):.5; return eps*(1-reinv); }
  if(isNum(s.fcf)&&s.fcf>0) return s.fcf;
  return eps*.55;
}
function dcf(s,g1,r,gt,years){
  years=years||10; const base=dcfBase(s); let cf=base, sum=0; const pv=[];
  for(let t=1;t<=years;t++){
    const g= t<=5? g1 : g1+(gt-g1)*(t-5)/5;
    cf*=1+g/100; const d=cf/Math.pow(1+r/100,t); sum+=d; pv.push(d);
  }
  const tv= r>gt+.25? cf*(1+gt/100)/((r-gt)/100)/Math.pow(1+r/100,years) : NaN;
  return {base,pv,tv,total:sum+(isNum(tv)?tv:0),valid:isNum(tv)};
}
function reverseDCF(s,r,gt){
  if(dcfBase(s)<=0) return null;
  let lo=-30,hi=80;
  if(dcf(s,hi,r,gt).total<100) return hi; if(dcf(s,lo,r,gt).total>100) return lo;
  for(let i=0;i<60;i++){ const mid=(lo+hi)/2; if(dcf(s,mid,r,gt).total>100) hi=mid; else lo=mid; }
  return (lo+hi)/2;
}
function valuation(s){
  const a=mktAssump(s);
  const g=clamp(isNum(s.fg)?s.fg:(isNum(s.eg)?s.eg:0),0,15);
  const grahamPE=(8.5+2*g)*4.4/a.aaa;
  const grahamMoS= isNum(s.pe)&&s.pe>0? 1-s.pe/grahamPE : null;
  const gnUp= isNum(s.pe)&&s.pe>0&&isNum(s.pb)&&s.pb>0? Math.sqrt(22.5/(s.pe*s.pb))-1 : null;
  const r=costOfEquity(s); const g1=clamp(isNum(s.fg)?s.fg:5,-10,30);
  const d=dcf(s,g1,r,a.gt);
  const dcfUp= d.valid&&d.base>0? d.total/100-1 : null;
  const implied=reverseDCF(s,r,a.gt);
  let fairPB=null; if(s.bank&&isNum(s.roe)){ const gg=Math.min(a.gt+2,r-1); fairPB=(s.roe-gg)/(r-gg); }
  const pbUp= fairPB&&isNum(s.pb)? fairPB/s.pb-1 : null;
  const ests=[grahamMoS!=null?grahamPE/s.pe-1:null, dcfUp, s.bank?pbUp:gnUp].filter(isNum).map(v=>clamp(v,-.9,2));
  const blend= ests.length? median(ests) : null;
  return {grahamPE,grahamMoS,gnUp,r,g1,dcfUp,implied,fairPB,pbUp,blend};
}

function personaEval(P,s){
  const res=P.rules.map(([t,f])=>{ let ok=false; try{ const v=f(s); ok= v===null? null : !!v; }catch(e){ ok=false; } return ok; });
  const n=res.filter(x=>x===true).length, known=res.filter(x=>x!==null).length;
  const mustOk=(P.must||[]).every(i=>res[i]===true);
  /* tiêu chí thiếu dữ liệu bị loại khỏi mẫu số, nhưng phải có ít nhất 3/4 tiêu chí có dữ liệu */
  return {k:P.k,res,n,tot:known,all:res.length,pass:mustOk&&known>=Math.ceil(res.length*.75)&&n/known>=.75};
}

/* ---------- SVG: biểu đồ ---------- */
function ringSVG(score,size,stroke,col){
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c*(1-clamp(score,0,100)/100);
  col=col||scoreColor(score);
  return `<svg viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:var(--line)" stroke-width="${stroke}"/><circle class="ring-arc" cx="${size/2}" cy="${size/2}" r="${r}" fill="none" style="stroke:${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}" data-c="${c.toFixed(2)}" data-off="${off.toFixed(2)}"/></svg>`;
}
function scoreColor(v){ return v>=70?'var(--up)': v>=58?'var(--gold)': v>=45?'var(--mut)':'var(--dn)'; }
function heatColor(v){ /* đỏ → vàng → xanh, đồng nhất hai chủ đề */
  const t=clamp((v-30)/50,0,1);
  const stops=[[184,52,44],[150,106,26],[26,122,84]];
  const seg=t<.5?0:1, lt=t<.5?t*2:(t-.5)*2;
  const a=stops[seg],b=stops[seg+1];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*lt)},${Math.round(a[1]+(b[1]-a[1])*lt)},${Math.round(a[2]+(b[2]-a[2])*lt)})`;
}
function glyphHTML(s){
  return '<span class="glyph" aria-hidden="true">'+FACTORS.map(F=>`<i style="height:${Math.max(3,Math.round(s._f[F.k]/100*26))}px;opacity:${(.35+s._f[F.k]/160).toFixed(2)}"></i>`).join('')+'</span>';
}
function radarSVG(vals,opt){
  opt=opt||{}; const size=opt.size||300, cx=size/2, cy=size/2, R=size*(opt.bezel?.33:.36);
  const n=vals.length, ang=i=>-Math.PI/2+i*2*Math.PI/n;
  const pt=(i,v)=>[cx+Math.cos(ang(i))*R*v, cy+Math.sin(ang(i))*R*v];
  let g='';
  if(opt.bezel){
    g+=`<g class="bezel"><circle cx="${cx}" cy="${cy}" r="${R*1.38}" fill="none" style="stroke:var(--line2)" stroke-width="1"/>`;
    for(let i=0;i<72;i++){ const a=i*Math.PI/36, l=i%6===0?10:i%2===0?6:3, r1=R*1.38, r2=r1-l;
      g+=`<line x1="${(cx+Math.cos(a)*r1).toFixed(1)}" y1="${(cy+Math.sin(a)*r1).toFixed(1)}" x2="${(cx+Math.cos(a)*r2).toFixed(1)}" y2="${(cy+Math.sin(a)*r2).toFixed(1)}" style="stroke:${i%18===0?'var(--gold)':'var(--line2)'}" stroke-width="${i%6===0?1.6:1}"/>`; }
    g+=`<circle cx="${cx}" cy="${cy}" r="${R*1.5}" fill="none" style="stroke:var(--line)" stroke-width="1" stroke-dasharray="1 5"/></g>`;
  }
  [.25,.5,.75,1].forEach(k=>{ g+=`<polygon points="${vals.map((_,i)=>pt(i,k).map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="none" style="stroke:var(--line)" stroke-width="1"/>`; });

/* treemap dạng squarify */
function squarify(items,x,y,w,h){
  const out=[]; items=items.slice().sort((a,b)=>b.v-a.v);
  const total=items.reduce((a,b)=>a+b.v,0); if(!total) return out;
  const scale=w*h/total; let rest=items.map(i=>Object.assign({},i,{a:i.v*scale}));
  const worst=(row,len)=>{ const s=row.reduce((a,b)=>a+b.a,0); const mx=Math.max(...row.map(r=>r.a)), mn=Math.min(...row.map(r=>r.a)); return Math.max(len*len*mx/(s*s),(s*s)/(len*len*mn)); };
  while(rest.length){
    const len=Math.min(w,h); let row=[rest[0]], i=1;
    while(i<rest.length&&worst(row.concat(rest[i]),len)<=worst(row,len)){ row.push(rest[i]); i++; }
    const s=row.reduce((a,b)=>a+b.a,0);
    if(w>=h){ const cw=s/h; let cy=y; row.forEach(r=>{ const ch=r.a/cw; out.push(Object.assign(r,{x,y:cy,w:cw,h:ch})); cy+=ch; }); x+=cw; w-=cw; }
    else { const ch=s/w; let cx=x; row.forEach(r=>{ const cw=r.a/ch; out.push(Object.assign(r,{x:cx,y,w:cw,h:ch})); cx+=cw; }); y+=ch; h-=ch; }
    rest=rest.slice(i);
  }
  return out;
}

    const P=(a,rr)=>[cx+Math.cos(a)*rr,cy+Math.sin(a)*rr].map(v=>v.toFixed(2)).join(' ');
    if(p.v/tot>.999){ g+=`<circle cx="${cx}" cy="${cy}" r="${(R+r)/2}" fill="none" style="stroke:${p.c}" stroke-width="${R-r}"/>`; }
    else g+=`<path d="M${P(a0,R)} A${R} ${R} 0 ${large} 1 ${P(a1,R)} L${P(a1,r)} A${r} ${r} 0 ${large} 0 ${P(a0,r)}Z" style="fill:${p.c};stroke:var(--s1)" stroke-width="1.5"/>`;

    if(labelSet.has(s.t)){ const w=s.t.length*6.4+2; const cands=[[x+7+w/2,y-5,'start',x+7],[x-7-w/2,y-5,'end',x-7],[x,y-9,'middle',x],[x,y+16,'middle',x]];

function renderDist(){
  const box=$('#dist'); if(!box) return;
  const L=ranked(); const W=860,H=190,p={l:16,r:16,t:22,b:30}; const place=labelPlacer();
  const X=v=>p.l+v/100*(W-p.l-p.r);
  let g='';
  [[0,45,'D','var(--dn)'],[45,58,'C','var(--mut)'],[58,70,'B','var(--gold)'],[70,100,'A','var(--up)']].forEach(([a,b,l,c])=>{

    return;
  }
  const bins={};
  L.slice().sort((a,b)=>a._score-b._score).forEach(s=>{ const k=Math.round(s._score/2.4); bins[k]=(bins[k]||0)+1; const lvl=bins[k]-1;

function sortVal(s,k){
  if(k==='score') return s._score; if(FACTORS.some(F=>F.k===k)) return s._f[k];
  if(k==='mos') return isNum(s._val.blend)?s._val.blend:-9; if(k==='chg'){ const q=liveQ(s.t); return q&&isNum(q.pct)?q.pct:-999; } if(k==='dy') return s.dy||0; if(k==='cap') return capUSD(s);
  if(k==='tgt'){ const q=liveQ(s.t); const p=q&&isNum(q.px)?q.px:s.pxf; return isNum(s.tgt)&&isNum(p)&&p>0? s.tgt/p-1 : -9; }
  if(k==='mo') return isNum(s.mo)?s.mo:-999; if(k==='pe') return isNum(s.pe)&&s.pe>0? -s.pe : -9999; return 0;
}

function renderList(){
  const f=S.filters; const q=f.q.trim().toLowerCase();

  const hit=s=>!q||s.t.toLowerCase().includes(q)||s.n.toLowerCase().includes(q)||s.n.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').includes(qn);
  let L=inMarket(U).filter(s=>(f.sector==='all'||s.s===f.sector)&&(!f.ex||f.ex==='all'||s.ex===f.ex)&&s._score>=f.min&&(!f.noflag||!s._flags.length)&&hit(s));
  L.sort((a,b)=>sortVal(b,f.sort)-sortVal(a,f.sort));
  const pend=(S.market==='VN'?PENDING.VN.length:S.market==='US'?PENDING.US.length:PENDING.US.length+PENDING.VN.length);

function closeSheet(){

const GEN_FIELDS=['pe','pb','ev','fcf','dy','po','roe','roic','gm','om','nm','rg','eg','fg','de','cr','ic','z','mo','b'];
const BANK_FIELDS=['pe','pb','dy','po','roe','nim','npl','casa','car','rg','eg','fg','mo','b'];
function openEditor(t){
  const s=t?BY[t]:{t:'',n:'',m:S.market==='US'?'US':'VN',ex:S.market==='US'?'NASDAQ':'HOSE',s:'tech',cap:'',f:'000000000'};
  const isNew=!t; const bank=!!s.bank;
  const fieldsFor=b=>(b?BANK_FIELDS:GEN_FIELDS);
  const fieldHTML=b=>fieldsFor(b).map(k=>`<label class="field">${esc(MET[k].n)}${MET[k].u?' ('+MET[k].u+')':''}<input type="number" step="any" inputmode="decimal" id="e-${k}" value="${isNum(s[k])?s[k]:''}"></label>`).join('');
  const html=`<form id="edForm" class="form-grid" novalidate>
    ${isNew?`<label class="field">Mã<input type="text" id="e-t" required maxlength="10" autocapitalize="characters" placeholder="VD: CTD"></label><label class="field">Tên công ty<input type="text" id="e-n" required placeholder="VD: Coteccons"></label>
    <label class="field">Thị trường<select id="e-m"><option value="VN" ${s.m==='VN'?'selected':''}>Việt Nam</option><option value="US" ${s.m==='US'?'selected':''}>Mỹ</option></select></label>
    <label class="field">Sàn<input type="text" id="e-ex" value="${esc(s.ex)}"></label>
    <label class="field">Ngành<select id="e-s">${Object.entries(SECTORS).map(([k,n])=>`<option value="${k}">${esc(n)}</option>`).join('')}</select></label>
    <label class="switch" style="align-self:end"><input type="checkbox" id="e-bank" ${bank?'checked':''}>Là ngân hàng</label>`:''}
    <label class="field full">Vốn hóa (${s.m==='US'?'tỷ USD':'nghìn tỷ đồng'})<input type="number" step="any" inputmode="decimal" id="e-cap" value="${isNum(s.cap)?s.cap:''}"></label>
    <div class="full form-grid" id="edFields">${fieldHTML(bank)}</div>
    <fieldset class="full" style="border:1px solid var(--line);border-radius:12px;padding:10px"><legend class="note" style="padding:0 6px">9 phép thử Piotroski</legend>
      <div class="f9">${F9.map((x,i)=>`<label class="switch" style="min-height:36px;font-size:12px"><input type="checkbox" id="e-f${i}" ${s.f&&s.f[i]==='1'?'checked':''}>${esc(x[0])}</label>`).join('')}</div></fieldset>
    <p class="note full" id="edErr" style="color:var(--dn)"></p>
    <div class="row-btns full"><button class="btn pri" type="submit">${isNew?'Thêm mã':'Lưu số liệu'}</button>${!isNew&&(S.overrides[t])?'<button class="btn ghost" type="button" id="edReset">Khôi phục số liệu gốc</button>':''}</div>
    <p class="note full">Số liệu lưu trên trình duyệt này của bạn. Đơn vị phần trăm nhập số thường (15 = 15%). Để trống nếu không có.</p>
  </form>`;
  openSheet(isNew?'Thêm mã mới':'Sửa số liệu '+t,html,body=>{
    const bk=$('#e-bank',body); if(bk) bk.onchange=()=>{ $('#edFields').innerHTML=fieldHTML(bk.checked); };
    const rs=$('#edReset',body); if(rs) rs.onclick=()=>{ delete S.overrides[t]; saveState(); computeAll(); rerenderCurrent(); toast('Đã khôi phục '+t); openStock(t); };
    $('#edForm').onsubmit=e=>{ e.preventDefault();
      const b=isNew? $('#e-bank').checked : bank; const rec={};
      const num=id=>{ const el=$('#e-'+id); if(!el||el.value.trim()==='') return null; const v=parseFloat(el.value.replace(',','.')); return isFinite(v)?v:null; };
      fieldsFor(b).concat(['cap']).forEach(k=>{ rec[k]=num(k); });
      rec.f=F9.map((_,i)=>$('#e-f'+i).checked?'1':'0').join('');
      if(isNew){
        const tk=$('#e-t').value.trim().toUpperCase(), nm=$('#e-n').value.trim();
        if(!/^[A-Z0-9.]{1,10}$/.test(tk)){ $('#edErr').textContent='Mã chỉ gồm chữ in hoa, số và dấu chấm (tối đa 10 ký tự).'; return; }
        if(BY[tk]){ $('#edErr').textContent='Mã '+tk+' đã có. Mở mã đó và chọn “Sửa số liệu”.'; return; }
        if(!nm){ $('#edErr').textContent='Nhập tên công ty.'; return; }
        if(!isNum(rec.pe)||!isNum(rec.roe)){ $('#edErr').textContent='Cần ít nhất P/E và ROE để chấm điểm.'; return; }
        const obj=Object.assign({t:tk,n:nm,m:$('#e-m').value,ex:$('#e-ex').value.trim()||'—',s:b?'bank':$('#e-s').value},b?{bank:1}:{},rec);
        if(!isNum(obj.cap)) obj.cap=1;
        S.custom.push(obj); saveState(); computeAll(); rerenderCurrent(); toast('Đã thêm '+tk); openStock(tk);
      } else {
        const ov={}; Object.keys(rec).forEach(k=>{ const orig=(STOCKS.find(x=>x.t===t)||{})[k]; if(rec[k]!==orig&&!(rec[k]==null&&orig==null)) ov[k]=rec[k]; });
        if(s.custom){ const c=S.custom.find(x=>x.t===t); Object.assign(c,rec); } else if(Object.keys(ov).length) S.overrides[t]=ov; else delete S.overrides[t];
        saveState(); computeAll(); rerenderCurrent(); toast('Đã lưu số liệu '+t); openStock(t);
      }
    };
  });
}

function applyTheme(){

  r.dataset.ownTheme='1';
}

function renderCouncil(){

function renderCompare(){
  const box=$('#expertBody'); const L=ranked();
  if(!CMP.a||!BY[CMP.a]) CMP.a=L[0]&&L[0].t; if(!CMP.b||!BY[CMP.b]||CMP.b===CMP.a) CMP.b=(L.find(s=>s.t!==CMP.a)||{}).t;

  const keys=['pe','pb','roe','fg','dy','mo','b'].concat(!A.bank&&!B.bank?['roic','gm','de','fcf']:['npl','car']);
  const rows=keys.map(k=>{ const a=A._m[k]||{v:metric(A,k)},b=B._m[k]||{v:metric(B,k)}; const fmtv=v=>MET[k].u==='%'?pct(v):MET[k].u==='x'?xx(v):fmt(v,2);
    const sa=a.sc==null?0:a.sc, sb=b.sc==null?0:b.sc;
    return `<div style="display:grid;grid-template-columns:1fr 92px 1fr;gap:8px;align-items:center;font-size:13px;padding:6px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;align-items:center;gap:6px;justify-content:flex-end"><span style="font-weight:${sa>sb?700:500}">${fmtv(a.v)}</span><span style="display:block;height:8px;width:${Math.round(sa*60)}%;max-width:120px;border-radius:4px;background:var(--gold)"></span></div>
      <div style="text-align:center;color:var(--mut);font-size:12px">${esc(MET[k].n)}</div>
      <div style="display:flex;align-items:center;gap:6px"><span style="display:block;height:8px;width:${Math.round(sb*60)}%;max-width:120px;border-radius:4px;background:var(--us)"></span><span style="font-weight:${sb>sa?700:500}">${fmtv(b.v)}</span></div></div>`; }).join('');
  box.innerHTML=`<section class="panel" style="display:flex;flex-direction:column;gap:14px">
    <div class="filters" style="grid-template-columns:1fr 1fr"><label class="field">Mã A (vàng)<select id="cA">${opts(CMP.a)}</select></label><label class="field">Mã B (xanh)<select id="cB">${opts(CMP.b)}</select></label></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:center">

/* ---------- công cụ định lượng (hàm thuần, có kiểm thử) ---------- */
function positionSize(capital,riskPct,entry,stop,lot){
  const risk=capital*riskPct/100, per=entry-stop;
  if(!(per>0)||!(entry>0)) return null;
  let sh=Math.floor(risk/per); if(lot>1) sh=Math.floor(sh/lot)*lot;
  const val=sh*entry; return {shares:sh,value:val,riskAmt:sh*per,pctCap:val/capital*100,stopPct:per/entry*100};
}
function kelly(p,b){ return p-(1-p)/b; }
function recoveryNeeded(dd){ return 1/(1-dd)-1; }
function compoundSeries(P,monthly,rate,years){
  const out=[]; let v=P, inv=P; const r=rate/100/12;
  for(let m=1;m<=years*12;m++){ v=v*(1+r)+monthly; inv+=monthly; if(m%12===0) out.push({y:m/12,v,inv}); }
  return out;
}
function hoseTick(p){ return p<10000?10: p<50000?50:100; }
function priceBand(ref,ex){
  const b= ex==='HNX'?.10: ex==='UPCOM'?.15:.07;
  const tickOf=p=> ex==='HOSE'? hoseTick(p) : 100;
  const upRaw=ref*(1+b), dnRaw=ref*(1-b);
  const ceil=Math.floor(upRaw/tickOf(upRaw)+1e-9)*tickOf(upRaw);
  const floor=Math.ceil(dnRaw/tickOf(dnRaw)-1e-9)*tickOf(dnRaw);
  return {ceil,floor,b};
}

function mdLite(src){
  const lines=esc(src).split('\n'); let html='', inList=false;
  const inline=t=>t.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/(^|[^*])\*(?!\s)(.+?)\*(?!\*)/g,'$1<i>$2</i>');
  lines.forEach(l=>{
    const t=l.trim();
    if(/^#{1,4}\s/.test(t)){ if(inList){html+='</ul>';inList=false;} html+='<h4>'+inline(t.replace(/^#{1,4}\s/,''))+'</h4>'; }
    else if(/^[-*•]\s/.test(t)){ if(!inList){html+='<ul>';inList=true;} html+='<li>'+inline(t.replace(/^[-*•]\s/,''))+'</li>'; }
    else if(/^\d+[.)]\s/.test(t)){ if(!inList){html+='<ul>';inList=true;} html+='<li>'+inline(t.replace(/^\d+[.)]\s/,''))+'</li>'; }
    else if(!t){ if(inList){html+='</ul>';inList=false;} }
    else { if(inList){html+='</ul>';inList=false;} html+='<p>'+inline(t)+'</p>'; }
  });
  if(inList) html+='</ul>'; return html;
}

function updateSendBtn(){ const b=$('#aiSend'); if(!b) return; b.textContent=CHAT.busy?'Dừng':'Gửi'; b.setAttribute('aria-label',CHAT.busy?'Dừng trả lời':'Gửi'); }
function drawMsgs(){
  const m=$('#msgs'); if(!m) return;
  if(!CHAT.turns.length&&!CHAT.busy){ m.innerHTML='<div class="msg sys">Chọn một câu hỏi gợi ý hoặc tự đặt câu hỏi. Trợ lý nhìn thấy điểm, nhân tố, định giá và cờ đỏ của các mã liên quan.</div>'; return; }
  m.innerHTML=CHAT.turns.map(t=> t.role==='user'?`<div class="msg u">${esc(t.content)}</div>`:`<div class="msg a">${t.err?`<p class="dn">${esc(t.content)}</p>`:mdLite(t.content)}</div>`).join('')+(CHAT.busy?`<div class="msg a" id="streamMsg">${CHAT.partial?mdLite(CHAT.partial):'<span class="typing" aria-label="Đang suy nghĩ"><i></i><i></i><i></i></span> <span class="mut" style="font-size:13px">Đang phân tích…</span>'}</div>`:'');
}
async function askAI(q,focus){
  if(focus) CHAT.focus=focus;
  if(S.view!=='expert'||S.expertTab!=='ai'){ S.expertTab='ai'; setView('expert'); }
  if(CHAT.busy) return;
  if(!SAMPLE_READY){ toast('Trợ lý đang kết nối, thử lại sau giây lát'); return; }
  if(!SAMPLE){ CHAT.turns.push({role:'user',content:q}); CHAT.turns.push({role:'assistant',content:'Trợ lý AI không khả dụng ở chế độ xem này (cần mở trong Claude và đăng nhập). Dưới đây là báo cáo thuật toán thay thế — mở mã trong phần Sàng lọc để xem đầy đủ.',err:true}); drawMsgs(); if(focus) setTimeout(()=>openStock(focus),400); return; }
  const rules=buildRules(q);
  CHAT.turns.push({role:'user',content:q}); CHAT.busy=true; CHAT.partial=''; CHAT.ctl=new AbortController(); drawMsgs(); updateSendBtn();
  const hist=CHAT.turns.filter(t=>!t.err).slice(-8);
  while(hist.length&&hist[0].role!=='user') hist.shift();
  try{
    const res=await SAMPLE([{role:'user',content:rules}].concat(hist.map(t=>({role:t.role,content:t.content}))),{cache:false,signal:CHAT.ctl.signal,onText:({text})=>{ CHAT.partial=text; const sm=$('#streamMsg'); if(sm) sm.innerHTML=mdLite(text); }});
    CHAT.turns.push({role:'assistant',content:res.text+(res.truncated?'\n\n*(Câu trả lời bị cắt ngắn — hãy hỏi hẹp hơn.)*':'')});
  }catch(e){
    const code=e&&e.code; const keep=e&&e.text;
    if(code==='cancelled'){ if(keep) CHAT.turns.push({role:'assistant',content:keep+'\n\n*(Đã dừng.)*'}); else CHAT.turns.pop(); }
    else { if(keep&&code!=='refused') CHAT.turns.push({role:'assistant',content:keep}); CHAT.turns.push({role:'assistant',content:AI_ERR[code]||AI_ERR.upstream_error,err:true}); if(['not_granted','sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(code)) SAMPLE=null; }
  }
  CHAT.busy=false; CHAT.partial=''; CHAT.ctl=null; drawMsgs(); updateSendBtn();
  const m=$('#msgs'); if(m&&m.lastElementChild) m.lastElementChild.scrollIntoView({block:'nearest',behavior:REDUCED()?'auto':'smooth'});
}

RENDER.port=function(){

  const tot=raw.reduce((a,b)=>a+b,0)||1; const w=raw.map(x=>x/tot);
  const wavg=f=>H.reduce((a,s,i)=>a+(isNum(f(s))?f(s)*w[i]:0),0)/(H.reduce((a,s,i)=>a+(isNum(f(s))?w[i]:0),0)||1);
  const hhi=w.reduce((a,b)=>a+b*b,0);
  const pe=1/H.reduce((a,s,i)=>a+(isNum(s.pe)&&s.pe>0?w[i]/s.pe:0),0);
  const sec={}; H.forEach((s,i)=>{ sec[s.s]=(sec[s.s]||0)+w[i]; });
  const secArr=Object.entries(sec).sort((a,b)=>b[1]-a[1]).map(([k,v],i)=>({k,v,c:CAT[i%CAT.length]}));
  const mUS=H.reduce((a,s,i)=>a+(s.m==='US'?w[i]:0),0);
  const fac=FACTORS.map(F=>wavg(s=>s._f[F.k])/100);
  const med=marketMedianFactors(S.market);
  const warns=[]; if(secArr[0]&&secArr[0].v>.4) warns.push(`Ngành ${SECTORS[secArr[0].k]} chiếm ${pct(secArr[0].v*100,0)} — tập trung cao.`);
  const mxw=Math.max(...w); if(mxw>.25) warns.push(`Một mã chiếm ${pct(mxw*100,0)} danh mục.`);
  if(1/hhi<5) warns.push('Số mã hiệu dụng dưới 5 — rủi ro riêng lẻ còn lớn.');
  const flagged=H.filter(s=>s._flags.length).map(s=>s.t); if(flagged.length) warns.push('Có cờ đỏ: '+flagged.join(', ')+'.');
  el.innerHTML=`<div class="sec-h" style="margin:0"><div><h2>Danh mục của bạn</h2><p>${sample?'<b style="color:var(--gold)">Danh mục mẫu</b>: 8 mã điểm cao nhất. Chạm ngôi sao ở bất kỳ mã nào để tạo danh mục riêng.':H.length+' mã đang theo dõi'}</p></div></div>
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center"><span class="note">Phân bổ tỷ trọng:</span><div class="seg" role="group" aria-label="Cách phân bổ" id="pwSeg">${[['score','Theo điểm²'],['equal','Đều nhau'],['invbeta','Nghịch beta']].map(([k,n])=>`<button data-pw="${k}" aria-pressed="${S.pWeight===k}">${n}</button>`).join('')}</div></div>
  ${(()=>{ const pts=H.map((s,i)=>({q:liveQ(s.t),w:w[i]})).filter(x=>x.q&&isNum(x.q.pct)); if(!pts.length) return ''; const tw=pts.reduce((a,b)=>a+b.w,0); const day=pts.reduce((a,b)=>a+b.q.pct*b.w,0)/tw; return `<div class="disc" style="border-style:solid;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap"><b class="${day>=0?'up':'dn'}" style="font-family:var(--f-disp);font-size:24px">${day>=0?'▲':'▼'} ${fmt(Math.abs(day),2)}%</b><span>Biến động bình quân danh mục phiên gần nhất (theo tỷ trọng, ${pts.length}/${H.length} mã có giá)</span></div>`; })()}
  <div class="port-sum">
    <div><b style="color:${scoreColor(wavg(s=>s._score))}">${fmt(wavg(s=>s._score),0)}</b><span>Điểm La Bàn bình quân</span></div>
    <div><b>${fmt(1/hhi,1)}</b><span>Số mã hiệu dụng (1/HHI)</span></div>
    <div><b>${fmt(wavg(s=>s.b),2)}</b><span>Beta danh mục</span></div>
    <div><b>${pct(wavg(s=>s.dy),1)}</b><span>Tỷ suất cổ tức bình quân</span></div>
    <div><b>${xx(pe,1)}</b><span>P/E bình quân điều hòa</span></div>
    <div><b>${pct(wavg(s=>s.roe),0)}</b><span>ROE bình quân</span></div>
    <div><b>${pct(wavg(s=>s.fg),0)}</b><span>Tăng trưởng EPS kỳ vọng</span></div>
    <div><b>${sgn(wavg(s=>isNum(s._val.blend)?s._val.blend*100:null),0)}</b><span>Biên an toàn ước tính</span></div>
  </div>
  ${warns.length?`<div class="disc" style="border-color:var(--dn);color:var(--fg)"><b class="dn">Cảnh báo rủi ro</b><ul class="bul" style="margin-top:6px">${warns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:'<div class="disc" style="border-color:var(--up)"><b class="up">Phân bổ cân đối</b> — không có cảnh báo tập trung hay cờ đỏ.</div>'}

      <div style="display:flex;height:10px;border-radius:6px;overflow:hidden;margin-top:14px" aria-label="Tỷ trọng theo thị trường"><i style="width:${mUS*100}%;background:var(--us)"></i><i style="width:${(1-mUS)*100}%;background:var(--vn)"></i></div></section>
  </div>
  <section><div class="sec-h"><h2 style="font-size:17px">Tỷ trọng từng mã</h2></div><div class="list">${H.map((s,i)=>`<div class="prow"><button class="star" style="width:auto;justify-content:start;text-align:left;display:block" data-open="${esc(s.t)}"><b style="font-family:var(--f-disp);font-size:15px;color:var(--fg)">${esc(s.t)}</b> <span class="mk ${s.m}">${s.m}</span> <span class="grade g-${s._grade}">${s._score}</span><span style="display:block;font-size:12px;color:var(--mut)">${esc(s.n)}</span></button><span class="bar"><i style="width:${Math.round(w[i]/mxw*100)}%"></i></span><b style="text-align:right">${pct(w[i]*100,1)}${liveQ(s.t)?`<small style="display:block;font-size:11px" class="${boardClass(liveQ(s.t))}">${pctTxt(liveQ(s.t))}</small>`:''}</b>${sample?'<span></span>':`<button class="star" data-star="${esc(s.t)}" aria-pressed="true" aria-label="Bỏ ${esc(s.t)} khỏi danh mục">${starSVG(true)}</button>`}</div>`).join('')}</div></section>

  $$('#pwSeg button').forEach(b=>b.onclick=()=>{ S.pWeight=b.dataset.pw; saveState(); RENDER.port(); });
  animateRadar($('#pRadar'));
};

 {id:'fcf',g:'Định giá',t:'Dòng tiền tự do (FCF)',d:'Tiền thật còn lại sau khi duy trì và mở rộng',

  pts:['Lợi nhuận là quan điểm, tiền mặt là sự thật: so CFO với lợi nhuận ròng nhiều năm.','FCF âm kéo dài chỉ chấp nhận được khi capex tạo ra ROIC cao (giai đoạn đầu tư như HPG Dung Quất 2).','Tỷ suất FCF cao hơn lợi suất trái phiếu chính phủ là dấu hiệu giá hấp dẫn.','FCF dùng để trả cổ tức, mua lại cổ phiếu, trả nợ hoặc M&A — xem doanh nghiệp phân bổ thế nào.'],

  f:'V = Σ CFₜ ÷ (1 + r)ᵗ + TV ÷ (1 + r)ᴺ<small>TV = CFₙ₊₁ ÷ (r − g) — giá trị cuối kỳ (Gordon)</small>',
  pts:['Ba giả định quyết định tất cả: tăng trưởng, chi phí vốn r và tăng trưởng dài hạn g.','Giá trị cuối kỳ thường chiếm 60–80% kết quả — luôn kiểm tra độ nhạy.','g dài hạn không nên vượt tăng trưởng GDP danh nghĩa dài hạn (Mỹ ~2–3%, Việt Nam ~4–6%).','Dùng “Phòng thí nghiệm DCF” trong trang chi tiết để kéo thả từng giả định.'],
  thr:[['r − g nhỏ','Giá trị phóng đại, rất nhạy'],['TV > 75% tổng','Kết quả phụ thuộc giả định dài hạn'],['Biên an toàn','Mua khi giá thấp hơn giá trị 20–30%']],

 {id:'rdcf',g:'Định giá',t:'Định giá ngược',d:'Giá hôm nay đang “đòi hỏi” tăng trưởng bao nhiêu?',

  f:'Tìm g sao cho DCF(g) = Giá hiện tại',
  pts:['Thay vì dự báo, hỏi ngược: thị trường đang đặt cược điều gì?','Nếu g ngầm định cao hơn hẳn khả năng thực tế của ngành → rủi ro thất vọng.','Nếu g ngầm định thấp hơn dự báo thận trọng → biên an toàn.','Phương pháp được Mauboussin & Rappaport phổ biến trong “Expectations Investing”.'],
  thr:[['g ngầm định < kỳ vọng − 4 điểm','Có thể bị định giá thấp'],['Chênh ±4 điểm','Phản ánh sát'],['g ngầm định > kỳ vọng + 4 điểm','Đang kỳ vọng quá cao']],
  hook:'<b>Mẹo nhớ:</b> đừng hỏi “nó đáng bao nhiêu”, hãy hỏi “giá này đòi hỏi điều gì phải xảy ra”.',src:'Rappaport & Mauboussin, Expectations Investing (2001; rev. 2021).'},
 {id:'graham',g:'Định giá',t:'Công thức và số Graham',d:'Hai phép thử phòng thủ kinh điển',
  vis:()=>{ let g=''; for(let i=0;i<15;i++) for(let j=0;j<3;j++) g+=`<rect x="${14+i*11.5}" y="${30+j*14}" width="10" height="12" rx="1.5" style="fill:var(--gold);fill-opacity:${j<2?.8:.35}"/>`;

  pts:['Ứng dụng giới hạn g ở 15% để tránh phóng đại — Graham luôn ưu tiên thận trọng.','Số Graham chỉ hợp với doanh nghiệp tài sản hữu hình; doanh nghiệp tài sản vô hình (phần mềm) thường “trượt” dù chất lượng cao.','Biên an toàn: mua khi giá thấp hơn giá trị ước tính đủ xa để chịu được sai số.','Tiêu chí phòng thủ còn gồm: quy mô lớn, thanh khoản hiện hành > 2, cổ tức liên tục, EPS không lỗ 10 năm.'],
  thr:[['P/E × P/B < 22,5','Đạt chuẩn Graham'],['Giá < 2/3 giá trị','Biên an toàn rộng']],
  hook:'<b>Mẹo nhớ:</b> 15 và 1,5 — nhân lại thành 22,5.',src:'Benjamin Graham, The Intelligent Investor (rev. 1973), ch. 11 & 14.'},
 {id:'dupont',g:'Chất lượng',t:'Phân tích DuPont',d:'ROE đến từ biên lợi nhuận, hiệu suất hay đòn bẩy?',interactive:'dupont',

 {id:'roic',g:'Chất lượng',t:'ROIC so với WACC',d:'Thước đo duy nhất của việc tạo giá trị',

RENDER.learn=function(){
  const el=$('#v-learn'); const groups=[...new Set(LESSONS.map(l=>l.g))];
  const done=S.learned.filter(id=>LESSONS.some(l=>l.id===id)).length;
  const leit=store.leit||{}; const boxes=[0,0,0,0,0]; QUIZ.forEach((_,i)=>{ boxes[clamp((leit[i]||1)-1,0,4)]++; });
  el.innerHTML=`<div class="sec-h" style="margin:0"><div><h2>Học thuật đầu tư</h2><p>${LESSONS.length} thẻ kiến thức hình ảnh · nguồn học thuật dẫn kèm</p></div></div>
  <section class="panel" style="display:grid;gap:14px;grid-template-columns:1fr;align-items:center">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><b style="font-family:var(--f-disp);font-size:17px">Tiến độ: ${done}/${LESSONS.length} bài</b><span class="note">Kỷ lục ôn tập: ${S.quizBest}/8</span></div>
    <div class="progress" aria-label="Tiến độ học"><i style="width:${done/LESSONS.length*100}%"></i></div>
    <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
      <button class="btn pri" id="startQuiz">Ôn tập 8 câu</button>
      <div style="display:flex;gap:4px;align-items:flex-end;height:34px" aria-label="Phân bố hộp Leitner">${boxes.map((n,i)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:2px"><i style="display:block;width:18px;height:${4+n*1.4}px;border-radius:3px;background:var(--gold);opacity:${.35+i*.16}"></i><span style="font-size:10px;color:var(--mut)">H${i+1}</span></div>`).join('')}</div>
      <p class="note" style="flex:1;min-width:180px">Hệ thống hộp Leitner: trả lời đúng, câu hỏi lên hộp cao và ít xuất hiện lại; trả lời sai, câu quay về hộp 1.</p>
    </div>
  </section>
  ${groups.map(g=>`<section><div class="sec-h"><h2 style="font-size:18px">${esc(g)}</h2></div><div class="learn-grid">${LESSONS.filter(l=>l.g===g).map(l=>`<button class="lcard" data-lesson="${l.id}"><span class="th">${l.vis()}${S.learned.includes(l.id)?'<span class="done" aria-label="Đã học"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><path d="M5 12l5 5 9-10"/></svg></span>':''}</span><span class="tx"><b>${esc(l.t)}</b><span>${esc(l.d)}</span></span></button>`).join('')}</div></section>`).join('')}`;
  $('#startQuiz').onclick=startQuiz;
};
function openLesson(id){
  const l=LESSONS.find(x=>x.id===id); if(!l) return;
  const idx=LESSONS.indexOf(l); const next=LESSONS[(idx+1)%LESSONS.length];
  const html=`<div class="lesson">
    <p class="note">${typeof lessonCrumb==='function'?lessonCrumb(l):esc(l.g)+' · Bài '+(idx+1)+'/'+LESSONS.length}</p>
    <div class="vis">${l.vis()}</div>
    <div class="formula">${l.f}</div>
    ${l.interactive==='dupont'?`<section class="panel" style="display:flex;flex-direction:column;gap:10px"><b style="font-family:var(--f-disp)">Thử nghiệm DuPont</b>
      <label class="slider-row"><span>Biên ròng</span><input type="range" id="duN" min="1" max="40" step="0.5" value="10"><output id="duNo"></output></label>
      <label class="slider-row"><span>Vòng quay TS</span><input type="range" id="duA" min="0.1" max="3" step="0.05" value="0.8"><output id="duAo"></output></label>
      <label class="slider-row"><span>Đòn bẩy</span><input type="range" id="duL" min="1" max="12" step="0.1" value="2"><output id="duLo"></output></label>
      <div class="result" id="duOut"></div></section>`:''}
    <ul class="bul">${l.pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>
    ${l.thr&&l.thr.length?`<table class="thr"><thead><tr><th>Mốc</th><th>Diễn giải</th></tr></thead><tbody>${l.thr.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join('')}</tbody></table>`:''}
    <div class="hook">${l.hook}</div>
    <p class="note"><b>Nguồn:</b> ${esc(l.src)}</p>
    <div class="row-btns"><button class="btn ${S.learned.includes(l.id)?'':'pri'}" id="lDone">${S.learned.includes(l.id)?'✓ Đã học':'Đánh dấu đã học'}</button><button class="btn" id="lNext">Bài tiếp: ${esc(next.t)}</button></div>
  </div>`;
  openSheet(l.t,html,body=>{
    $('#lDone').onclick=()=>{ if(!S.learned.includes(l.id)) S.learned.push(l.id); else S.learned=S.learned.filter(x=>x!==l.id); saveState(); if(S.view==='learn') RENDER.learn(); openLesson(l.id); };
    $('#lNext').onclick=()=>openLesson(next.id);
    if(l.interactive==='dupont'){ const up=()=>{ const n=+$('#duN').value,a=+$('#duA').value,L=+$('#duL').value; $('#duNo').textContent=fmt(n,1)+'%'; $('#duAo').textContent=fmt(a,2)+'x'; $('#duLo').textContent=fmt(L,1)+'x'; const roe=n*a*L, roa=n*a;
      $('#duOut').innerHTML=`<div><b class="gold">${pct(roe,1)}</b><span>ROE</span></div><div><b>${pct(roa,1)}</b><span>ROA = biên × vòng quay</span></div><div><b>${L>4?'<span class="dn">Cao</span>':'Vừa phải'}</b><span>Mức đòn bẩy (${L>4?'phụ thuộc nợ':'lành mạnh với DN phi tài chính'})</span></div>`; };
      ['duN','duA','duL'].forEach(i=>$('#'+i).oninput=up); up(); }
  });
}
/* ---------- ôn tập Leitner ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function pickQuestions(n){
  const leit=store.leit||{}; const items=QUIZ.map((q,i)=>({i,b:leit[i]||1,r:Math.random()}));
  items.sort((a,b)=>a.b-b.b||a.r-b.r); return items.slice(0,n).map(x=>x.i);
}
function startQuiz(){
  const qs=pickQuestions(8); const st={k:0,score:0,qs};
  const render=()=>{
    if(st.k>=st.qs.length){ if(st.score>S.quizBest){ S.quizBest=st.score; saveState(); }
      $('#sheetBody').innerHTML=`<div class="lesson" style="text-align:center;align-items:center"><div class="bigring" style="margin:10px auto">${ringSVG(st.score/st.qs.length*100,108,9)}<div class="v"><b>${st.score}/${st.qs.length}</b><span>câu đúng</span></div></div>
        <p>${st.score>=7?'Xuất sắc — kiến thức đang vào hộp dài hạn.':st.score>=5?'Khá tốt. Các câu sai sẽ quay lại sớm hơn.':'Hãy xem lại các thẻ kiến thức liên quan rồi ôn lần nữa.'}</p>
        <div class="row-btns" style="justify-content:center"><button class="btn pri" id="qAgain">Ôn thêm 8 câu</button><button class="btn" id="qClose">Về thư viện</button></div></div>`;
      animateRings($('#sheetBody')); $('#qAgain').onclick=startQuiz; $('#qClose').onclick=()=>{ closeSheet(); if(S.view==='learn') RENDER.learn(); }; return; }
    const qi=st.qs[st.k], Q=QUIZ[qi]; const order=shuffle(Q.a.map((t,i)=>({t,i})));
    $('#sheetBody').innerHTML=`<div class="lesson"><div style="display:flex;justify-content:space-between;align-items:center"><span class="note">Câu ${st.k+1}/${st.qs.length} · Hộp ${(store.leit||{})[qi]||1}</span><span class="note">Đúng: ${st.score}</span></div>
      <div class="progress"><i style="width:${st.k/st.qs.length*100}%"></i></div>
      <h3 style="font-size:19px;line-height:1.3">${esc(Q.q)}</h3>
      <div style="display:flex;flex-direction:column;gap:8px" id="qOpts">${order.map(o=>`<button class="quiz-opt" data-i="${o.i}">${esc(o.t)}</button>`).join('')}</div>
      <div class="row-btns"><button class="btn sm ghost" id="qHint">Gợi ý: loại một đáp án sai</button></div>
      <div id="qFb"></div></div>`;
    let answered=false;
    $('#qHint').onclick=()=>{ const wrong=$$('#qOpts .quiz-opt').filter(b=>+b.dataset.i!==Q.c&&!b.disabled); if(wrong.length>1){ const w=wrong[Math.floor(Math.random()*wrong.length)]; w.disabled=true; w.style.opacity=.35; } $('#qHint').disabled=true; };
    $$('#qOpts .quiz-opt').forEach(b=>b.onclick=()=>{ if(answered) return; answered=true; const ok=+b.dataset.i===Q.c;
      $$('#qOpts .quiz-opt').forEach(x=>{ if(+x.dataset.i===Q.c) x.classList.add('ok'); x.disabled=true; }); if(!ok) b.classList.add('bad');
      const leit=store.leit||{}; leit[qi]= ok? Math.min(5,(leit[qi]||1)+1) : 1; store.leit=leit; persist(); if(ok) st.score++;
      $('#qHint').disabled=true;
      $('#qFb').innerHTML=`<div class="hook" style="border-color:${ok?'var(--up)':'var(--dn)'}"><b style="color:${ok?'var(--up)':'var(--dn)'}">${ok?'Chính xác.':'Chưa đúng.'}</b> ${esc(Q.e)}</div><div class="row-btns" style="margin-top:10px"><button class="btn pri" id="qNext">${st.k+1<st.qs.length?'Câu tiếp':'Xem kết quả'}</button></div>`;
      $('#qNext').onclick=()=>{ st.k++; render(); }; $('#qNext').focus({preventScroll:true}); });
  };
  openSheet('Ôn tập kiến thức','',()=>render());
}

function bindGlobal(){
  document.addEventListener('click',e=>{
    const st=e.target.closest('[data-star]'); if(st){ e.stopPropagation(); toggleStar(st.dataset.star); const on=isStar(st.dataset.star); st.setAttribute('aria-pressed',String(on)); st.innerHTML=starSVG(on); if(S.view==='port') RENDER.port(); return; }
    const es=e.target.closest('[data-estar]'); if(es){ e.stopPropagation(); toggleEStar(es.dataset.estar); const on=isEStar(es.dataset.estar); es.setAttribute('aria-pressed',String(on)); es.innerHTML=starSVG(on); return; }
    const op=e.target.closest('[data-open]'); if(op){ openStock(op.dataset.open); return; }
    const et=e.target.closest('[data-etf]'); if(et){ openEtf(et.dataset.etf); return; }
    const pr=e.target.closest('[data-pair]'); if(pr&&!pr.closest('#pairGrid')){ openPair(+pr.dataset.pair); return; }
    const gp=e.target.closest('[data-gopairs]'); if(gp){ S.scrMode='pairs'; saveState(); setView('screen'); return; }
    const go=e.target.closest('[data-go]'); if(go){ setView(go.dataset.go); return; }
    const ls=e.target.closest('[data-lesson]'); if(ls){ openLesson(ls.dataset.lesson); return; }
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeSheet();
    if((e.key==='Enter'||e.key===' ')&&e.target.matches('.srow,.bt-r')){ e.preventDefault(); if(e.target.dataset.etf) openEtf(e.target.dataset.etf); else openStock(e.target.dataset.open); }
    if(e.key==='Tab'&&!$('#sheet').hidden){ const f=$$('#sheetCard button,#sheetCard input,#sheetCard select,#sheetCard textarea,#sheetCard summary').filter(x=>!x.disabled&&x.offsetParent!==null); if(!f.length) return; const first=f[0],last=f[f.length-1];
      if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); } else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); } }
  });
  $$('#tabbar button').forEach(b=>b.onclick=()=>setView(b.dataset.v));
  $$('#mktSeg button').forEach(b=>b.onclick=()=>setMarket(b.dataset.m));
  $('#settingsBtn').onclick=openSettings;
  $('#sheetClose').onclick=closeSheet; $('#scrim').onclick=closeSheet;
  /* vuốt xuống để đóng sheet trên điện thoại */
  let y0=null; const head=$('.sheet-head');
  head.addEventListener('touchstart',e=>{ y0=e.touches[0].clientY; },{passive:true});
  head.addEventListener('touchend',e=>{ if(y0!=null&&e.changedTouches[0].clientY-y0>70) closeSheet(); y0=null; },{passive:true});
}
function boot(){
  if(S.theme!=='system') applyTheme();
  computeAll(); bindGlobal(); initLive();
  $$('#mktSeg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.m===S.market)));
  const h=(location.hash||'').replace('#','');
  setView(VIEWS.includes(h)?h:'home',{keepScroll:true});
}

  m=x.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/); if(m) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  m=x.match(/^(\d{4})(\d{2})(\d{2})$/); if(m) return `${m[1]}-${m[2]}-${m[3]}`;

}

  const num=v=>{ v=String(v).trim().replace(/"/g,''); if(delim===';'&&/^\d{1,3}(\.\d{3})*(,\d+)?$/.test(v)) v=v.replace(/\./g,'').replace(',','.'); else v=v.replace(/,/g,''); const f=parseFloat(v); return isFinite(f)?f:null; };

  const head=lines[0].toLowerCase().split(delim).map(h=>h.trim().replace(/"/g,''));
  if(!parseDateStr(head[0])){
    start=1; const find=(...ks)=>head.findIndex(h=>ks.some(k=>h===k||h.startsWith(k)));
    const m={d:find('date','ngày','ngay','time','tradingdate'),o:find('open','mở','mo cua','giá mở'),h:find('high','cao'),l:find('low','thấp','thap'),c:find('adj close','close','đóng','dong','giá đóng'),v:find('volume','vol','khối','khoi','kl')};
    if(head.includes('close')) m.c=head.indexOf('close');
    if(m.d>=0&&m.o>=0&&m.h>=0&&m.l>=0&&m.c>=0) idx=m; else return {err:'Không nhận ra tiêu đề cột. Cần các cột: Date, Open, High, Low, Close, Volume.'};
  }
  const rows=[];
  for(let i=start;i<lines.length;i++){ const p=lines[i].split(delim); const d=parseDateStr(p[idx.d]); const o=num(p[idx.o]),h=num(p[idx.h]),l=num(p[idx.l]),c=num(p[idx.c]); const v= idx.v>=0? num(p[idx.v]) : 0;
    if(d&&o>0&&h>0&&l>0&&c>0) rows.push({d,o,h:Math.max(h,o,c),l:Math.min(l,o,c),c,v:v||0}); }

  if(uniq.length<30) return {err:`Chỉ đọc được ${uniq.length} dòng hợp lệ — cần ít nhất 30.`};

}

  if(q&&Array.isArray(q.hist)&&q.hist.length>=20){ const rows=q.hist.filter(b=>isNum(b[4])).map(b=>{ const c=b[4], o=isNum(b[1])?b[1]:c, h=isNum(b[2])?Math.max(b[2],o,c):Math.max(o,c), l=isNum(b[3])?Math.min(b[3],o,c):Math.min(o,c); return {d:b[0],o,h,l,c,v:isNum(b[5])?b[5]:0}; }); return {rows,real:true,src:'live',from:q.src,flat:q.hist.filter(b=>b[6]).length}; }

function saveOHLC(t,rows){ store.ohlc=store.ohlc||{}; store.ohlc[t]=rows.map(r=>[r.d,+r.o.toFixed(4),+r.h.toFixed(4),+r.l.toFixed(4),+r.c.toFixed(4),Math.round(r.v)]); persist(); }

/* ---------- chỉ báo (hàm thuần) ---------- */
function sma(a,n){ const o=new Array(a.length).fill(null); let s=0; for(let i=0;i<a.length;i++){ s+=a[i]; if(i>=n) s-=a[i-n]; if(i>=n-1) o[i]=s/n; } return o; }

function rsi(c,n){ n=n||14; const o=new Array(c.length).fill(null); let g=0,l=0;
  for(let i=1;i<c.length;i++){ const d=c[i]-c[i-1], up=Math.max(d,0), dn=Math.max(-d,0);

    else { g=(g*(n-1)+up)/n; l=(l*(n-1)+dn)/n; o[i]=l===0?100:100-100/(1+g/l); } }

function atr(rows,n){ n=n||14; const tr=rows.map((r,i)=>i===0?r.h-r.l:Math.max(r.h-r.l,Math.abs(r.h-rows[i-1].c),Math.abs(r.l-rows[i-1].c)));

/* ---------- nhận diện mẫu nến (hàm thuần) ---------- */

  if(s200[n]!=null&&s50[n]!=null) push('MA50 so với MA200',s50[n]>s200[n]?'Giao cắt vàng':'Giao cắt tử thần',s50[n]>s200[n]?1:-1,s50[n]>s200[n]?'Xu hướng dài hạn tăng':'Xu hướng dài hạn giảm');

}

function linePath(arr,start,end,X,Y,col,w,dash){ let d='', pen=false; for(let i=start;i<end;i++){ const v=arr[i]; if(v==null){ pen=false; continue; } d+=(pen?'L':'M')+X(i-start).toFixed(1)+' '+Y(v).toFixed(1)+' '; pen=true; } return d?`<path d="${d}" fill="none" style="stroke:${col}" stroke-width="${w}"${dash?` stroke-dasharray="${dash}"`:''} stroke-linejoin="round"/>`:''; }

function fmtVol(v){ return v>=1e9? fmt(v/1e9,1)+' tỷ': v>=1e6? fmt(v/1e6,1)+' tr': v>=1e3? fmt(v/1e3,0)+' k' : fmt(v,0); }

    tip.hidden=false; const tw=tip.offsetWidth; const left=(x/sx>rect.width/2)? x/sx-tw-12 : x/sx+12; tip.style.left=clamp(left,4,rect.width-tw-4)+'px'; tip.style.top='8px'; };

function cdlSVG(p,opt){
  opt=opt||{}; const ctxN=p.ctx==='none'?1:3; const all=[]; const first=p.c[0]; const fh=first[1], fl=first[2];
  const f0=Math.max(first[0],first[3]), f1=Math.min(first[0],first[3]);
  if(p.ctx==='down'){ for(let i=0;i<ctxN;i++){ const c=f0+(ctxN-1-i)*7+1, o=c+7; all.push({b:[o,o+1.5,c-1.5,c],ctx:1}); } }
  else if(p.ctx==='up'){ for(let i=0;i<ctxN;i++){ const c=f1-(ctxN-1-i)*7-1, o=c-7; all.push({b:[o,c+1.5,o-1.5,c],ctx:1}); } }
  else all.push({b:[48,56,44,52],ctx:1});
  p.c.forEach(b=>all.push({b,ctx:0}));
  let lo=Infinity,hi=-Infinity; all.forEach(x=>{ lo=Math.min(lo,x.b[2]); hi=Math.max(hi,x.b[1]); }); const pad=(hi-lo)*.08; lo-=pad; hi+=pad;
  const W=200,H=opt.h||125, bw=Math.min(20,150/all.length*.6), step=Math.min(34,180/all.length), x0=(W-step*all.length)/2+step/2;
  const Y=v=>8+(hi-v)/(hi-lo)*(H-16); let g='';
  all.forEach((x,i)=>{ const [o,h,l,c]=x.b; const up=c>=o; const dj=Math.abs(c-o)<=(h-l)*.04; const col=x.ctx?'var(--mut2)':dj?'var(--ref)':up?'var(--up)':'var(--dn)'; const cx=x0+i*step; const yt=Y(Math.max(o,c)), yb=Y(Math.min(o,c));
    g+=`<line x1="${cx}" x2="${cx}" y1="${Y(h).toFixed(1)}" y2="${Y(l).toFixed(1)}" style="stroke:${col}" stroke-width="1.6"/><rect x="${(cx-bw/2).toFixed(1)}" y="${yt.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.6,yb-yt).toFixed(1)}" rx="1.5" style="fill:${col};fill-opacity:${x.ctx?.45:1};stroke:${col}"/>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Mẫu nến ${esc(p.n)}">${g}</svg>`;
}

function cpatSVG(p){
  let g=`<polyline points="${p.pts.map(x=>x.join(',')).join(' ')}" fill="none" style="stroke:var(--fg)" stroke-width="2.2" stroke-linejoin="round"/>`;
  if(p.neck) g+=`<line x1="${p.neck[0][0]}" y1="${p.neck[0][1]}" x2="${p.neck[1][0]}" y2="${p.neck[1][1]}" style="stroke:var(--gold)" stroke-width="1.6" stroke-dasharray="5 3"/>`;
  (p.extra||[]).forEach(([a,b])=>g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" style="stroke:var(--us)" stroke-width="1.5" stroke-dasharray="4 3"/>`);
  if(p.tgt){ const [x,y1,y2]=p.tgt; const up=y2<y1; g+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" style="stroke:${up?'var(--up)':'var(--dn)'}" stroke-width="2"/><path d="M${x} ${y2} l-4 ${up?7:-7} h8z" style="fill:${up?'var(--up)':'var(--dn)'}"/>`; }
  return `<svg class="chart" viewBox="0 0 200 120" role="img" aria-label="Mô hình giá ${esc(p.n)}">${g}</svg>`;
}

 {id:'dow',g:'Phân tích kỹ thuật',t:'Lý thuyết Dow',d:'Nền móng của phân tích xu hướng',
  vis:()=>{ const pts=[[10,100],[40,70],[55,85],[90,45],[105,62],[140,25],[155,40],[190,15]]; return sv(`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:var(--up)" stroke-width="2"/>${[[40,70,'Đ1'],[90,45,'Đ2'],[140,25,'Đ3']].map(([x,y,l])=>T(x,y-5,l,'text-anchor="middle" style="font-size:8px;font-weight:700;fill:var(--up)"')).join('')}${[[55,85,'đ1'],[105,62,'đ2'],[155,40,'đ3']].map(([x,y,l])=>T(x,y+12,l,'text-anchor="middle" style="font-size:8px;font-weight:700;fill:var(--gold)"')).join('')}${T(100,118,'Đỉnh sau cao hơn đỉnh trước, đáy sau cao hơn đáy trước','text-anchor="middle" '+TS)}`,'Xu hướng tăng với đỉnh và đáy cao dần'); },
  f:'Xu hướng tăng = đỉnh cao dần + đáy cao dần',
  pts:['Thị trường có ba xu hướng: chính (nhiều tháng–năm), thứ cấp (vài tuần–tháng, điều chỉnh 1/3–2/3 nhịp chính), nhỏ (vài ngày).','Xu hướng chính có ba pha: tích lũy (nhà đầu tư hiểu biết mua), tham gia đại chúng, và phân phối.','Các chỉ số phải xác nhận lẫn nhau (ban đầu là chỉ số công nghiệp và vận tải).','Khối lượng phải xác nhận xu hướng: tăng theo hướng của xu hướng chính.','Xu hướng còn hiệu lực cho đến khi có tín hiệu đảo chiều rõ ràng.'],
  thr:[['Đỉnh thấp hơn + thủng đáy','Xu hướng tăng bị phá vỡ']],
  hook:'<b>Mẹo nhớ:</b> “Xu hướng là bạn — cho đến khi nó gãy.”',src:'Charles H. Dow (Wall Street Journal, 1900–1902); Rhea, The Dow Theory (1932).'},
 {id:'sr',g:'Phân tích kỹ thuật',t:'Hỗ trợ, kháng cự và đường xu hướng',d:'Nơi cung cầu từng gặp nhau',
  vis:()=>sv(`<line x1="5" x2="195" y1="30" y2="30" style="stroke:var(--dn)" stroke-dasharray="5 3" stroke-width="1.5"/><line x1="5" x2="195" y1="90" y2="90" style="stroke:var(--up)" stroke-dasharray="5 3" stroke-width="1.5"/><polyline points="5,80 30,32 55,88 85,31 110,89 140,32 160,60 190,10" fill="none" style="stroke:var(--fg)" stroke-width="2"/>${T(8,24,'Kháng cự','style="font-size:8px;fill:var(--dn);font-weight:700"')}${T(8,102,'Hỗ trợ','style="font-size:8px;fill:var(--up);font-weight:700"')}${T(170,24,'Phá vỡ','style="font-size:8px;font-weight:700;fill:var(--gold)"')}`,'Vùng hỗ trợ và kháng cự'),
  f:'Kháng cự bị phá vỡ thường trở thành hỗ trợ (và ngược lại)',
  pts:['Hỗ trợ: vùng giá mà lực mua từng đủ mạnh để chặn đà giảm; kháng cự: ngược lại.','Vẽ vùng (dải giá) hơn là một đường đơn; càng được chạm nhiều lần, vùng càng quan trọng — cho đến khi bị phá.','Số tròn (50.000đ, $100), đỉnh/đáy cũ, đường MA200 thường đóng vai trò hỗ trợ/kháng cự tâm lý.','Đường xu hướng tăng nối ít nhất hai đáy cao dần; xác nhận bằng lần chạm thứ ba.','Phá vỡ đáng tin khi đóng cửa vượt rõ ràng kèm khối lượng lớn; ở Việt Nam, phiên ATC có thể tạo phá vỡ giả.'],
  thr:[['Đóng cửa vượt > 3% kèm KL > 1,5 lần TB','Phá vỡ có xác nhận']],
  hook:'<b>Mẹo nhớ:</b> trần nhà cũ thành sàn nhà mới.',src:'Edwards & Magee, Technical Analysis of Stock Trends (1948; 11th ed. 2018).'},
 {id:'ma',g:'Phân tích kỹ thuật',t:'Đường trung bình động (MA)',d:'SMA, EMA, giao cắt vàng và tử thần',
  vis:()=>{ const X=v=>10+v*1.8, f=x=>60-25*Math.sin(x/16)-x*.15; let g=`<path d="${pathFn(f,0,100,X,v=>v)}" fill="none" style="stroke:var(--fg)" stroke-width="1.3"/>`;
    g+=`<path d="${pathFn(x=>f(x-6)+3,6,100,X,v=>v)}" fill="none" style="stroke:var(--us)" stroke-width="1.8"/><path d="${pathFn(x=>60-x*.15-10*Math.sin((x-14)/16),14,100,X,v=>v)}" fill="none" style="stroke:var(--gold)" stroke-width="1.8"/>`;
    return sv(g+T(150,112,'MA ngắn','style="font-size:8px;fill:var(--us);font-weight:700"')+T(10,112,'MA dài','style="font-size:8px;fill:var(--gold);font-weight:700"'),'Đường trung bình ngắn và dài'); },
  f:'SMAₙ = (C₁ + … + Cₙ) ÷ n · EMA = C × k + EMA₋₁ × (1 − k), k = 2/(n+1)',
  pts:['SMA cho trọng số đều; EMA ưu tiên giá gần nhất nên phản ứng nhanh hơn.','Phổ biến: MA20 (1 tháng), MA50 (quý), MA200 (năm). Nhiều quỹ dùng MA200 làm ranh giới thị trường tăng/giảm.','Giao cắt vàng: MA50 cắt lên MA200; giao cắt tử thần: cắt xuống. Đây là tín hiệu trễ — xác nhận chứ không dự báo.','MA là hỗ trợ/kháng cự động trong xu hướng mạnh.','Trong thị trường đi ngang, giao cắt MA cho rất nhiều tín hiệu giả.'],
  thr:[['Giá > MA50 > MA200','Cấu trúc tăng'],['Giá < MA50 < MA200','Cấu trúc giảm']],
  hook:'<b>Mẹo nhớ:</b> MA cho biết “đang ở đâu”, không cho biết “sẽ đi đâu”.',src:'Murphy, Technical Analysis of the Financial Markets (1999), ch. 9.'},
 {id:'rsi-l',g:'Phân tích kỹ thuật',t:'RSI – Chỉ số sức mạnh tương đối',d:'Quá mua, quá bán và phân kỳ',
  vis:()=>{ const X=v=>10+v*1.8, Y=v=>110-v; let g=`<rect x="10" y="${Y(70)}" width="180" height="40" style="fill:var(--gold);fill-opacity:.1"/><line x1="10" x2="190" y1="${Y(70)}" y2="${Y(70)}" style="stroke:var(--dn)" stroke-dasharray="4 3"/><line x1="10" x2="190" y1="${Y(30)}" y2="${Y(30)}" style="stroke:var(--up)" stroke-dasharray="4 3"/>`;
    g+=`<path d="${pathFn(x=>50+32*Math.sin(x/9)+5*Math.sin(x/3),0,100,X,Y)}" fill="none" style="stroke:var(--ceil)" stroke-width="2"/>`;
    return sv(g+T(192,Y(70)+3,'70','text-anchor="end" style="font-size:8px;fill:var(--dn)"')+T(192,Y(30)+3,'30','text-anchor="end" style="font-size:8px;fill:var(--up)"'),'Đường RSI dao động giữa 30 và 70'); },
  f:'RSI = 100 − 100 ÷ (1 + RS) · RS = TB tăng 14 phiên ÷ TB giảm 14 phiên (làm mượt Wilder)',
  pts:['RSI > 70: quá mua; < 30: quá bán — nhưng trong xu hướng mạnh RSI có thể ở vùng này rất lâu.','Trong xu hướng tăng, RSI thường dao động 40–80; xu hướng giảm: 20–60 (quy tắc của Andrew Cardwell).','Phân kỳ âm: giá lập đỉnh mới nhưng RSI không — động lượng suy yếu. Phân kỳ dương: ngược lại ở đáy.','Biểu đồ trong tab Biểu đồ tính RSI(14) theo phương pháp làm mượt gốc của Wilder.'],
  thr:[['> 70','Quá mua'],['50','Ranh giới động lượng'],['< 30','Quá bán']],
  hook:'<b>Mẹo nhớ:</b> “70 bán bớt, 30 để ý” — nhưng đừng bắt đỉnh trong xu hướng mạnh.',src:'J. Welles Wilder, New Concepts in Technical Trading Systems (1978).'},
 {id:'macd-l',g:'Phân tích kỹ thuật',t:'MACD',d:'Hội tụ – phân kỳ của hai đường EMA',
  vis:()=>{ const X=v=>10+v*1.8, Ym=v=>62-v*2.2; let g=`<line x1="10" x2="190" y1="62" y2="62" style="stroke:var(--line2)"/>`; for(let i=0;i<100;i+=4){ const h=12*Math.sin(i/12)-2*Math.sin(i/5); g+=`<rect x="${X(i)}" y="${Math.min(62,Ym(h))}" width="5" height="${Math.abs(Ym(h)-62)}" style="fill:${h>=0?'var(--up)':'var(--dn)'};fill-opacity:.55"/>`; }
    g+=`<path d="${pathFn(x=>14*Math.sin(x/12),0,100,X,Ym)}" fill="none" style="stroke:var(--us)" stroke-width="1.8"/><path d="${pathFn(x=>14*Math.sin((x-6)/12),6,100,X,Ym)}" fill="none" style="stroke:var(--gold)" stroke-width="1.8"/>`;

  f:'MACD = EMA12 − EMA26 · Tín hiệu = EMA9(MACD) · Histogram = MACD − Tín hiệu',

  thr:[['Giao cắt trên 0','Tín hiệu tăng mạnh hơn'],['Giao cắt dưới 0','Tín hiệu giảm mạnh hơn']],
  hook:'<b>Mẹo nhớ:</b> “12 – 26 – 9”.',src:'Gerald Appel (cuối thập niên 1970); histogram: Thomas Aspray (1986).'},
 {id:'bb-l',g:'Phân tích kỹ thuật',t:'Dải Bollinger',d:'Biến động co giãn quanh trung bình',
  vis:()=>{ const X=v=>10+v*1.8, f=x=>60-x*.2-6*Math.sin(x/8), w=x=>8+14*Math.abs(Math.sin(x/30)); let g=`<path d="${pathFn(x=>f(x)-w(x),0,100,X,v=>v)} L${X(100)} ${(f(100)+w(100)).toFixed(1)} ${pathFn(x=>f(100-x)+w(100-x),0,100,x=>X(100-x),v=>v).replace('M','L')}Z" style="fill:var(--mut);fill-opacity:.12"/>`;
    g+=`<path d="${pathFn(x=>f(x)-w(x),0,100,X,v=>v)}" fill="none" style="stroke:var(--mut)"/><path d="${pathFn(x=>f(x)+w(x),0,100,X,v=>v)}" fill="none" style="stroke:var(--mut)"/><path d="${pathFn(f,0,100,X,v=>v)}" fill="none" style="stroke:var(--mut)" stroke-dasharray="3 3"/><path d="${pathFn(x=>f(x)+w(x)*.8*Math.sin(x/5),0,100,X,v=>v)}" fill="none" style="stroke:var(--fg)" stroke-width="1.5"/>`;

  f:'Giữa = SMA20 · Trên/Dưới = SMA20 ± 2 × độ lệch chuẩn 20 phiên',
  pts:['Khoảng 90% giá đóng cửa nằm trong dải (không phải 95% như phân phối chuẩn, vì giá không phân phối chuẩn).','Dải thắt hẹp (squeeze) = biến động thấp, thường báo trước một nhịp biến động mạnh — nhưng không cho biết hướng.','Chạm dải trên không phải tín hiệu bán: trong xu hướng mạnh giá “cưỡi” dải trên.','%B = (Giá − Dải dưới) ÷ (Dải trên − Dải dưới) đo vị trí giá trong dải.'],
  thr:[['%B > 1','Vượt dải trên'],['%B < 0','Thủng dải dưới']],
  hook:'<b>Mẹo nhớ:</b> dải co lại như lò xo bị nén.',src:'John Bollinger, Bollinger on Bollinger Bands (2001).'},
 {id:'stoch-l',g:'Phân tích kỹ thuật',t:'Dao động Stochastic',d:'Giá đóng cửa ở đâu trong biên độ gần đây',
  vis:()=>{ const X=v=>10+v*1.8, Y=v=>110-v; let g=`<line x1="10" x2="190" y1="${Y(80)}" y2="${Y(80)}" style="stroke:var(--dn)" stroke-dasharray="4 3"/><line x1="10" x2="190" y1="${Y(20)}" y2="${Y(20)}" style="stroke:var(--up)" stroke-dasharray="4 3"/>`;
    g+=`<path d="${pathFn(x=>50+40*Math.sin(x/7),0,100,X,Y)}" fill="none" style="stroke:var(--us)" stroke-width="1.8"/><path d="${pathFn(x=>50+36*Math.sin((x-3)/7),3,100,X,Y)}" fill="none" style="stroke:var(--gold)" stroke-width="1.8"/>`;
